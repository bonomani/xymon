families:
  - family: alpine
    runtime: linux_container
    workflow_file: ref-valid-alpine.yml
    job_id: ref-valid-alpine
    lane_overrides:
      ref_os: linux
      baseline_root: make_linux
      artifact_family: linux
      prepare_profile: default
      checkout_mode: action
      needs_bash_awk: false
      upload_artifacts: true
    container_arm64_overrides:
      checkout_mode: git
      upload_artifacts: false
  - family: archlinux
    runtime: linux_container
    workflow_file: ref-valid-archlinux.yml
    job_id: ref-valid-archlinux
    lane_overrides:
      ref_os: linux
      baseline_root: make_linux
      artifact_family: linux
      prepare_profile: default
      checkout_mode: action
      needs_bash_awk: false
      upload_artifacts: true
  - family: centos7
    runtime: linux_container
    workflow_file: ref-valid-centos7.yml
    job_id: ref-valid-centos7
    lane_overrides:
      ref_os: linux
      baseline_root: make_linux
      artifact_family: linux
      prepare_profile: centos7
      checkout_mode: git
      needs_bash_awk: false
      upload_artifacts: false
  - family: debian
    runtime: linux_container
    workflow_file: ref-valid-debian.yml
