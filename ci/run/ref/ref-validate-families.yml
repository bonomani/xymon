    workflow_file: ref-valid-freebsd.yml
    job_id: ref-valid-freebsd
    lane_overrides:
      ref_os: freebsd
      artifact_family: freebsd
      baseline_root: make_freebsd
      upload_artifacts: true
    os_version_key: freebsd_version
    default_architecture: x86-64
  - family: macos
    runtime: macos_host
    workflow_file: ref-valid-macos.yml
