# Reference validation runtime model:
# - linux_container: Linux container lane on a GitHub runner
# - bsd_vm: BSD guest via VM action
# - macos_host: native macOS runner
runtime_defaults:
  linux_container:
    build_tool: cmake
    ref_os: linux
    baseline_root: make_linux
    artifact_family: linux
    prepare_profile: default
    checkout_mode: action
    upload_artifacts: true
  bsd_vm:
    build_tool: cmake
    upload_artifacts: true
  macos_host:
    build_tool: cmake
    upload_artifacts: true

lane_defaults:
  linux_container:
    _all:
      runs_on: ubuntu-22.04
      container_options: --platform linux/amd64
    arm64:
      runs_on: ubuntu-24.04-arm
      container_options: --platform linux/arm64/v8

families:
- family: alpine
  runtime: linux_container
  container_arm64_overrides:
    checkout_mode: git
    upload_artifacts: false
  lane_file: ci/run/ref/lanes/alpine.yml
- family: archlinux
  runtime: linux_container
  lane_file: ci/run/ref/lanes/archlinux.yml
- family: centos7
  runtime: linux_container
  lane_overrides:
    prepare_profile: centos7
    checkout_mode: git
    upload_artifacts: false
  lane_file: ci/run/ref/lanes/centos7.yml
- family: debian
  runtime: linux_container
  lane_file: ci/run/ref/lanes/debian.yml
- family: freebsd
  runtime: bsd_vm
  lane_overrides:
    ref_os: freebsd
    artifact_family: freebsd
    baseline_root: make_freebsd
  os_version_key: freebsd_version
  default_architecture: x86-64
  lane_file: ci/run/ref/lanes/freebsd.yml
- family: macos
  runtime: macos_host
  lane_overrides:
    ref_os: macos
    artifact_family: macos
    baseline_root: make_freebsd
  os_version_key: macos_version
  runner_key: runner
  default_runner: macos-latest
  lane_file: ci/run/ref/lanes/macos.yml
- family: netbsd
  runtime: bsd_vm
  lane_overrides:
    ref_os: netbsd
    artifact_family: netbsd
    baseline_root: make_netbsd
  os_version_key: netbsd_version
  default_architecture: x86-64
  lane_file: ci/run/ref/lanes/netbsd.yml
- family: openbsd
  runtime: bsd_vm
  lane_overrides:
    ref_os: openbsd
    artifact_family: openbsd
    baseline_root: make_openbsd
  os_version_key: openbsd_version
  default_architecture: x86-64
  lane_file: ci/run/ref/lanes/openbsd.yml
- family: opensuse
  runtime: linux_container
  lane_file: ci/run/ref/lanes/opensuse.yml
- family: rpm
  runtime: linux_container
  lane_overrides:
    prepare_profile: rpm
  lane_file: ci/run/ref/lanes/rpm.yml
- family: ubuntu
  runtime: linux_container
  lane_file: ci/run/ref/lanes/ubuntu.yml
