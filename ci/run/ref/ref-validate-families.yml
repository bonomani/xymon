      ref_os: macos
      artifact_family: macos
      baseline_root: make_freebsd
      upload_artifacts: true
    os_version_key: macos_version
    runner_key: runner
    default_runner: macos-latest
  - family: netbsd
    runtime: bsd_vm
    workflow_file: ref-valid-netbsd.yml
    job_id: ref-valid-netbsd
    lane_overrides:
