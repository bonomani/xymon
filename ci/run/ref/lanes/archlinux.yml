include:
- name: Arch Linux amd64 - Server
  runs_on: ubuntu-22.04
  container: archlinux:latest
  container_options: --platform linux/amd64
  variant: server
  allow_failure: false
- name: Arch Linux amd64 - Client (ct-client)
  runs_on: ubuntu-22.04
  container: archlinux:latest
  container_options: --platform linux/amd64
  variant: localclient
  allow_failure: false
- name: Arch Linux amd64 - Client (ct-server)
  runs_on: ubuntu-22.04
  container: archlinux:latest
  container_options: --platform linux/amd64
  variant: client
  allow_failure: false
- name: Arch Linux base amd64 - Server
  runs_on: ubuntu-22.04
  container: archlinux:base
  container_options: --platform linux/amd64
  variant: server
  allow_failure: false
- name: Arch Linux base amd64 - Client (ct-client)
  runs_on: ubuntu-22.04
  container: archlinux:base
  container_options: --platform linux/amd64
  variant: localclient
  allow_failure: false
- name: Arch Linux base amd64 - Client (ct-server)
  runs_on: ubuntu-22.04
  container: archlinux:base
  container_options: --platform linux/amd64
  variant: client
  allow_failure: false
