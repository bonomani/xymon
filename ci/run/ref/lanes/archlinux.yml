defaults:
  _all:
    runs_on: ubuntu-22.04
    container_options: --platform linux/amd64
include:
- name_prefix: Arch Linux amd64
  platform_id: archlinux-latest
  variants: [server, localclient, client]
- name_prefix: Arch Linux base amd64
  platform_id: archlinux-base
  variants: [server, localclient, client]
