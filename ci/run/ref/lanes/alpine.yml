defaults:
  _all:
    runs_on: ubuntu-22.04
    container_options: --platform linux/amd64
  arm64:
    runs_on: ubuntu-24.04-arm
    container_options: --platform linux/arm64/v8
include:
- name_prefix: Alpine 3.23 amd64
  platform_id: alpine-3_23
  variants: [server, localclient, client]
- name_prefix: Alpine 3.23 arm64
  platform_id: alpine-3_23
  defaults: arm64
  variants: [server, localclient, client]
- name_prefix: Alpine 3.22 amd64
  platform_id: alpine-3_22
  variants: [server, localclient, client]
- name_prefix: Alpine 3.22 arm64
  platform_id: alpine-3_22
  defaults: arm64
  variants: [server, localclient, client]
- name_prefix: Alpine 3.21 amd64
  platform_id: alpine-3_21
  allow_failure: true
  variants: [server, localclient, client]
- name_prefix: Alpine 3.21 arm64
  platform_id: alpine-3_21
  defaults: arm64
  allow_failure: true
  variants: [server, localclient, client]
- name_prefix: Alpine 3.20 amd64
  platform_id: alpine-3_20
  allow_failure: true
  variants: [server, localclient, client]
- name_prefix: Alpine 3.19 amd64
  platform_id: alpine-3_19
  allow_failure: true
  variants: [server, localclient, client]
- name_prefix: Alpine edge amd64
  platform_id: alpine-edge
  allow_failure: true
  variants: [server, localclient, client]
- name_prefix: Alpine edge arm64
  platform_id: alpine-edge
  defaults: arm64
  allow_failure: true
  variants: [server, localclient, client]
