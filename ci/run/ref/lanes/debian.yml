defaults:
  _all:
    runs_on: ubuntu-22.04
    container_options: --platform linux/amd64
  arm64:
    runs_on: ubuntu-24.04-arm
    container_options: --platform linux/arm64/v8
include:
- name_prefix: Debian 13.3-slim amd64
  platform_id: debian-13
  variants: [server, localclient, client]
- name_prefix: Debian 13.3-slim arm64
  platform_id: debian-13
  defaults: arm64
  variants: [server, localclient, client]
- name_prefix: Debian 12.13-slim amd64
  platform_id: debian-12
  variants: [server, localclient, client]
- name_prefix: Debian 12.13-slim arm64
  platform_id: debian-12
  defaults: arm64
  variants: [server, localclient, client]
- name_prefix: Debian 11.11-slim amd64
  platform_id: debian-11
  variants: [server, localclient, client]
- name_prefix: Debian 11.11-slim arm64
  platform_id: debian-11
  defaults: arm64
  variants: [server, localclient, client]
