defaults:
  _all:
    runs_on: ubuntu-22.04
    container_options: --platform linux/amd64
  arm64:
    runs_on: ubuntu-24.04-arm
    container_options: --platform linux/arm64/v8
include:
- name: Ubuntu 24.04 amd64 - Server
  platform_id: ubuntu-24
  variant: server
  allow_failure: false
- name: Ubuntu 24.04 amd64 - Client (ct-client)
  platform_id: ubuntu-24
  variant: localclient
  allow_failure: false
- name: Ubuntu 24.04 amd64 - Client (ct-server)
  platform_id: ubuntu-24
  variant: client
  allow_failure: false
- name: Ubuntu 24.04 arm64 - Server
  platform_id: ubuntu-24
  defaults: arm64
  variant: server
  allow_failure: false
- name: Ubuntu 24.04 arm64 - Client (ct-client)
  platform_id: ubuntu-24
  defaults: arm64
  variant: localclient
  allow_failure: false
- name: Ubuntu 24.04 arm64 - Client (ct-server)
  platform_id: ubuntu-24
  defaults: arm64
  variant: client
  allow_failure: false
