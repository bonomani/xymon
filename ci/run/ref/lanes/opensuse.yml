include:
- name: openSUSE Tumbleweed - Server
  runs_on: ubuntu-22.04
  container: opensuse/tumbleweed:latest
  opensuse_version: tumbleweed
  variant: server
  allow_failure: true
- name: openSUSE Tumbleweed - Client (ct-client)
  runs_on: ubuntu-22.04
  container: opensuse/tumbleweed:latest
  opensuse_version: tumbleweed
  variant: localclient
  allow_failure: true
- name: openSUSE Tumbleweed - Client (ct-server)
  runs_on: ubuntu-22.04
  container: opensuse/tumbleweed:latest
  opensuse_version: tumbleweed
  variant: client
  allow_failure: true
- name: openSUSE Leap 16.0 - Server
  runs_on: ubuntu-22.04
