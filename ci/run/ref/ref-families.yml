# Shared reference family catalog:
# - a family may participate in generation, validation, or both
# - both workflows use the same runtime vocabulary
# - omitting a purpose section means that purpose is disabled for the family
runtime_defaults:
  generation:
    linux_host:
      runs_on: ubuntu-22.04
      build_tool: make
    linux_container:
      runs_on: ubuntu-22.04
      build_tool: make
      prepare_profile: default
      checkout_mode: action
      upload_artifacts: true
    bsd_vm:
      runs_on: ubuntu-22.04
      build_tool: make
      architecture: x86-64
      vm_memory: 1024M
      vm_cpu_count: 2
    macos_host:
      build_tool: make
      upload_artifacts: true
  validation:
    linux_host:
      build_tool: cmake
      ref_os: linux
      baseline_root: make_linux
      artifact_family: linux
      upload_artifacts: true
    linux_container:
      build_tool: cmake
      ref_os: linux
      baseline_root: make_linux
      artifact_family: linux
      prepare_profile: default
      checkout_mode: action
      upload_artifacts: true
    bsd_vm:
      build_tool: cmake
      runs_on: ubuntu-22.04
      upload_artifacts: true
    macos_host:
      build_tool: cmake
      upload_artifacts: true

lane_defaults:
  generation:
    linux_container:
      _all:
        runs_on: ubuntu-22.04
        container_options: --platform linux/amd64
      arm64:
        runs_on: ubuntu-24.04-arm
        container_options: --platform linux/arm64/v8
  validation:
    linux_host:
      _all:
        runs_on: ubuntu-22.04
    linux_container:
      _all:
        runs_on: ubuntu-22.04
        container_options: --platform linux/amd64
      arm64:
        runs_on: ubuntu-24.04-arm
        container_options: --platform linux/arm64/v8

families:
- family: linux
  generation:
    runtime: linux_host
    lane_file: ci/run/ref/make-lanes/linux.yml
    lane_overrides:
      ref_os: linux

- family: alpine
  generation:
    runtime: linux_container
    container_arm64_overrides:
      checkout_mode: git
    lane_file: ci/run/ref/lanes/alpine.yml
    lane_overrides:
      ref_os: linux
  validation:
    runtime: linux_container
    container_arm64_overrides:
      checkout_mode: git
    lane_file: ci/run/ref/lanes/alpine.yml

- family: archlinux
  generation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/archlinux.yml
    lane_overrides:
      ref_os: linux
  validation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/archlinux.yml

- family: centos7
  generation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/centos7.yml
    lane_overrides:
      ref_os: linux
      prepare_profile: centos7
      checkout_mode: git
  validation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/centos7.yml
    lane_overrides:
      prepare_profile: centos7
      checkout_mode: git

- family: debian
  generation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/debian.yml
    lane_overrides:
      ref_os: linux
  validation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/debian.yml

- family: freebsd
  generation:
    runtime: bsd_vm
    lane_file: ci/run/ref/lanes/freebsd.yml
    lane_overrides:
      ref_os: freebsd
    os_version_key: freebsd_version
  validation:
    runtime: bsd_vm
    lane_file: ci/run/ref/lanes/freebsd.yml
    lane_overrides:
      ref_os: freebsd
      artifact_family: freebsd
      baseline_root: make_freebsd
    os_version_key: freebsd_version
    default_architecture: x86-64

- family: macos
  generation:
    runtime: macos_host
    lane_file: ci/run/ref/lanes/macos.yml
    lane_overrides:
      ref_os: macos
    os_version_key: macos_version
    runner_key: runner
    default_runner: macos-latest
  validation:
    runtime: macos_host
    lane_file: ci/run/ref/lanes/macos.yml
    lane_overrides:
      ref_os: macos
      artifact_family: macos
      baseline_root: make_freebsd
    os_version_key: macos_version
    runner_key: runner
    default_runner: macos-latest

- family: netbsd
  generation:
    runtime: bsd_vm
    lane_file: ci/run/ref/lanes/netbsd.yml
    lane_overrides:
      ref_os: netbsd
    os_version_key: netbsd_version
  validation:
    runtime: bsd_vm
    lane_file: ci/run/ref/lanes/netbsd.yml
    lane_overrides:
      ref_os: netbsd
      artifact_family: netbsd
      baseline_root: make_netbsd
    os_version_key: netbsd_version
    default_architecture: x86-64

- family: openbsd
  generation:
    runtime: bsd_vm
    lane_file: ci/run/ref/lanes/openbsd.yml
    lane_overrides:
      ref_os: openbsd
    os_version_key: openbsd_version
  validation:
    runtime: bsd_vm
    lane_file: ci/run/ref/lanes/openbsd.yml
    lane_overrides:
      ref_os: openbsd
      artifact_family: openbsd
      baseline_root: make_openbsd
    os_version_key: openbsd_version
    default_architecture: x86-64

- family: opensuse
  generation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/opensuse.yml
    lane_overrides:
      ref_os: linux
  validation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/opensuse.yml

- family: redhat
  generation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/redhat.yml
    lane_overrides:
      ref_os: linux
      prepare_profile: redhat
  validation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/redhat.yml
    lane_overrides:
      prepare_profile: redhat

- family: fedora
  generation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/fedora.yml
    lane_overrides:
      ref_os: linux
  validation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/fedora.yml

- family: oraclelinux
  generation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/oraclelinux.yml
    lane_overrides:
      ref_os: linux
  validation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/oraclelinux.yml

- family: ubuntu
  generation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/ubuntu.yml
    lane_overrides:
      ref_os: linux
  validation:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/ubuntu.yml
