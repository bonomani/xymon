# Shared reference family catalog:
# - common defines per-family topology (runtime/lane_file/shared knobs)
# - generation/validation are purpose overlays (delta-only)
runtime_defaults_shared:
  linux_host:
    runs_on: ubuntu-22.04
  linux_container:
    runs_on: ubuntu-22.04
    prepare_profile: default
    checkout_mode: action
  bsd_vm:
    runs_on: ubuntu-22.04
    vm_memory: 1024M
    vm_cpu_count: 2
  macos_host:
    runs_on: macos-latest

runtime_defaults:
  generation:
    bsd_vm:
      architecture: x86-64

lane_defaults_shared:
  linux_container:
    _all:
      runs_on: ubuntu-22.04
      container_options: --platform linux/amd64
    arm64:
      runs_on: ubuntu-24.04-arm
      container_options: --platform linux/arm64/v8

families:
- family: linux
  common:
    runtime: linux_host
    lane_file: ci/run/ref/make-lanes/linux.yml
    runtime_preference:
      - linux_host
      - linux_container

- family: alpine
  common:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/alpine.yml
    container_arm64_overrides:
      checkout_mode: git

- family: archlinux
  common:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/archlinux.yml

- family: centos7
  common:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/centos7.yml
    lane_overrides:
      prepare_profile: centos7
      checkout_mode: git

- family: debian
  common:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/debian.yml

- family: freebsd
  common:
    runtime: bsd_vm
    lane_file: ci/run/ref/lanes/freebsd.yml
    os_version_key: freebsd_version
    default_architecture: x86-64

- family: macos
  common:
    runtime: macos_host
    lane_file: ci/run/ref/lanes/macos.yml
    os_version_key: macos_version
  validation:
    lane_overrides:
      # macOS compare currently uses FreeBSD legacy refs as the closest baseline.
      baseline_root: make_freebsd

- family: netbsd
  common:
    runtime: bsd_vm
    lane_file: ci/run/ref/lanes/netbsd.yml
    os_version_key: netbsd_version
    default_architecture: x86-64

- family: openbsd
  common:
    runtime: bsd_vm
    lane_file: ci/run/ref/lanes/openbsd.yml
    os_version_key: openbsd_version
    default_architecture: x86-64

- family: opensuse
  common:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/opensuse.yml

- family: redhat
  common:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/redhat.yml
    lane_overrides:
      prepare_profile: redhat

- family: fedora
  common:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/fedora.yml

- family: oraclelinux
  common:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/oraclelinux.yml

- family: ubuntu
  common:
    runtime: linux_container
    lane_file: ci/run/ref/lanes/ubuntu.yml
