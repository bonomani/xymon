containers:
  selection:
    tag_patterns:
      debian:
        - '^\d+$'
        - '^\d+(\.\d+)?-slim$'
      ubuntu:
        - '^\d+\.\d+$'
      amazonlinux:
        - '^2$'
        - '^2023$'
      rockylinux:
        - '^\d+$'
      oraclelinux:
        - '^\d+$'
        - '^\d+-slim$'
      almalinux:
        - '^\d+$'
      centos:
        - '^\d+$'
      fedora:
        - '^\d+$'
      opensuse_tumbleweed:
        - '^latest$'
      opensuse_leap:
        - '^\d+\.\d+$'
      alpine:
        - '^\d+\.\d+$'
        - '^edge$'
      archlinux:
        - '^latest$'
        - '^base$'
    rules:
      debian:
        keep_major_versions: ["11", "12", "13"]
      ubuntu:
        keep_versions: ["20.04", "22.04", "24.04"]
      amazonlinux:
        keep_versions: ["2", "2023"]
      rockylinux:
        keep_major_versions: ["8", "9"]
      oraclelinux:
        keep_major_versions: ["8", "9", "10"]
      almalinux:
        keep_major_versions: ["8", "9", "10"]
      centos:
        keep_major_versions: ["7"]
      fedora:
        keep_major_versions: ["40", "41", "42"]
      opensuse_tumbleweed:
        keep_versions: ["latest"]
        include_moving_targets: true
      opensuse_leap:
        keep_versions: ["15.5", "15.6", "16.0"]
      alpine:
        keep_latest_n_stable: 5
        include_moving_targets: true
      archlinux:
        keep_versions: ["base", "latest"]
        include_moving_targets: true
    exclude_platform_ids: []
  runtime_preference:
    default:
      - linux_container
    overrides:
      ubuntu:
        - linux_host
        - linux_container

vms:
  selection:
    rules:
      freebsd:
        keep_versions: ["13.5", "14.3", "15.0"]
      netbsd:
        keep_versions: ["9.2", "9.3", "9.4", "10.0", "10.1"]
      openbsd:
        keep_versions: ["7.6", "7.7", "7.8"]
    exclude_platform_ids: []

hosts:
  selection:
    rules:
      macos:
        keep_versions: ["14", "15", "26", "latest"]
        include_moving_targets: true
    exclude_platform_ids: []
