selection:
  runtime: docker
  platform_family: linux
  group_by: deps.os
  lanes_glob: ci/run/ref/lanes/*.yml
  prefer_image_tokens:
    - slim
    - latest

runtime_preference:
  default:
    - linux_container
  overrides:
    ubuntu:
      - linux_host
      - linux_container

validation:
  build_tools:
    - make
    - cmake
  variants:
    - client
    - server
  architectures:
    mode: all_lane_arches
