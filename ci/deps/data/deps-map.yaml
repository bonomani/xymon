# Generic dependency map for translating logical dependency IDs to package names.
package_templates:
  build_tools:
    apt: [build-essential, cmake, ninja-build, git, findutils]
    dnf: [gcc, gcc-c++, make, cmake, ninja-build, git, findutils, diffutils]
    yum: [gcc, gcc-c++, make, cmake, ninja-build, git, findutils, diffutils]
    zypper: [gcc, gcc-c++, make, cmake, ninja, git, findutils, diffutils]
    apk: [bash, build-base, cmake, ninja, git, findutils, diffutils]
    pacman: [base-devel, cmake, ninja, git, findutils, diffutils]
    brew: [cmake, ninja]
    pkg: [gmake, cmake, ninja]
    pkg_add: [gmake, cmake, ninja]

map:
  BUILD_TOOLS:
    defaults:
      template: build_tools
    overrides:
      by_os:
        centos_7:
          yum: [gcc, gcc-c++, make, cmake3, ninja-build, git, findutils, diffutils]
        netbsd:
          pkg_add: [gmake, cmake, ninja-build]

  PCRE:
    defaults:
      apt: [libpcre3-dev|libpcre2-dev]
      dnf: [pcre-devel|pcre2-devel]
      yum: [pcre-devel|pcre2-devel]
      zypper: [pcre-devel|pcre2-devel]
      apk: [pcre-dev|pcre2-dev]
      pacman: [pcre|pcre2]
      brew: [pcre|pcre2]
      pkg: [pcre|pcre2]
      pkg_add: [pcre|pcre2]

  RRD:
    defaults:
      apt: [librrd-dev]
      dnf: [rrdtool-devel]
      yum: [rrdtool-devel]
      zypper: [rrdtool-devel]
      apk: [rrdtool-dev]
      pacman: [rrdtool]
      brew: [rrdtool]
      pkg: [rrdtool]
      pkg_add: [rrdtool]

  OpenSSL:
    defaults:
      apt: [libssl-dev]
      dnf: [openssl-devel]
      yum: [openssl-devel]
      zypper: [libopenssl-devel]
      apk: [openssl-dev]
      pacman: [openssl]
      brew: [openssl@3]
      pkg: [openssl]
      pkg_add: [openssl]

  LDAP:
    defaults:
      apt: [libldap-dev]
      dnf: [openldap-devel]
      yum: [openldap-devel]
      zypper: [openldap2-devel]
      apk: [openldap-dev]
      pacman: [openldap]
      brew: [openldap]
      pkg: [openldap-client]
      pkg_add: [openldap-client]

  NETSNMP:
    defaults:
      apt: [libsnmp-dev]
      dnf: [net-snmp-devel]
      yum: [net-snmp-devel]
      zypper: [net-snmp-devel]
      apk: [net-snmp-dev]
      pacman: [net-snmp]
      brew: [net-snmp]
      pkg: [net-snmp]
      pkg_add: [net-snmp]

  CARES:
    defaults:
      apt: [libc-ares-dev]
      dnf: [c-ares-devel]
      yum: [c-ares-devel]
      zypper: [c-ares-devel]
      apk: [c-ares-dev]
      pacman: [c-ares]
      brew: [c-ares]
      pkg: [c-ares]
      pkg_add: [libcares]

  TIRPC:
    defaults:
      apt: [libtirpc-dev]
      dnf: [libtirpc-devel]
      yum: [libtirpc-devel]
      zypper: [libtirpc-devel]
      apk: [libtirpc-dev]
      pacman: [libtirpc]
      brew: [libtirpc]
      pkg: [libtirpc]
      pkg_add: [libtirpc]

  PYTHON:
    defaults:
      pkg: [python3]
      pkg_add: [python3]

aliases: {}
