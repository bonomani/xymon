packaging:
  deb:
    metadata:
      source: debian-package-search
      reference: https://packages.debian.org/search?keywords=xymon&searchon=names&suite=all&section=all
      binary_packages:
        - xymon
        - xymon-client
      downstream:
        bullseye:
          version: 4.3.30-1
          arches:
            - amd64
            - arm64
            - armhf
            - i386
        bookworm:
          version: 4.3.30-1+b2
          arches:
            - amd64
            - arm64
            - armel
            - armhf
            - i386
            - mips64el
            - mipsel
            - ppc64el
            - s390x
        trixie:
          version: 4.3.30-4
          arches:
            - amd64
            - arm64
            - armel
            - armhf
            - i386
            - ppc64el
            - riscv64
            - s390x
        forky:
          version: 4.3.30-5
          arches:
            - amd64
            - arm64
            - armhf
            - i386
            - ppc64el
            - riscv64
            - s390x
        sid:
          version: 4.3.30-5
          arches:
            - alpha
            - amd64
            - arm64
            - armhf
            - hppa
            - i386
            - loong64
            - m68k
            - ppc64
            - ppc64el
            - riscv64
            - s390x
            - sh4
            - sparc64
            - x32
    apt:
      - build-essential
      - cpio
      - debhelper
      - dpkg-dev
      - fakeroot
      - git
      - tar
      - libc-ares-dev
      - libldap2-dev
      - libpcre3-dev
      - librrd-dev
      - libssl-dev
  rpm:
    apt:
      - build-essential
      - cpio
      - git
      - tar
      - rpm
      - libc-ares-dev
      - libldap2-dev
      - libpcre3-dev
      - librrd-dev
      - libssl-dev
  freebsd_pkg:
    metadata:
      source: ports
      origin: net-mgmt/xymon-server
      package_name: xymon-server
      reference: https://www.freshports.org/net-mgmt/xymon-server/
    pkg:
      - gmake
      - rrdtool
      - fping
      - mtr-nox11
      - png
      - pcre
      - c-ares
