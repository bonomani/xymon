packaging:
  deb:
    workflow:
      build_script: ci/run/package/build-deb.sh
      artifact_name_prefix: deb
      artifact_paths:
        - debbuild/*.deb
        - debbuild/*.dsc
        - debbuild/*.changes
        - debbuild/*.buildinfo
        - debbuild/*.tar.*
      host_packages:
        - build-essential
        - cpio
        - debhelper
        - dpkg-dev
        - fakeroot
        - git
        - tar
        - libc-ares-dev
        - libldap2-dev
        - libpcre3-dev
        - librrd-dev
        - libssl-dev
  rpm:
    workflow:
      build_script: ci/run/package/build-rpm.sh
      artifact_name_prefix: rpm
      artifact_paths:
        - rpmbuild/RPMS/**/*.rpm
        - rpmbuild/SRPMS/*.rpm
      host_packages:
        - build-essential
        - cpio
        - git
        - tar
        - rpm
        - libc-ares-dev
        - libldap2-dev
        - libpcre3-dev
        - librrd-dev
        - libssl-dev
