topology: deps-topology.yaml
bindings_file: deps-variant-bindings.yaml
version_notes_file: deps-version-notes.yaml
profiles:
  linux_default:
    libs:
      mandatory:
      - BUILD_TOOLS
      - OpenSSL
      - PCRE
      - TIRPC
    tools:
      optional:
      - clang
  bsd_freebsd:
    libs:
      mandatory:
      - BUILD_TOOLS
      - PCRE
      base_system:
      - OpenSSL
      - TIRPC
      - PYTHON
    tools:
      optional:
      - clang
  bsd_net_open:
    libs:
      mandatory:
      - BUILD_TOOLS
      - PCRE
      base_system:
      - OpenSSL
      - TIRPC
    tools:
      optional:
      - clang
runtime:
  libs:
    optional:
  tools:
    mandatory:
    optional:
    - perl
    - python
