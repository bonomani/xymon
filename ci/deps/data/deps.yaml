# Dependency index
#
# This directory is split by variant:
# - deps-server.yaml: server dependency list (includes base)
# - deps-client.yaml: client dependency list (includes base)
# - deps-localclient.yaml: localclient dependency list (includes base)
# - deps-topology.yaml: shared family/os/pkgmgr topology used by all variants
# - deps-variant-bindings.yaml: shared family/os -> profile bindings used by all variants
# - deps-version-notes.yaml: shared version notes referenced by all variants

# Installer helpers default to VARIANT=server if not provided; valid variants are 'server', 'client', and 'localclient'.
#
# Families:
# - gh-debian: GitHub Actions Ubuntu runners (version: latest)
# - ubuntu: Ubuntu-specific installs (version: latest/local/20)
# - debian: local Debian/Ubuntu installs (version: local)
# - bsd: FreeBSD/NetBSD/OpenBSD (version: auto)
