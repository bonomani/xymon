#
# Xymon "solo" tasks.cfg - single-host local dashboard.
#
# Only the C state engine runs continuously; all web page generation
# is done on demand with the xymon-dash script. No web server, no
# history, no RRD, no alerting, no network tests.
#
# Replace @XYMONHOME@ with your server install directory, e.g.
#   sed 's|@XYMONHOME@|/opt/xymon/server|g' tasks.cfg > $XYMONHOME/etc/tasks.cfg
#

# The main Xymon daemon: the in-memory state engine.
# Loopback only - nothing listens on the network.
[xymond]
	ENVFILE @XYMONHOME@/etc/xymonserver.cfg
	CMD xymond --pidfile=$XYMONSERVERLOGS/xymond.pid \
		--listen=127.0.0.1 \
		--restart=$XYMONTMP/xymond.chk --checkpoint-file=$XYMONTMP/xymond.chk --checkpoint-interval=600 \
		--log=$XYMONSERVERLOGS/xymond.log \
		--admin-senders=127.0.0.1 \
		--store-clientlogs=!msgs

# The client back-end module: turns client data into cpu/disk/memory/... statuses.
[clientdata]
	ENVFILE @XYMONHOME@/etc/xymonserver.cfg
	NEEDS xymond
	CMD xymond_channel --channel=client --log=$XYMONSERVERLOGS/clientdata.log xymond_client

# The local client: collects the data every 5 minutes.
[xymonclient]
	ENVFILE @XYMONCLIENTHOME@/etc/xymonclient.cfg
	NEEDS xymond
	CMD @XYMONCLIENTHOME@/bin/xymonclient.sh
	LOGFILE $XYMONSERVERLOGS/xymonclient.log
	INTERVAL 5m
