# lighttpd config for Xymon solo mode - loopback only, drill-down enabled.
#
# Serves the static pages on /xymon and runs the CGIs on /xymon-cgi,
# the same URL layout as the shipped Apache config, so the default
# XYMONSERVERWWWURL/XYMONSERVERCGIURL settings work unchanged.
# The secured CGIs (/xymon-seccgi: enable/disable, user admin) are NOT
# exposed - solo mode has no authentication.
#
# Replace @XYMONHOME@ with your server install directory, then:
#   lighttpd -f $XYMONHOME/etc/lighttpd-solo.conf
# (xymon-dash does this automatically if the file is installed there.)

server.modules		= ( "mod_alias", "mod_cgi" )

server.bind		= "127.0.0.1"
server.port		= 8080
server.document-root	= "@XYMONHOME@/www"
server.pid-file		= "@XYMONHOME@/log/lighttpd-solo.pid"
server.errorlog		= "@XYMONHOME@/log/lighttpd-solo-error.log"

index-file.names	= ( "xymon.html", "index.html" )

# /xymon-cgi must come before /xymon (lighttpd matches aliases in order).
alias.url		= ( "/xymon-cgi/" => "@XYMONHOME@/cgi-bin/",
			    "/xymon/"     => "@XYMONHOME@/www/" )

$HTTP["url"] =~ "^/xymon-cgi/" {
	# Execute everything in cgi-bin (the installed wrapper scripts).
	cgi.assign = ( "" => "" )
}

mimetype.assign		= ( ".html" => "text/html",
			    ".css"  => "text/css",
			    ".js"   => "text/javascript",
			    ".gif"  => "image/gif",
			    ".png"  => "image/png",
			    ".jpg"  => "image/jpeg",
			    ".ico"  => "image/x-icon" )
