openapi: 3.1.0
info:
  title: Xymon REST API
  version: 0.1.0-draft
  description: >
    Minimal, read-only JSON view of Xymon status, over the xymond wire protocol
    (xymondboard / xymondlog / ping). Spec-first DRAFT; no implementation yet.
    Read-only on purpose for now -- status submission, disable/ack, and
    streaming are intentionally deferred. See docs/api/00-DESIGN.md.
  license:
    name: GPL-2.0-only

servers:
  - url: /xymon/api/v1

# Auth is handled by the front-end web server (reuse the existing Xymon web
# user db). Kept to a single scheme for now.
security:
  - basicAuth: []

paths:
  /ping:
    get:
      summary: Server liveness (maps to the xymond `ping` verb).
      operationId: ping
      responses:
        "200":
          description: xymond is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pong" }
        "502": { $ref: "#/components/responses/Error" }

  /board:
    get:
      summary: List status cells (maps to `xymondboard`).
      operationId: listBoard
      parameters:
        - { name: host,  in: query, schema: { type: string }, description: Filter by host name. }
        - { name: test,  in: query, schema: { type: string }, description: Filter by test name. }
        - { name: color, in: query, schema: { $ref: "#/components/schemas/Color" } }
      responses:
        "200":
          description: Matching status cells.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BoardEntry" }
        "401": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /hosts/{host}/tests/{test}:
    get:
      summary: Full status detail for one cell (maps to `xymondlog`).
      operationId: getStatus
      parameters:
        - { name: host, in: path, required: true, schema: { type: string } }
        - { name: test, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Status detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDetail" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Reuse the existing Xymon web user db (htpasswd).

  schemas:
    Color:
      type: string
      enum: [green, yellow, red, blue, clear, purple]

    Pong:
      type: object
      required: [alive]
      properties:
        alive: { type: boolean }

    BoardEntry:
      type: object
      description: One status cell, from xymondboard.
      required: [hostname, testname, color]
      properties:
        hostname:   { type: string }
        testname:   { type: string }
        color:      { $ref: "#/components/schemas/Color" }
        lastchange: { type: string, format: date-time, nullable: true }
        line1:      { type: string, description: First line of the status message. }

    StatusDetail:
      allOf:
        - $ref: "#/components/schemas/BoardEntry"
        - type: object
          properties:
            sender: { type: string }
            msg:    { type: string, description: Full status message text. }

    Error:
      type: object
      properties:
        error:  { type: string }
        detail: { type: string }

  responses:
    Error:
      description: Error (HTTP status carries the kind).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
