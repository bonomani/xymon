openapi: 3.0.3
info:
  title: Xymon REST API
  version: 0.1.0-draft
  description: >
    A REST/JSON interface over the Xymon (xymond) wire protocol. Spec-first
    DRAFT contract; no implementation yet. Covers the full common surface --
    reading status, submitting status, and host/test actions -- kept
    deliberately simple: one auth scheme, one JSON error shape, predictable
    paths. See docs/api/00-DESIGN.md.

    Note on OpenAPI version: 3.0.3 (not 3.1) is used on purpose for the widest
    tooling support; 3.0's `nullable: true` is therefore valid here.
  license:
    name: GPL-2.0-only

servers:
  - url: /xymon/api/v1

security:
  - basicAuth: []

tags:
  - { name: status, description: Read and submit host/test status. }
  - { name: hosts,  description: Host-level views and actions. }
  - { name: server, description: Server health and configuration. }

paths:
  /ping:
    get:
      tags: [server]
      summary: Server liveness (maps to `ping`).
      operationId: ping
      responses:
        "200":
          description: xymond is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pong" }
              example: { alive: true, server_version: "4.3.30" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }

  /board:
    get:
      tags: [status]
      summary: List status cells (maps to `xymondboard`).
      operationId: listBoard
      parameters:
        - { name: host,  in: query, schema: { type: string }, description: Filter by host name. }
        - { name: test,  in: query, schema: { type: string }, description: Filter by test name. }
        - { name: color, in: query, schema: { $ref: "#/components/schemas/Color" } }
        - { name: page,  in: query, schema: { type: string }, description: Filter by Xymon page/path. }
        - { name: tag,   in: query, schema: { type: string }, description: Filter by host tag. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 } }
      responses:
        "200":
          description: Matching status cells.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/BoardEntry" } }
              example:
                items:
                  - { hostname: web1, testname: http, color: green, lastchange: "2026-05-25T17:00:00Z", sender: "10.0.0.5", line1: "OK - 200 in 142ms" }
                  - { hostname: db1,  testname: disk, color: red,   lastchange: "2026-05-25T18:12:00Z", sender: "10.0.0.7", line1: "/var 96% full" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }

  /status:
    post:
      tags: [status]
      summary: Submit (upsert) a host/test status (maps to `status`).
      operationId: submitStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusSubmission" }
            example: { host: web1, test: http, color: green, message: "OK - 200 in 142ms", lifetime: "30m" }
      responses:
        "202": { description: Status accepted (xymond submission is fire-and-forget). }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }

  /hosts/{host}:
    parameters: [ { $ref: "#/components/parameters/Host" } ]
    get:
      tags: [hosts]
      summary: Host configuration/info (maps to `hostinfo`).
      operationId: getHost
      responses:
        "200":
          description: Host info.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }

  /hosts/{host}/tests/{test}:
    parameters:
      - { $ref: "#/components/parameters/Host" }
      - { $ref: "#/components/parameters/Test" }
    get:
      tags: [status]
      summary: Full status detail for one cell (maps to `xymondlog`).
      operationId: getStatus
      responses:
        "200":
          description: Status detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }

  /hosts/{host}/tests/{test}/disable:
    parameters:
      - { $ref: "#/components/parameters/Host" }
      - { $ref: "#/components/parameters/Test" }
    post:
      tags: [status]
      summary: Disable a test for a duration (maps to `disable`).
      operationId: disableTest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisableRequest" }
            example: { duration: "60m", reason: "planned maintenance" }
      responses:
        "202": { description: Disable accepted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }

  /hosts/{host}/tests/{test}/enable:
    parameters:
      - { $ref: "#/components/parameters/Host" }
      - { $ref: "#/components/parameters/Test" }
    post:
      tags: [status]
      summary: Re-enable a disabled test (maps to `enable`).
      operationId: enableTest
      responses:
        "202": { description: Enable accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }

  /hosts/{host}/tests/{test}/ack:
    parameters:
      - { $ref: "#/components/parameters/Host" }
      - { $ref: "#/components/parameters/Test" }
    post:
      tags: [status]
      summary: Acknowledge a non-green status (maps to `ack`).
      operationId: acknowledge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Acknowledgement" }
            example: { duration: "2h", message: "investigating, ticket OPS-1234" }
      responses:
        "201": { description: Acknowledgement recorded. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }

  /ghosts:
    get:
      tags: [server]
      summary: Hosts that reported but are not in hosts.cfg (maps to `ghostlist`).
      operationId: listGhosts
      responses:
        "200":
          description: Ghost reporters.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Ghost" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }

  /config/{file}:
    get:
      tags: [server]
      summary: Fetch a server config file (maps to `config`; allow-listed).
      operationId: getConfig
      parameters:
        - { name: file, in: path, required: true, schema: { type: string }, description: "Config file name (server-side allow-list)." }
      responses:
        "200":
          description: Raw config file contents.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Reuse the existing Xymon web user db (htpasswd).

  parameters:
    Host: { name: host, in: path, required: true, schema: { type: string }, description: Xymon host name. }
    Test: { name: test, in: path, required: true, schema: { type: string }, description: Test/column name. }

  schemas:
    Color:
      type: string
      enum: [green, yellow, red, blue, clear, purple]

    Duration:
      type: string
      description: "Xymon duration: a number with a unit suffix, or -1 for until-OK."
      pattern: '^(-1|[0-9]+[smhdw]?)$'
      example: "60m"

    Pong:
      type: object
      required: [alive]
      properties:
        alive: { type: boolean }
        server_version: { type: string }

    BoardEntry:
      type: object
      description: One status cell, mirroring xymondboard fields.
      required: [hostname, testname, color]
      properties:
        hostname:    { type: string }
        testname:    { type: string }
        color:       { $ref: "#/components/schemas/Color" }
        lastchange:  { type: string, format: date-time, nullable: true }
        logtime:     { type: string, format: date-time, nullable: true }
        validtime:   { type: string, format: date-time, nullable: true }
        acktime:     { type: string, format: date-time, nullable: true }
        disabletime: { type: string, format: date-time, nullable: true }
        sender:      { type: string }
        line1:       { type: string, description: First line of the status message. }

    StatusDetail:
      allOf:
        - $ref: "#/components/schemas/BoardEntry"
        - type: object
          properties:
            msg:    { type: string, description: Full status message text. }
            ackmsg: { type: string, nullable: true }
            dismsg: { type: string, nullable: true }
            client: { type: string, nullable: true }

    StatusSubmission:
      type: object
      required: [host, test, color]
      properties:
        host:     { type: string }
        test:     { type: string }
        color:    { $ref: "#/components/schemas/Color" }
        message:  { type: string, description: Status text body. }
        lifetime: { $ref: "#/components/schemas/Duration" }

    DisableRequest:
      type: object
      required: [duration]
      properties:
        duration: { $ref: "#/components/schemas/Duration" }
        reason:   { type: string }

    Acknowledgement:
      type: object
      required: [duration, message]
      properties:
        duration: { $ref: "#/components/schemas/Duration" }
        message:  { type: string }

    Host:
      type: object
      required: [hostname]
      properties:
        hostname: { type: string }
        ip:       { type: string, nullable: true }
        tags:     { type: array, items: { type: string } }
        pages:    { type: array, items: { type: string } }

    Ghost:
      type: object
      properties:
        hostname: { type: string }
        sender:   { type: string }
        lastseen: { type: string, format: date-time, nullable: true }

    Error:
      type: object
      required: [error]
      properties:
        error:  { type: string, description: Short machine-readable code. }
        detail: { type: string, description: Human-readable explanation. }
      example: { error: not_found, detail: "no such host/test" }

  responses:
    BadRequest:
      description: Invalid request parameters or body.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Authentication required or failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Authenticated but not permitted.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Unknown host or test.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Conflicting state (e.g. acking a green status).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    UpstreamUnavailable:
      description: xymond is unreachable.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    UpstreamTimeout:
      description: Timed out talking to xymond.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
