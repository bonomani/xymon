openapi: 3.0.3
info:
  title: Xymon REST API
  version: 0.2.0-draft
  description: >
    A REST/JSON interface over the Xymon model (see docs/api/01-MODEL.md):
    a pipeline Host → Test → State → Alarm → Action, governed by the law
    "advance if a Rule matches, unless a Suppression holds". Two planes:
    Defined resources (hosts, tests, rules, suppressions) are read/write;
    Observed resources (states, alarms, actions) are read-only plus the real
    commands (action create, state ingest). A State is a label-set whose
    dimensions each answer one question (where/what/how/when); the value+verdict
    is the answer. Hierarchies and the classic "column color" are group-by
    rollups, not stored.

    Spec-first DRAFT; no implementation yet. OpenAPI 3.0.3 for broad tooling
    (nullable valid). Validated with openapi-spec-validator.
  license:
    name: GPL-2.0-only

servers:
  - url: /xymon/api/v1

security:
  - basicAuth: []

tags:
  - { name: observed, description: "Read-only runtime: states, alarms, actions (+ the real writes)." }
  - { name: defined,  description: "Config you write: hosts, tests, rules, suppressions." }
  - { name: server,   description: "Server health." }

paths:
  /health:
    get:
      tags: [server]
      summary: Liveness.
      operationId: health
      responses:
        "200":
          description: alive
          content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } }
        "502": { $ref: "#/components/responses/Upstream" }

  # ---- Observed plane -----------------------------------------------------
  /states:
    get:
      tags: [observed]
      summary: Query states. Every dimension is a filter; group with `rollup`.
      operationId: listStates
      parameters:
        - { name: entity,  in: query, schema: { type: string }, description: "WHERE anchor — the monitored subject." }
        - { name: test,    in: query, schema: { type: string }, description: "HOW anchor (probe)." }
        - { name: item,    in: query, schema: { type: string }, description: "WHERE — the judged item (filesystem/url/core)." }
        - { name: verdict, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: selector, in: query, schema: { type: string }, description: "Match free dimensions, e.g. `mount=/var,core=3`." }
        - { name: rollup,  in: query, schema: { type: string }, description: "Group-by dimensions (worst severity), e.g. `entity,test` for the classic column color." }
        - { name: fields,  in: query, schema: { type: string }, description: "Comma-separated projection." }
        - { name: limit,   in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 } }
      responses:
        "200":
          description: Matching states (or rollup buckets).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/State" } }
              example:
                items:
                  - { id: "web1:disk:/var", entity: web1, test: disk, item: /var, labels: { mount: /var }, metrics: { pct_used: { value: 96, verdict: critical }, inodes: { value: 41, verdict: ok } }, verdict: critical, time: "2026-05-26T00:00:00Z" }
                  - { id: "web1:disk:/",    entity: web1, test: disk, item: "/",  labels: { mount: "/" },  metrics: { pct_used: { value: 38, verdict: ok } }, verdict: ok, time: "2026-05-26T00:00:00Z" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/Upstream" }
    post:
      tags: [observed]
      summary: Ingest a batch of readings (the `combo`/`status` path).
      operationId: ingestStates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [readings]
              properties:
                readings: { type: array, items: { $ref: "#/components/schemas/Reading" } }
            example:
              readings:
                - { entity: web1, test: disk, item: /var, labels: { mount: /var }, metrics: { pct_used: { value: 96, verdict: critical }, inodes: { value: 41, verdict: ok } } }
      responses:
        "202": { description: Readings accepted; decomposed into states. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/Upstream" }

  /states/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [observed]
      summary: One state (id = flattened label-set).
      operationId: getState
      responses:
        "200":
          description: The state.
          content: { application/json: { schema: { $ref: "#/components/schemas/State" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /alarms:
    get:
      tags: [observed]
      summary: Query alarms (conditions raised from state by Rules).
      operationId: listAlarms
      parameters:
        - { name: entity,   in: query, schema: { type: string } }
        - { name: test,     in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
        - { name: status,   in: query, schema: { $ref: "#/components/schemas/AlarmStatus" } }
        - { name: selector, in: query, schema: { type: string } }
        - { name: limit,    in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 } }
      responses:
        "200":
          description: Matching alarms.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Alarm" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/Upstream" }

  /alarms/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [observed]
      summary: One alarm.
      operationId: getAlarm
      responses:
        "200":
          description: The alarm.
          content: { application/json: { schema: { $ref: "#/components/schemas/Alarm" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /actions:
    get:
      tags: [observed]
      summary: The action log (auto + operator actions).
      operationId: listActions
      parameters:
        - { name: type,  in: query, schema: { $ref: "#/components/schemas/ActionType" } }
        - { name: actor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 } }
      responses:
        "200":
          description: Matching actions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Action" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [observed]
      summary: Issue an operator command (ack/disable/enable). May create a Suppression.
      operationId: createAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionCommand" }
            examples:
              acknowledge:
                value: { type: ack, target: { alarm: "web1:disk:/var" }, duration: "2h", message: "ticket OPS-1234" }
              disable:
                value: { type: disable, target: { selector: "entity=web1,test=disk" }, duration: "60m", message: "maintenance" }
      responses:
        "201":
          description: Action recorded (and any resulting Suppression created).
          content: { application/json: { schema: { $ref: "#/components/schemas/Action" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }

  /actions/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [observed]
      summary: One action.
      operationId: getAction
      responses:
        "200":
          description: The action.
          content: { application/json: { schema: { $ref: "#/components/schemas/Action" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /series:
    get:
      tags: [observed]
      summary: Time-series history of state values (the data behind graphs).
      operationId: listSeries
      parameters:
        - { name: entity,   in: query, schema: { type: string } }
        - { name: test,     in: query, schema: { type: string } }
        - { name: item,     in: query, schema: { type: string }, description: "The judged item (filesystem/url/...)." }
        - { name: metric,   in: query, schema: { type: string }, description: "Which metric field of the item to graph." }
        - { name: selector, in: query, schema: { type: string }, description: "Free-dimension matchers, e.g. `mount=/var`." }
        - { name: from,     in: query, schema: { type: string }, description: "Range start: RFC3339 or relative like `-24h`." }
        - { name: to,       in: query, schema: { type: string, default: "now" } }
        - { name: step,     in: query, schema: { type: string }, description: "Resolution, e.g. `5m` (maps to RRD consolidation)." }
        - { name: limit,    in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: One numeric time-series per matching label-set.
          content:
            application/json:
              schema:
                type: object
                required: [series]
                properties:
                  series: { type: array, items: { $ref: "#/components/schemas/Series" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/Upstream" }

  /graphs:
    get:
      tags: [observed]
      summary: Render a graph image of matching series over a time range (RRD-backed).
      operationId: renderGraph
      parameters:
        - { name: graph,    in: query, schema: { type: string }, description: "A named graph definition id (else render ad-hoc by selector)." }
        - { name: entity,   in: query, schema: { type: string } }
        - { name: test,     in: query, schema: { type: string } }
        - { name: selector, in: query, schema: { type: string } }
        - { name: from,     in: query, schema: { type: string, default: "-24h" } }
        - { name: to,       in: query, schema: { type: string, default: "now" } }
        - { name: format,   in: query, schema: { type: string, enum: [png, svg], default: png } }
      responses:
        "200":
          description: The rendered graph.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }

  # ---- Defined plane (config; uniform CRUD) -------------------------------
  # Every config resource has the identical shape: GET/POST on the collection,
  # GET/PUT/DELETE on the item. Only the record schema differs.
  /entities:
    get:
      tags: [defined]
      summary: List entities (host / net / service / …).
      operationId: listEntities
      responses:
        "200": { description: Hosts., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Entity" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [defined]
      summary: Create an entity.
      operationId: createEntity
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Entity" } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Entity" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /entities/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [defined]
      summary: Get an entity.
      operationId: getEntity
      responses:
        "200": { description: Host., content: { application/json: { schema: { $ref: "#/components/schemas/Entity" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [defined]
      summary: Create or replace an entity.
      operationId: putEntity
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Entity" } } } }
      responses:
        "200": { description: Replaced., content: { application/json: { schema: { $ref: "#/components/schemas/Entity" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [defined]
      summary: Delete an entity.
      operationId: deleteEntity
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tests:
    get:
      tags: [defined]
      summary: List tests (check definitions).
      operationId: listTests
      responses:
        "200": { description: Tests., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Test" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [defined]
      summary: Create a test.
      operationId: createTest
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Test" } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Test" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tests/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [defined]
      summary: Get a test.
      operationId: getTest
      responses:
        "200": { description: Test., content: { application/json: { schema: { $ref: "#/components/schemas/Test" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [defined]
      summary: Create or replace a test.
      operationId: putTest
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Test" } } } }
      responses:
        "200": { description: Replaced., content: { application/json: { schema: { $ref: "#/components/schemas/Test" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [defined]
      summary: Delete a test.
      operationId: deleteTest
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /rules:
    get:
      tags: [defined]
      summary: List rules.
      operationId: listRules
      responses:
        "200": { description: Rules., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Rule" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [defined]
      summary: Create a rule.
      operationId: createRule
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Rule" } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Rule" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /rules/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [defined]
      summary: Get a rule.
      operationId: getRule
      responses:
        "200": { description: Rule., content: { application/json: { schema: { $ref: "#/components/schemas/Rule" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [defined]
      summary: Create or replace a rule.
      operationId: putRule
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Rule" } } } }
      responses:
        "200": { description: Replaced., content: { application/json: { schema: { $ref: "#/components/schemas/Rule" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [defined]
      summary: Delete a rule.
      operationId: deleteRule
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /suppressions:
    get:
      tags: [defined]
      summary: List suppressions (disable / maintenance / dependency / ack-silences).
      operationId: listSuppressions
      responses:
        "200": { description: Suppressions., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Suppression" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [defined]
      summary: Create a suppression (e.g. a maintenance window).
      operationId: createSuppression
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Suppression" } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Suppression" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /suppressions/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [defined]
      summary: Get a suppression.
      operationId: getSuppression
      responses:
        "200": { description: Suppression., content: { application/json: { schema: { $ref: "#/components/schemas/Suppression" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [defined]
      summary: Create or replace a suppression.
      operationId: putSuppression
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Suppression" } } } }
      responses:
        "200": { description: Replaced., content: { application/json: { schema: { $ref: "#/components/schemas/Suppression" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [defined]
      summary: Delete a suppression (e.g. enable = drop the disable).
      operationId: deleteSuppression
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /graph-defs:
    get:
      tags: [defined]
      summary: List named graph definitions (the graphs.cfg analogue).
      operationId: listGraphDefs
      responses:
        "200": { description: Graph definitions., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/GraphDef" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [defined]
      summary: Create a graph definition.
      operationId: createGraphDef
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GraphDef" } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/GraphDef" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /graph-defs/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [defined]
      summary: Get a graph definition.
      operationId: getGraphDef
      responses:
        "200": { description: Graph definition., content: { application/json: { schema: { $ref: "#/components/schemas/GraphDef" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [defined]
      summary: Create or replace a graph definition.
      operationId: putGraphDef
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GraphDef" } } } }
      responses:
        "200": { description: Replaced., content: { application/json: { schema: { $ref: "#/components/schemas/GraphDef" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [defined]
      summary: Delete a graph definition.
      operationId: deleteGraphDef
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /views:
    get:
      tags: [defined]
      summary: List views (the curated page tree; the hosts.cfg pages analogue).
      operationId: listViews
      responses:
        "200": { description: Views., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/View" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [defined]
      summary: Create a view (a presentation node).
      operationId: createView
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/View" } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/View" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /views/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [defined]
      summary: Get a view.
      operationId: getView
      responses:
        "200": { description: View., content: { application/json: { schema: { $ref: "#/components/schemas/View" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [defined]
      summary: Create or replace a view.
      operationId: putView
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/View" } } } }
      responses:
        "200": { description: Replaced., content: { application/json: { schema: { $ref: "#/components/schemas/View" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [defined]
      summary: Delete a view.
      operationId: deleteView
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Reuse the existing Xymon web user db (htpasswd).

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string }, description: "Resource id (states/alarms: a flattened label-set)." }

  schemas:
    Status:
      type: string
      description: >
        Semantic verdict — never a colour. Rendering maps it to the familiar
        Xymon colours: ok→green, warning→yellow, critical→red, disabled→blue,
        nodata→clear, unknown→purple. Storing meaning (not presentation) keeps
        themes/colour-blindness/relabelling a pure render concern.
      enum: [ok, warning, critical, disabled, nodata, unknown]
    Severity:
      type: string
      enum: [info, minor, major, critical]
    AlarmStatus:
      type: string
      enum: [firing, acknowledged, resolved]
    ActionType:
      type: string
      enum: [notify, ack, disable, enable]

    Labels:
      type: object
      additionalProperties: { type: string }
      description: Free dimensions (mount, url, core, ...). Anchors host/test are surfaced separately.

    Selector:
      type: object
      additionalProperties: { type: string }
      description: "Label matchers scoping a rule/suppression/command, e.g. {entity: web1, test: disk}."

    Window:
      type: object
      properties:
        start: { type: string, format: date-time }
        end:   { type: string, format: date-time }

    Health:
      type: object
      required: [alive]
      properties:
        alive: { type: boolean }
        server_version: { type: string }

    Metric:
      type: object
      description: One measurement of an item; `verdict` present only if a Rule judges it (else it's data).
      required: [value]
      properties:
        value:   { type: number }
        verdict: { $ref: "#/components/schemas/Status" }

    State:
      type: object
      description: >
        One judged item (host+test+item) — Xymon's one line. `metrics` are the
        item's correlated measurements; each may carry its own `verdict`
        (status); metrics without one are data (graph via /series). The State
        `verdict` is the WORST of its metrics. WHERE=host+item+labels, HOW=test.
        verdict is a semantic status — colour is a render mapping. A State is observed (from a probe) or derived (from a combo test).
      required: [id, entity, test, verdict]
      properties:
        id:      { type: string, description: "Flattened (host,test,item) key." }
        entity:  { type: string, description: "WHERE anchor — the monitored subject (any kind)." }
        test:    { type: string, description: "HOW anchor (probe)." }
        item:    { type: string, description: "WHERE — the judged thing (filesystem/url/core); empty for single-item tests." }
        labels:  { $ref: "#/components/schemas/Labels" }
        metrics: { type: object, additionalProperties: { $ref: "#/components/schemas/Metric" }, description: "e.g. {cap:{value:17,verdict:ok}, total_gb:{value:951.65}}." }
        verdict: { $ref: "#/components/schemas/Status" }
        time:    { type: string, format: date-time }

    Reading:
      type: object
      description: An ingested item reading (one line) — becomes/updates one State.
      required: [entity, test]
      properties:
        entity:  { type: string }
        test:    { type: string }
        item:    { type: string, nullable: true }
        labels:  { $ref: "#/components/schemas/Labels" }
        metrics: { type: object, additionalProperties: { $ref: "#/components/schemas/Metric" } }
        time:    { type: string, format: date-time, nullable: true }

    Alarm:
      type: object
      description: A condition raised from State by a Rule; has a lifecycle.
      required: [id, severity, status]
      properties:
        id:       { type: string }
        entity:   { type: string }
        test:     { type: string }
        metric:   { type: string, nullable: true }
        labels:   { $ref: "#/components/schemas/Labels" }
        severity: { $ref: "#/components/schemas/Severity" }
        status:   { $ref: "#/components/schemas/AlarmStatus" }
        since:    { type: string, format: date-time }
        rule:     { type: string, description: "Id of the Rule that raised it.", nullable: true }

    Action:
      type: object
      description: Something done (auto notify, or operator ack/disable). Operator actions may create a Suppression.
      required: [id, type]
      properties:
        id:      { type: string }
        type:    { $ref: "#/components/schemas/ActionType" }
        target:  { $ref: "#/components/schemas/Selector" }
        actor:   { type: string, description: "WHO performed it (null for automatic).", nullable: true }
        time:    { type: string, format: date-time }
        params:  { type: object, additionalProperties: true }
        suppression: { type: string, description: "Id of any Suppression this action created.", nullable: true }

    ActionCommand:
      type: object
      description: Request to perform an operator action.
      required: [type, target]
      properties:
        type:     { $ref: "#/components/schemas/ActionType" }
        target:   { $ref: "#/components/schemas/Selector" }
        duration: { type: string, description: "For ack/disable, e.g. '2h' or '-1'." }
        message:  { type: string }

    Entity:
      type: object
      description: A monitored subject; `kind` distinguishes host / net / service / link / app. Tests, states, alarms attach to it regardless of kind.
      required: [id, kind]
      properties:
        id:     { type: string }
        kind:   { type: string, enum: [host, net, service, link, app], default: host }
        ip:     { type: string, nullable: true }
        owner:  { type: string, description: "WHO is responsible (routes actions).", nullable: true }
        labels: { $ref: "#/components/schemas/Labels" }

    Test:
      type: object
      description: A check applied to entities via a selector. kind is the probe (disk, http, …) or `combo` (a derived test computed from other states).
      required: [id, kind]
      properties:
        id:       { type: string }
        kind:     { type: string, description: "Probe type (disk, http, ...)." }
        selector: { $ref: "#/components/schemas/Selector" }
        owner:    { type: string, nullable: true }
        enabled:  { type: boolean, default: true }
        params:   { type: object, additionalProperties: true }
        expr:     { type: string, nullable: true, description: "For kind=combo: expression over other states, e.g. 'worst' or 'web1.http && db1.conn'." }

    Rule:
      type: object
      description: Governs a pipeline transition — "when match, advance".
      required: [id, transition]
      properties:
        id:         { type: string }
        transition: { type: string, enum: [stateToAlarm, alarmToAction] }
        selector:   { $ref: "#/components/schemas/Selector" }
        condition:  { type: string, description: "e.g. 'value >= 90' or 'verdict = critical'." }
        severity:   { $ref: "#/components/schemas/Severity" }
        route:      { type: string, description: "For alarmToAction: channel/recipient.", nullable: true }

    Suppression:
      type: object
      description: Gates a transition for a scope+window (disable / maintenance / dependency / ack).
      required: [id, gates, selector]
      properties:
        id:       { type: string }
        gates:    { type: string, enum: [testToState, stateToAlarm, alarmToAction] }
        selector: { $ref: "#/components/schemas/Selector" }
        window:   { $ref: "#/components/schemas/Window" }
        reason:   { type: string, nullable: true }
        source:   { type: string, description: "Id of the Action that created it, if any.", nullable: true }

    Series:
      type: object
      description: A numeric time-series — the history of one State's value (one label-set).
      required: [labels, points]
      properties:
        labels: { $ref: "#/components/schemas/Labels" }
        metric: { type: string }
        points:
          type: array
          items:
            type: object
            required: [t, v]
            properties:
              t: { type: string, format: date-time }
              v: { type: number, nullable: true }

    GraphDef:
      type: object
      description: A named graph (the graphs.cfg analogue) — a selector + render hints.
      required: [id, selector]
      properties:
        id:       { type: string }
        title:    { type: string }
        selector: { $ref: "#/components/schemas/Selector" }
        unit:     { type: string, description: "Y-axis unit label, e.g. '%' or 'ms'." }
        stacked:  { type: boolean, default: false }

    View:
      type: object
      description: >
        A curated presentation node (the Xymon "page" analogue): a title, optional
        nesting, and a membership Selector. Presentation/navigation only — a View
        gates nothing in the pipeline. Membership is derived from the selector;
        nesting/order is editorial.
      required: [id, title]
      properties:
        id:       { type: string }
        title:    { type: string }
        parent:   { type: string, nullable: true, description: "Parent view id (null = top level)." }
        selector: { $ref: "#/components/schemas/Selector" }
        order:    { type: integer, nullable: true }

    Error:
      type: object
      required: [error]
      properties:
        error:  { type: string }
        detail: { type: string }

  responses:
    BadRequest:   { description: Invalid request.,            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Authentication required/failed., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden:    { description: Not permitted.,               content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound:     { description: Unknown resource.,            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Conflict:     { description: Conflicting state.,           content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Upstream:     { description: xymond unreachable / timed out., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
