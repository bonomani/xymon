<!DOCTYPE html>
<!--
  Xymon REST API — board mockup (static, self-contained).

  Renders the classic Xymon board ENTIRELY from data shaped like the REST API
  (see ../openapi.yaml, ../01-MODEL.md). Demonstrates:
   - verdict is a SEMANTIC severity (ok/warning/critical/…); colour is a
     rendering choice mapped here (so meaning ≠ presentation).
   - grouping by ANY label — the dropdown switches os (discovered) / site
     (assigned); a "View" is just a curated arrangement of these.
   - one State per item; each ruled metric carries its own severity; the item
     and column verdicts are the WORST consolidation.
  Fixtures mirror: GET /states?<group>=…&rollup=host,test (cells),
  GET /states?host&test (drill-down), GET /series + /graphs (sparkline).
  No backend, no build: open in a browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Xymon — status board (API mock)</title>
<style>
  body { font-family: Verdana, Geneva, sans-serif; font-size: 12px; background:#fff; color:#000; margin:0; }
  .topbar { background:#304860; color:#fff; padding:10px 16px; font-weight:bold; font-size:15px;
            display:flex; justify-content:space-between; }
  .topbar small { font-weight:normal; opacity:.8; }
  .wrap { padding:14px 16px; }
  .api  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size:11px; color:#456;
          background:#eef2f6; border:1px solid #d4dde6; border-radius:4px; padding:4px 8px;
          display:inline-block; margin-bottom:10px; }
  .controls { display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  label.flt { font-size:11px; color:#456; }
  .legend { font-size:11px; color:#456; display:flex; gap:12px; align-items:center; }
  h2.page { font-size:13px; color:#304860; margin:16px 0 6px; border-bottom:2px solid #304860;
            padding-bottom:3px; display:flex; align-items:center; gap:10px; }
  h2.page .api { margin-bottom:0; }
  table.board { border-collapse:collapse; }
  table.board th, table.board td { border:1px solid #c7c7c7; padding:5px 9px; text-align:center; }
  table.board th { background:#f0f0f0; } table.board th.host { text-align:left; min-width:120px; }
  td.host { text-align:left; font-weight:bold; background:#fafafa; }
  .ball { display:inline-block; width:14px; height:14px; border-radius:50%;
          box-shadow: inset -2px -2px 3px rgba(0,0,0,.35); cursor:pointer; vertical-align:middle; }
  .green{background:#1aab1a}.yellow{background:#f5d800}.red{background:#e80000}
  .blue{background:#2b7be0}.clear{background:#c4c4c4}.purple{background:#9b1bb0}
  .none { color:#bbb; }
  #detail { margin-top:18px; border:1px solid #c7c7c7; border-radius:4px; max-width:720px; display:none; }
  #detail h3 { margin:0; padding:8px 12px; background:#304860; color:#fff; font-size:13px; border-radius:4px 4px 0 0; }
  #detail .body { padding:10px 12px; }
  table.items { border-collapse:collapse; width:100%; font-size:11px; }
  table.items th, table.items td { border-bottom:1px solid #e3e3e3; padding:4px 8px; text-align:left; }
  table.items th { color:#678; }
  .spark { margin-top:8px; }
  .muted { color:#789; font-size:11px; }
</style>
</head>
<body>
<div class="topbar"><span>Xymon &nbsp;·&nbsp; status board</span>
  <small>rendered from the REST API model — <span id="ts"></span></small></div>

<div class="wrap">
  <div class="controls">
    <span class="api">per page: GET /states?&lt;group&gt;=…&amp;rollup=host,test</span>
    <label class="flt">group by
      <select id="groupby">
        <option value="os">os (discovered)</option>
        <option value="site">site (assigned)</option>
      </select></label>
    <label class="flt"><input type="checkbox" id="onlyprob"> show only problems</label>
    <span class="legend" id="legend"></span>
  </div>
  <div id="grid"></div>
  <div id="detail">
    <h3 id="dtitle"></h3>
    <div class="body">
      <div class="api" id="dapi"></div>
      <div id="ditable"></div>
      <div class="spark" id="dspark"></div>
    </div>
  </div>
</div>

<script>
// ---- fixtures (API response shapes) -------------------------------------
// verdict is a SEMANTIC severity, never a colour.
const BOARD = { items: [   // GET /states?<group>=..&rollup=host,test
  {host:"web1",    test:"conn", verdict:"ok"},
  {host:"web1",    test:"cpu",  verdict:"ok"},
  {host:"web1",    test:"disk", verdict:"critical"},
  {host:"web1",    test:"http", verdict:"ok"},
  {host:"db1",     test:"conn", verdict:"ok"},
  {host:"db1",     test:"cpu",  verdict:"warning"},
  {host:"db1",     test:"disk", verdict:"ok"},
  {host:"router1", test:"conn", verdict:"ok"},
  {host:"router1", test:"cpu",  verdict:"ok"},
  {host:"router1", test:"http", verdict:"nodata"},
  {host:"ifmspc-usr2.ad1.i01.gtbcr.org", test:"conn", verdict:"ok"},
  {host:"ifmspc-usr2.ad1.i01.gtbcr.org", test:"cpu",  verdict:"ok"},
  {host:"ifmspc-usr2.ad1.i01.gtbcr.org", test:"disk", verdict:"ok"},
]};

const HOSTS = {   // GET /hosts — labels; some discovered, some assigned
  "web1":    {os:"linux",   site:"paris"},     // os = discovered (agent reports it)
  "db1":     {os:"linux",   site:"paris"},     // site = assigned (admin sets it)
  "router1": {os:"network", site:"london"},
  "ifmspc-usr2.ad1.i01.gtbcr.org": {os:"windows", site:"london"},
};

// GET /states?host=..&test=..  → one State per item; each metric may carry its
// OWN severity (where a Rule applies); the rest are data.
const DETAIL = {
  "web1|disk": [
    {item:"/var",  metrics:[{m:"pct_used",v:"96%",verdict:"critical"}, {m:"inodes",v:"41%",verdict:"ok"}]},
    {item:"/",     metrics:[{m:"pct_used",v:"38%",verdict:"ok"}]},
    {item:"/home", metrics:[{m:"pct_used",v:"72%",verdict:"warning"}]},
  ],
  "db1|cpu": [   // two independently-ruled metrics of one item; worst wins
    {item:"cpu",   metrics:[{m:"util_pct",v:"88%",verdict:"warning"}, {m:"load_5m",v:"3.2",verdict:"ok"}]},
  ],
  "ifmspc-usr2.ad1.i01.gtbcr.org|disk": [   // only capacity is ruled; rest = data
    {item:"C: (/FIXED/C:\\, Windows)", metrics:[
      {m:"cap",  v:"17%",       verdict:"ok"},
      {m:"total",v:"951.65 GB"},
      {m:"used", v:"163.26 GB"},
      {m:"avail",v:"788.39 GB"},
    ]},
  ],
};

const SERIES = {   // GET /series?…&metric=..  (→ /graphs)
  "web1|disk": [88,90,91,92,93,94,95,96,96,95,96,97,96],
  "ifmspc-usr2.ad1.i01.gtbcr.org|disk": [15,16,16,17,17,17,18,17,17,16,17,17,17],
};

// ---- severity → colour (presentation), and consolidation ----------------
const COLOR = { ok:"green", warning:"yellow", critical:"red", disabled:"blue", nodata:"clear", unknown:"purple" };
const RANK  = { ok:0, disabled:1, nodata:1, warning:2, unknown:3, critical:4 };
function worst(vs){ let w="ok"; vs.forEach(v => { if (v && (RANK[v]||0) > (RANK[w]||0)) w = v; }); return w; }
function ball(sev, sz){ const c = COLOR[sev]; return c ? `<span class="ball ${c}" title="${sev}" style="width:${sz||10}px;height:${sz||10}px"></span>` : ''; }
// the ball IS the verdict; spell the word only when it's a problem (ok needs none)
function label(sev){ return sev ? `${ball(sev,10)}${sev==="ok"?"":" "+sev}` : ''; }

// ---- render the page tree (group by any label) --------------------------
function render() {
  const onlyProb = document.getElementById("onlyprob").checked;
  const dim   = document.getElementById("groupby").value;        // group by any label
  const tests = [...new Set(BOARD.items.map(i=>i.test))].sort();  // global cols → pages align
  const cell  = {}; BOARD.items.forEach(i => cell[i.host+"|"+i.test] = i.verdict);

  const values = [...new Set(Object.keys(HOSTS).map(h => HOSTS[h][dim]))].sort();
  let html = '';
  values.forEach(val => {
    const hosts = Object.keys(HOSTS).filter(h => HOSTS[h][dim] === val);
    html += `<h2 class="page">${dim}: ${val}`+
            `<span class="api">GET /states?${dim}=${val}&amp;rollup=host,test</span></h2>`+
            gridFor(hosts, tests, cell, onlyProb);
  });
  document.getElementById("grid").innerHTML = html;
}

function gridFor(hosts, tests, cell, onlyProb) {
  let h = '<table class="board"><thead><tr><th class="host">host</th>';
  tests.forEach(t => h += `<th>${t}</th>`);
  h += '</tr></thead><tbody>';
  let shown = 0;
  hosts.forEach(host => {
    const row = tests.map(t => cell[host+"|"+t]);
    if (onlyProb && row.every(v => !v || v==="ok")) return;
    shown++;
    h += `<tr><td class="host">${host}</td>`;
    tests.forEach(t => {
      const v = cell[host+"|"+t];
      if (!v) { h += '<td><span class="none">–</span></td>'; return; }
      const c = COLOR[v];
      const click = DETAIL[host+"|"+t] ? `onclick="drill('${host}','${t}')"` : '';
      h += `<td><span class="ball ${c}" title="${host}.${t} = ${v}" ${click}></span></td>`;
    });
    h += '</tr>';
  });
  h += '</tbody></table>';
  return shown ? h : '<div class="muted" style="margin:2px 0 10px">(all ok — hidden)</div>';
}

// ---- drill-down: per-metric severity + WORST consolidation --------------
function drill(host, test) {
  const items = DETAIL[host+"|"+test] || [];
  const itemVerdict = it => worst(it.metrics.map(m => m.verdict));
  const testVerdict = worst(items.map(itemVerdict));     // column = worst over items

  document.getElementById("dtitle").innerHTML =
    `${host}.${test} &nbsp; ${label(testVerdict)} &nbsp;<small style="opacity:.7">(column = worst over items)</small>`;
  document.getElementById("dapi").textContent = `GET /states?host=${host}&test=${test}`;

  const keys = [];
  items.forEach(it => it.metrics.forEach(m => { if (!keys.includes(m.m)) keys.push(m.m); }));
  let t = '<table class="items"><thead><tr><th>item</th>';
  keys.forEach(k => t += `<th>${k}</th>`);
  t += '<th>verdict</th></tr></thead><tbody>';
  items.forEach(it => {
    t += `<tr><td>${it.item}</td>`;
    keys.forEach(k => {
      const m = it.metrics.find(x => x.m === k);
      t += m ? `<td>${m.v} ${ball(m.verdict,9)}</td>` : '<td></td>';  // ruled metric → its own ball
    });
    t += `<td>${label(itemVerdict(it))}</td></tr>`;                   // item = worst of its metrics
  });
  t += '</tbody></table><div class="muted">each ruled metric carries its own colour; '+
       'the <b>verdict</b> column = worst of that row\'s metrics; the title = worst over items.</div>';
  document.getElementById("ditable").innerHTML = t;
  document.getElementById("dspark").innerHTML = sparkline(host, test);
  document.getElementById("detail").style.display = "block";
}

function sparkline(host, test) {
  const pts = SERIES[host+"|"+test];
  if (!pts) return '';
  const w=320,h=44,max=Math.max(...pts),min=Math.min(...pts),span=(max-min)||1;
  const path = pts.map((v,i)=>`${(i/(pts.length-1))*w},${h-((v-min)/span)*(h-6)-3}`).join(" ");
  return `<div class="api">GET /graphs?host=${host}&test=${test}&from=-24h  →  (RRD image)</div>`+
         `<svg width="${w}" height="${h}" style="border:1px solid #d4dde6;background:#fafcff">`+
         `<polyline fill="none" stroke="#2b7bff" stroke-width="2" points="${path}"/></svg>`+
         `<div class="muted">graphs the value of one metric over time (/series + /graphs)</div>`;
}

// ---- legend (severity → colour, the mapping) ----------------------------
document.getElementById("legend").innerHTML =
  "severity→colour: " + ["ok","warning","critical","disabled","nodata","unknown"]
    .map(s => `${ball(s,9)} ${s}`).join("  ");

document.getElementById("groupby").addEventListener("change", render);
document.getElementById("onlyprob").addEventListener("change", render);
document.getElementById("ts").textContent = new Date().toISOString().replace("T"," ").slice(0,19)+" UTC";
render();
</script>
</body>
</html>
