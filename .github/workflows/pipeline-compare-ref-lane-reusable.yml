name: Pipeline - Compare Reference Lane (Reusable)

on:
  workflow_call:
    inputs:
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string
      source_run_id:
        description: Workflow run id containing generated ref artifacts
        required: true
        type: string
      publish:
        description: Publish channel (none|artifact)
        required: true
        type: string
      allow_failure_mode:
        description: Handling of lanes marked allow_failure (off|allow|expect_fail)
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  compare:
    name: ${{ inputs.lane_name }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve lane context
        id: lane_ctx
        uses: ./.github/actions/ref-lane-context
        with:
          lane_json: ${{ inputs.lane_json }}
          verify_depth: install
          goal: ref
          ref_mode: compare
          publish: ${{ inputs.publish }}
          allow_failure_mode: ${{ inputs.allow_failure_mode }}

      - name: Download generated reference artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ fromJSON(steps.lane_ctx.outputs.lane_post_json).ref_generate_artifact_name }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).CANDIDATE_DIR }}

      - name: Compare downloaded references
        id: compare
        continue-on-error: ${{ steps.lane_ctx.outputs.continue_on_error == 'true' }}
        shell: bash
        env:
          BASELINE_PREFIX: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).BASELINE_PREFIX }}
          CANDIDATE_DIR: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).CANDIDATE_DIR }}
        run: |
          set -euo pipefail
          bash ci/compare-refs.sh \
            --baseline-prefix "${BASELINE_PREFIX}" \
            --candidate-dir "${CANDIDATE_DIR}"

      - name: Post lane (policy + artifacts)
        if: ${{ always() }}
        uses: ./.github/actions/ref-lane-post
        with:
          lane_post_json: ${{ steps.lane_ctx.outputs.lane_post_json }}
          lane_outcome: ${{ steps.compare.outcome }}
