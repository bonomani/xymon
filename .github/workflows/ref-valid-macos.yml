name: Reference Validation - macOS

on:
  workflow_dispatch:

jobs:
  ref-valid-macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Server lanes first, then client ct-client, then client ct-server.
          # Newest first: latest, then 26, then 15, then 14.
          - name: macOS latest - Server
            runner: macos-latest
            macos_version: "latest"
            variant: server
          - name: macOS latest - Client (ct-client)
            runner: macos-latest
            macos_version: "latest"
            variant: localclient
          - name: macOS latest - Client (ct-server)
            runner: macos-latest
            macos_version: "latest"
            variant: client
          - name: macOS 26 - Server
            runner: macos-26
            macos_version: "26"
            variant: server
          - name: macOS 26 - Client (ct-client)
            runner: macos-26
            macos_version: "26"
            variant: localclient
          - name: macOS 26 - Client (ct-server)
            runner: macos-26
            macos_version: "26"
            variant: client
          - name: macOS 15 - Server
            runner: macos-15
            macos_version: "15"
            variant: server
          - name: macOS 15 - Client (ct-client)
            runner: macos-15
            macos_version: "15"
            variant: localclient
          - name: macOS 15 - Client (ct-server)
            runner: macos-15
            macos_version: "15"
            variant: client
          - name: macOS 14 - Server
            runner: macos-14
            macos_version: "14"
            variant: server
          - name: macOS 14 - Client (ct-client)
            runner: macos-14
            macos_version: "14"
            variant: localclient
          - name: macOS 14 - Client (ct-server)
            runner: macos-14
            macos_version: "14"
            variant: client
    env:
      VARIANT: ${{ matrix.variant }}
      ENABLE_LDAP: ${{ matrix.variant == 'server' && 'ON' || 'OFF' }}
      ENABLE_SNMP: ${{ matrix.variant == 'server' && 'ON' || 'OFF' }}
      LEGACY_APPLY_OWNERSHIP: ON
      XYMONUSER: _www
      XYMONGROUP: _www
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load legacy hostname (runs for each matrix variant)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/load-legacy-hostname.sh \
            --config "docs/cmake-legacy-migration/refs/make_freebsd/server/var/lib/xymon/server/etc/xymonserver.cfg"

      - name: Bootstrap install + metadata (CMake)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/bootstrap-cmake-refs.sh \
            --os macos \
            --version "${{ matrix.macos_version }}" \
            --variant "${{ matrix.variant }}" \
            --ref-prefix "docs/cmake-legacy-migration/refs/make_freebsd/${{ matrix.variant }}" \
            --refs-root ".ci-artifacts/ref-valid-macos/refs" \
            --artifact-root ".ci-artifacts/ref-valid-macos/${{ matrix.macos_version }}-${{ matrix.variant }}"

      - name: Compare refs snapshot (blocking policy checks)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/compare-refs.sh \
            --baseline-prefix "docs/cmake-legacy-migration/refs/make_freebsd/${{ matrix.variant }}" \
            --candidate-dir ".ci-artifacts/ref-valid-macos/refs/cmake.macos.${{ matrix.variant }}"

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ref-valid-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            .ci-artifacts/ref-valid-macos/${{ matrix.macos_version }}-${{ matrix.variant }}/**
            .ci-artifacts/ref-valid-macos/refs/cmake.macos.${{ matrix.variant }}/**
            /tmp/legacy.config.extract
            /tmp/cmake.config.extract
            /tmp/config.diff
            /tmp/legacy.list
            /tmp/cmake.list
            /tmp/cmake.filtered.list
            /tmp/allowed-extras.list
            /tmp/legacy-cmake.diff
            /tmp/legacy.keyfiles.missing
            /tmp/legacy.keyfiles.sha256
            /tmp/legacy.keyfiles.perms
            /tmp/legacy.keyfiles.sha256.diff
            /tmp/legacy.symlinks.broken
            /tmp/legacy.symlinks.list
            /tmp/legacy.perms.snapshot
            /tmp/legacy.owners.snapshot
            /tmp/legacy.bin.links
            /tmp/legacy.embedded.paths
            /tmp/legacy.symlinks.diff
            /tmp/legacy.perms.diff
            /tmp/legacy.owners.diff
            /tmp/legacy.owners.names.diff
            /tmp/legacy.binlinks.diff
            /tmp/legacy.needed.norm.diff
            /tmp/legacy.embedded.diff
