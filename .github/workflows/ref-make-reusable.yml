name: Reference Generation - Reusable Lane

on:
  workflow_call:
    inputs:
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string

permissions:
  contents: read

jobs:
  make-linux:
    if: ${{ fromJSON(inputs.lane_json).runtime == 'linux_container' }}
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runs_on || 'ubuntu-22.04' }}
    env:
      BUILD_TOOL: ${{ fromJSON(inputs.lane_json).build_tool || 'make' }}
      REF_OS: ${{ fromJSON(inputs.lane_json).ref_os }}
      VARIANT: ${{ fromJSON(inputs.lane_json).variant }}
      REF_STAGE_ROOT: ${{ github.workspace }}/tmp/xymon-refs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap install + refs on Linux
        shell: bash
        run: |
          set -euo pipefail
          uname -a || true
          gcc --version || true
          ld --version || true
          mkdir -p "${REF_STAGE_ROOT}"
          build_tool="${BUILD_TOOL}"
          bash ci/bootstrap-install.sh \
            --os "${REF_OS}" \
            --variant "${VARIANT}" \
            --build "$build_tool"
          if [ ! -f /tmp/xymon-root-vars.sh ]; then
            echo "Staged tree metadata missing" >&2
            exit 1
          fi
          source /tmp/xymon-root-vars.sh
          bash ci/generate-refs.sh \
            --os "${REF_OS}" \
            --variant "${VARIANT}" \
            --root "${LEGACY_ROOT}" \
            --topdir "${LEGACY_TOPDIR}" \
            --build "${BUILD_TOOL}" \
            --refs-root "${REF_STAGE_ROOT}"

      - name: Upload legacy references
        uses: actions/upload-artifact@v4
        with:
          name: ref_${{ env.BUILD_TOOL }}_${{ env.REF_OS }}-${{ env.VARIANT }}
          path: |
            ${{ env.REF_STAGE_ROOT }}/${{ env.BUILD_TOOL }}.${{ env.REF_OS }}.${{ env.VARIANT }}/**
          if-no-files-found: error

  make-bsd:
    if: ${{ fromJSON(inputs.lane_json).runtime == 'bsd_vm' }}
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runs_on || 'ubuntu-22.04' }}
    env:
      BUILD_TOOL: ${{ fromJSON(inputs.lane_json).build_tool || 'make' }}
      REF_OS: ${{ fromJSON(inputs.lane_json).ref_os }}
      OS_VERSION: ${{ fromJSON(inputs.lane_json).os_version }}
      VARIANT: ${{ fromJSON(inputs.lane_json).variant }}
      ARCHITECTURE: ${{ fromJSON(inputs.lane_json).architecture || 'x86-64' }}
      VM_MEMORY: ${{ fromJSON(inputs.lane_json).vm_memory || '1024M' }}
      VM_CPU_COUNT: ${{ fromJSON(inputs.lane_json).vm_cpu_count || 2 }}
      REF_STAGE_ROOT: ${{ github.workspace }}/tmp/xymon-refs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap install + refs on BSD VM
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: ${{ env.REF_OS }}
          architecture: ${{ env.ARCHITECTURE }}
          version: ${{ env.OS_VERSION }}
          shell: bash
          memory: ${{ env.VM_MEMORY }}
          cpu_count: ${{ env.VM_CPU_COUNT }}
          run: |
            set -euo pipefail
            uname -a || true
            gcc --version || true
            ld --version || true
            mkdir -p "${{ env.REF_STAGE_ROOT }}"
            build_tool="${{ env.BUILD_TOOL }}"
            bash ci/bootstrap-install.sh \
              --os "${{ env.REF_OS }}" \
              --version "${{ env.OS_VERSION }}" \
              --variant "${{ env.VARIANT }}" \
              --build "$build_tool"
            if [ ! -f /tmp/xymon-root-vars.sh ]; then
              echo "Staged tree metadata missing" >&2
              exit 1
            fi
            source /tmp/xymon-root-vars.sh
            bash ci/generate-refs.sh \
              --os "${{ env.REF_OS }}" \
              --variant "${{ env.VARIANT }}" \
              --root "${LEGACY_ROOT}" \
              --topdir "${LEGACY_TOPDIR}" \
              --build "${{ env.BUILD_TOOL }}" \
              --refs-root "${{ env.REF_STAGE_ROOT }}"
          sync_files: true
          shutdown_vm: true

      - name: Upload legacy references
        uses: actions/upload-artifact@v4
        with:
          name: ref_${{ env.BUILD_TOOL }}_${{ env.REF_OS }}-${{ env.VARIANT }}
          path: |
            ${{ env.REF_STAGE_ROOT }}/${{ env.BUILD_TOOL }}.${{ env.REF_OS }}.${{ env.VARIANT }}/**
          if-no-files-found: error
