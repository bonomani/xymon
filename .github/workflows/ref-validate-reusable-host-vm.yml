name: Reference Validation - Reusable Host/VM Lane

on:
  workflow_call:
    inputs:
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string

permissions:
  contents: read

jobs:
  host-vm:
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runner || fromJSON(inputs.lane_json).runs_on || 'ubuntu-22.04' }}
    continue-on-error: ${{ fromJSON(inputs.lane_json).allow_failure == true }}
    env:
      VARIANT: ${{ fromJSON(inputs.lane_json).variant }}
      ENABLE_LDAP: ${{ fromJSON(inputs.lane_json).variant == 'server' && 'ON' || 'OFF' }}
      ENABLE_SNMP: ${{ fromJSON(inputs.lane_json).variant == 'server' && 'ON' || 'OFF' }}
      LEGACY_APPLY_OWNERSHIP: ON
      XYMONUSER: ${{ fromJSON(inputs.lane_json).ref_os == 'macos' && '_www' || '' }}
      XYMONGROUP: ${{ fromJSON(inputs.lane_json).ref_os == 'macos' && '_www' || '' }}
      BASELINE_ROOT: ${{ fromJSON(inputs.lane_json).baseline_root }}
      REF_OS: ${{ fromJSON(inputs.lane_json).ref_os }}
      OS_VERSION: ${{ fromJSON(inputs.lane_json).os_version }}
      ARCHITECTURE: ${{ fromJSON(inputs.lane_json).architecture || 'x86-64' }}
      ARTIFACT_FAMILY: ${{ fromJSON(inputs.lane_json).artifact_family }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load legacy hostname (runs for each matrix variant)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/load-legacy-hostname.sh \
            --config "docs/cmake-legacy-migration/refs/${BASELINE_ROOT}/server/var/lib/xymon/server/etc/xymonserver.cfg"

      - name: Bootstrap install + metadata (CMake, BSD VM adapter) [attempt 1]
        if: ${{ env.REF_OS != 'macos' }}
        id: bootstrap_bsd_try1
        continue-on-error: true
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: ${{ env.REF_OS }}
          architecture: ${{ env.ARCHITECTURE }}
          version: ${{ env.OS_VERSION }}
          shell: bash
          memory: 2048M
          cpu_count: 2
          sync_files: true
          run: |
            set -euo pipefail
            bash ci/run/ref/bootstrap-cmake-refs.sh \
              --os "${{ env.REF_OS }}" \
              --version "${{ env.OS_VERSION }}" \
              --variant "${{ env.VARIANT }}" \
              --ref-prefix "docs/cmake-legacy-migration/refs/${{ env.BASELINE_ROOT }}/${{ env.VARIANT }}" \
              --refs-root ".ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/refs" \
              --artifact-root ".ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/${{ env.OS_VERSION }}-${{ env.VARIANT }}"

      - name: Bootstrap install + metadata (CMake, BSD VM adapter) [attempt 2]
        if: ${{ env.REF_OS != 'macos' && steps.bootstrap_bsd_try1.outcome == 'failure' }}
        id: bootstrap_bsd_try2
        continue-on-error: true
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: ${{ env.REF_OS }}
          architecture: ${{ env.ARCHITECTURE }}
          version: ${{ env.OS_VERSION }}
          shell: bash
          memory: 2048M
          cpu_count: 2
          sync_files: true
          run: |
            set -euo pipefail
            bash ci/run/ref/bootstrap-cmake-refs.sh \
              --os "${{ env.REF_OS }}" \
              --version "${{ env.OS_VERSION }}" \
              --variant "${{ env.VARIANT }}" \
              --ref-prefix "docs/cmake-legacy-migration/refs/${{ env.BASELINE_ROOT }}/${{ env.VARIANT }}" \
              --refs-root ".ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/refs" \
              --artifact-root ".ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/${{ env.OS_VERSION }}-${{ env.VARIANT }}"

      - name: Bootstrap install + metadata (CMake, BSD VM adapter) [attempt 3]
        if: ${{ env.REF_OS != 'macos' && steps.bootstrap_bsd_try1.outcome == 'failure' && steps.bootstrap_bsd_try2.outcome == 'failure' }}
        id: bootstrap_bsd_try3
        continue-on-error: true
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: ${{ env.REF_OS }}
          architecture: ${{ env.ARCHITECTURE }}
          version: ${{ env.OS_VERSION }}
          shell: bash
          memory: 2048M
          cpu_count: 2
          sync_files: true
          run: |
            set -euo pipefail
            bash ci/run/ref/bootstrap-cmake-refs.sh \
              --os "${{ env.REF_OS }}" \
              --version "${{ env.OS_VERSION }}" \
              --variant "${{ env.VARIANT }}" \
              --ref-prefix "docs/cmake-legacy-migration/refs/${{ env.BASELINE_ROOT }}/${{ env.VARIANT }}" \
              --refs-root ".ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/refs" \
              --artifact-root ".ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/${{ env.OS_VERSION }}-${{ env.VARIANT }}"

      - name: Fail if BSD VM bootstrap retries are exhausted
        if: ${{ env.REF_OS != 'macos' && steps.bootstrap_bsd_try1.outcome == 'failure' && steps.bootstrap_bsd_try2.outcome == 'failure' && steps.bootstrap_bsd_try3.outcome == 'failure' }}
        shell: bash
        run: |
          echo "BSD VM bootstrap failed after 3 attempts." >&2
          exit 1

      - name: Bootstrap install + metadata (CMake, macOS host adapter)
        if: ${{ env.REF_OS == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/bootstrap-cmake-refs.sh \
            --os "${REF_OS}" \
            --version "${OS_VERSION}" \
            --variant "${VARIANT}" \
            --ref-prefix "docs/cmake-legacy-migration/refs/${BASELINE_ROOT}/${VARIANT}" \
            --refs-root ".ci-artifacts/ref-valid-${ARTIFACT_FAMILY}/refs" \
            --artifact-root ".ci-artifacts/ref-valid-${ARTIFACT_FAMILY}/${OS_VERSION}-${VARIANT}"

      - name: Compare refs snapshot (blocking policy checks)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/compare-refs.sh \
            --baseline-prefix "docs/cmake-legacy-migration/refs/${BASELINE_ROOT}/${VARIANT}" \
            --candidate-dir ".ci-artifacts/ref-valid-${ARTIFACT_FAMILY}/refs/cmake.${REF_OS}.${VARIANT}"

      - name: Upload artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-ref-valid-artifacts
        with:
          lane_name: ${{ inputs.lane_name }}
          if_no_files_found: warn
          extra_paths: |
            .ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/${{ env.OS_VERSION }}-${{ env.VARIANT }}/**
            .ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/refs/cmake.${{ env.REF_OS }}.${{ env.VARIANT }}/**
