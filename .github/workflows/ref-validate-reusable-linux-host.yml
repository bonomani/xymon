name: Reference Validation - Reusable Linux Host Lane

on:
  workflow_call:
    inputs:
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string
      upload_artifacts:
        description: Override artifact upload behavior (1 or 0)
        required: false
        default: ''
        type: string
      run_compare:
        description: Run compare policy checks (1 or 0)
        required: false
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  linux-host:
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runs_on || 'ubuntu-22.04' }}
    continue-on-error: ${{ fromJSON(inputs.lane_json).allow_failure == true }}
    env:
      BUILD_TOOL: ${{ fromJSON(inputs.lane_json).build_tool || 'cmake' }}
      VARIANT: ${{ fromJSON(inputs.lane_json).variant }}
      ENABLE_LDAP: ${{ fromJSON(inputs.lane_json).variant == 'server' && 'ON' || 'OFF' }}
      ENABLE_SNMP: ${{ fromJSON(inputs.lane_json).variant == 'server' && 'ON' || 'OFF' }}
      LEGACY_APPLY_OWNERSHIP: ON
      CMAKE_BIN: ${{ fromJSON(inputs.lane_json).cmake_bin || '' }}
      BASELINE_ROOT: ${{ fromJSON(inputs.lane_json).baseline_root || 'make_linux' }}
      REF_OS: ${{ fromJSON(inputs.lane_json).ref_os || 'linux' }}
      PLATFORM_OS: ${{ fromJSON(inputs.lane_json).platform_os || fromJSON(inputs.lane_json).ref_os || 'linux' }}
      ARTIFACT_FAMILY: ${{ fromJSON(inputs.lane_json).artifact_family || 'linux' }}
      PLATFORM_ID: ${{ fromJSON(inputs.lane_json).platform_id || 'linux-host' }}
      ARTIFACT_ARCH: ${{ fromJSON(inputs.lane_json).artifact_arch || 'amd64' }}
      UPLOAD_ARTIFACTS: ${{ inputs.upload_artifacts != '' && inputs.upload_artifacts || (fromJSON(inputs.lane_json).upload_artifacts == true && '1' || '0') }}
      RUN_COMPARE: ${{ inputs.run_compare }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run shared Linux validation sequence
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/run-linux-ref-validation.sh \
            --build "${BUILD_TOOL}" \
            --variant "${VARIANT}" \
            --baseline-root "${BASELINE_ROOT}" \
            --ref-os "${REF_OS}" \
            --artifact-family "${ARTIFACT_FAMILY}" \
            --platform-id "${PLATFORM_ID}" \
            --run-compare "${RUN_COMPARE}"

      - name: Upload dependency report
        if: ${{ always() && env.UPLOAD_ARTIFACTS == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: deps_valid_${{ env.BUILD_TOOL }}_${{ env.PLATFORM_ID }}_${{ env.VARIANT }}__${{ env.ARTIFACT_ARCH }}__${{ inputs.lane_name }}
          path: .ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/${{ env.BUILD_TOOL }}-${{ env.PLATFORM_ID }}-${{ env.VARIANT }}/deps-report.json
          if-no-files-found: warn

      - name: Upload artifacts
        if: ${{ always() && env.UPLOAD_ARTIFACTS == '1' }}
        uses: ./.github/actions/upload-ref-valid-artifacts
        with:
          lane_name: ${{ inputs.lane_name }}
          extra_paths: |
            .ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/${{ env.BUILD_TOOL }}-${{ env.PLATFORM_ID }}-${{ env.VARIANT }}/**
            .ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/refs/${{ env.BUILD_TOOL }}.${{ env.REF_OS }}.${{ env.VARIANT }}/**

      - name: Skip artifacts when upload is disabled
        if: ${{ always() && env.UPLOAD_ARTIFACTS != '1' }}
        shell: bash
        run: |
          echo "Skipping actions/upload-artifact for this lane."
