name: Reference Generation - Select Family

on:
  workflow_dispatch:
    inputs:
      family:
        description: Select which reference-generation family to run
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - alpine
          - archlinux
          - centos7
          - debian
          - freebsd
          - macos
          - netbsd
          - openbsd
          - opensuse
          - redhat
          - fedora
          - oraclelinux
          - ubuntu
      build_tool:
        description: Build tool selection (auto derives from goal/ref_mode)
        required: true
        type: choice
        default: auto
        options:
          - auto
          - make
          - cmake
      goal:
        description: Orthogonal goal selector
        required: true
        type: choice
        default: verify
        options:
          - verify
          - ref
      ref_mode:
        description: Reference mode when goal=ref
        required: true
        type: choice
        default: generate
        options:
          - generate
          - compare
      publish:
        description: Publish channel
        required: true
        type: choice
        default: none
        options:
          - none
          - artifact
      allow_failure_mode:
        description: Handling of lanes marked allow_failure
        required: true
        type: choice
        default: allow
        options:
          - off
          - allow
          - expect_fail
      source_ref:
        description: Optional branch or tag to run this selector on
        required: false
        type: string
  workflow_call:
    inputs:
      family:
        description: Reference-generation family key (or all)
        required: true
        type: string
      build_tool:
        description: Build tool selection (auto|make|cmake)
        required: true
        type: string
      goal:
        description: Orthogonal goal selector (verify|ref)
        required: true
        type: string
      ref_mode:
        description: Reference mode when goal=ref (generate|compare)
        required: true
        type: string
      publish:
        description: Publish channel (none|artifact)
        required: true
        type: string
      allow_failure_mode:
        description: Handling of lanes marked allow_failure (off|allow|expect_fail)
        required: true
        type: string

permissions:
  contents: read

jobs:
  redispatch-selected-ref:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref != '' && inputs.source_ref != github.ref_name && inputs.source_ref != github.ref }}
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch this workflow on selected ref
        uses: actions/github-script@v7
        with:
          retries: 5
          # Keep caller/config errors non-retriable while retrying transient 5xx/network faults.
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ref-make-select.yml',
              ref: '${{ inputs.source_ref }}',
              inputs: {
                family: '${{ inputs.family }}',
                build_tool: '${{ inputs.build_tool }}',
                goal: '${{ inputs.goal }}',
                ref_mode: '${{ inputs.ref_mode }}',
                publish: '${{ inputs.publish }}',
                allow_failure_mode: '${{ inputs.allow_failure_mode }}',
                source_ref: '${{ inputs.source_ref }}'
              }
            });
            core.info('Dispatched ref-make-select.yml (family=${{ inputs.family }}, build_tool=${{ inputs.build_tool }}, goal=${{ inputs.goal }}, ref_mode=${{ inputs.ref_mode }}, publish=${{ inputs.publish }}, allow_failure_mode=${{ inputs.allow_failure_mode }}) on ref ${{ inputs.source_ref }}');

  build-matrix:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_ref == '' || inputs.source_ref == github.ref_name || inputs.source_ref == github.ref }}
    runs-on: ubuntu-22.04
    outputs:
      matrix_all: ${{ steps.generate.outputs.matrix_all }}
      matrix_linux_host: ${{ steps.generate.outputs.matrix_linux_host }}
      matrix_linux_container: ${{ steps.generate.outputs.matrix_linux_container }}
      matrix_bsd_vm: ${{ steps.generate.outputs.matrix_bsd_vm }}
      matrix_macos_host: ${{ steps.generate.outputs.matrix_macos_host }}
      goal: ${{ steps.resolve_execution.outputs.goal }}
      ref_mode: ${{ steps.resolve_execution.outputs.ref_mode }}
      publish: ${{ steps.resolve_execution.outputs.publish }}
      allow_failure_mode: ${{ steps.resolve_execution.outputs.allow_failure_mode }}
      dep_mode: ${{ steps.resolve_execution.outputs.dep_mode }}
      lane_count_total: ${{ steps.generate.outputs.lane_count_total }}
      lane_count_linux_host: ${{ steps.generate.outputs.lane_count_linux_host }}
      lane_count_linux_container: ${{ steps.generate.outputs.lane_count_linux_container }}
      lane_count_bsd_vm: ${{ steps.generate.outputs.lane_count_bsd_vm }}
      lane_count_macos_host: ${{ steps.generate.outputs.lane_count_macos_host }}
      selected_families: ${{ steps.generate.outputs.selected_families }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve execution model
        id: resolve_execution
        shell: bash
        env:
          INPUT_BUILD_TOOL: ${{ inputs.build_tool }}
          INPUT_GOAL: ${{ inputs.goal }}
          INPUT_REF_MODE: ${{ inputs.ref_mode }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_ALLOW_FAILURE_MODE: ${{ inputs.allow_failure_mode }}
        run: |
          set -euo pipefail

          bash ci/run/ref/resolve-execution-model.sh \
            --requested-build-tool "${INPUT_BUILD_TOOL}" \
            --goal "${INPUT_GOAL}" \
            --ref-mode "${INPUT_REF_MODE}" \
            --publish "${INPUT_PUBLISH}" \
            --allow-failure-mode "${INPUT_ALLOW_FAILURE_MODE}" \
            --github-output "${GITHUB_OUTPUT}" > /dev/null

      - name: Build selected lanes matrix
        id: generate
        shell: bash
        env:
          SELECTED_FAMILY: ${{ inputs.family }}
          SELECTED_BUILD_TOOL: ${{ steps.resolve_execution.outputs.build_tool }}
          PURPOSE: ${{ steps.resolve_execution.outputs.purpose }}
        run: |
          set -euo pipefail

          args=(
            python3 "ci/run/ref/build-ref-make-matrix.py"
            --purpose "${PURPOSE}"
            --selected-family "${SELECTED_FAMILY}"
            --build-tool "${SELECTED_BUILD_TOOL}"
            --manifest "ci/run/ref/ref-families.yml"
            --selector-workflow ".github/workflows/ref-make-select.yml"
            --github-output "${GITHUB_OUTPUT}"
          )

          "${args[@]}"

      - name: Matrix summary
        shell: bash
        run: |
          echo "Selected families: ${{ steps.generate.outputs.selected_families }}"
          echo "Build tool: ${{ steps.resolve_execution.outputs.build_tool }}"
          echo "Goal: ${{ steps.resolve_execution.outputs.goal }}"
          echo "Ref mode: ${{ steps.resolve_execution.outputs.ref_mode }}"
          echo "Publish: ${{ steps.resolve_execution.outputs.publish }}"
          echo "Allow-failure mode: ${{ steps.resolve_execution.outputs.allow_failure_mode }}"
          echo "Dependency mode: ${{ steps.resolve_execution.outputs.dep_mode }}"
          echo "Lane count (total): ${{ steps.generate.outputs.lane_count_total }}"
          echo "Lane count (linux_host): ${{ steps.generate.outputs.lane_count_linux_host }}"
          echo "Lane count (linux_container): ${{ steps.generate.outputs.lane_count_linux_container }}"
          echo "Lane count (bsd_vm): ${{ steps.generate.outputs.lane_count_bsd_vm }}"
          echo "Lane count (macos_host): ${{ steps.generate.outputs.lane_count_macos_host }}"

  ref-lanes:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_total != '0' }}
    name: ${{ matrix.lane.name }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_all) }}
    uses: ./.github/workflows/ref-make-reusable-lane.yml
    secrets: inherit
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
      goal: ${{ needs.build-matrix.outputs.goal }}
      ref_mode: ${{ needs.build-matrix.outputs.ref_mode }}
      publish: ${{ needs.build-matrix.outputs.publish }}
      allow_failure_mode: ${{ needs.build-matrix.outputs.allow_failure_mode }}
      dep_mode: ${{ needs.build-matrix.outputs.dep_mode }}
