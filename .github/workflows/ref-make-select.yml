name: Reference Generation - Select Family

on:
  workflow_dispatch:
    inputs:
      family:
        description: Select which reference-generation family to run
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - alpine
          - archlinux
          - centos7
          - debian
          - freebsd
          - macos
          - netbsd
          - openbsd
          - opensuse
          - redhat
          - fedora
          - oraclelinux
          - ubuntu
      build_tool:
        description: Build tool selection (auto derives from goal/ref_mode)
        required: true
        type: choice
        default: auto
        options:
          - auto
          - make
          - cmake
      goal:
        description: Orthogonal goal selector
        required: true
        type: choice
        default: verify
        options:
          - verify
          - ref
      ref_mode:
        description: Reference mode when goal=ref
        required: true
        type: choice
        default: generate
        options:
          - generate
          - compare
      publish:
        description: Publish channel
        required: true
        type: choice
        default: none
        options:
          - none
          - artifact
      allow_failure_mode:
        description: Handling of lanes marked allow_failure
        required: true
        type: choice
        default: allow
        options:
          - off
          - allow
          - expect_fail
      source_ref:
        description: Optional branch or tag to run this selector on
        required: false
        type: string
  workflow_call:
    inputs:
      family:
        description: Reference-generation family key (or all)
        required: true
        type: string
      build_tool:
        description: Build tool selection (auto|make|cmake)
        required: false
        default: auto
        type: string
      goal:
        description: Orthogonal goal selector (verify|ref)
        required: false
        default: verify
        type: string
      ref_mode:
        description: Reference mode when goal=ref (generate|compare)
        required: false
        default: generate
        type: string
      publish:
        description: Publish channel (none|artifact)
        required: false
        default: none
        type: string
      allow_failure_mode:
        description: Handling of lanes marked allow_failure (off|allow|expect_fail)
        required: false
        default: allow
        type: string

permissions:
  contents: read

jobs:
  redispatch-selected-ref:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref != '' && inputs.source_ref != github.ref_name && inputs.source_ref != github.ref }}
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch this workflow on selected ref
        uses: actions/github-script@v7
        with:
          retries: 5
          # Keep caller/config errors non-retriable while retrying transient 5xx/network faults.
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ref-make-select.yml',
              ref: '${{ inputs.source_ref }}',
              inputs: {
                family: '${{ inputs.family }}',
                build_tool: '${{ inputs.build_tool }}',
                goal: '${{ inputs.goal }}',
                ref_mode: '${{ inputs.ref_mode }}',
                publish: '${{ inputs.publish }}',
                allow_failure_mode: '${{ inputs.allow_failure_mode }}',
                source_ref: '${{ inputs.source_ref }}'
              }
            });
            core.info('Dispatched ref-make-select.yml (family=${{ inputs.family }}, build_tool=${{ inputs.build_tool }}, goal=${{ inputs.goal }}, ref_mode=${{ inputs.ref_mode }}, publish=${{ inputs.publish }}, allow_failure_mode=${{ inputs.allow_failure_mode }}) on ref ${{ inputs.source_ref }}');

  build-matrix:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_ref == '' || inputs.source_ref == github.ref_name || inputs.source_ref == github.ref }}
    runs-on: ubuntu-22.04
    outputs:
      matrix_linux_host: ${{ steps.generate.outputs.matrix_linux_host }}
      matrix_linux_container: ${{ steps.generate.outputs.matrix_linux_container }}
      matrix_bsd_vm: ${{ steps.generate.outputs.matrix_bsd_vm }}
      matrix_macos_host: ${{ steps.generate.outputs.matrix_macos_host }}
      goal: ${{ steps.resolve_execution.outputs.goal }}
      ref_mode: ${{ steps.resolve_execution.outputs.ref_mode }}
      publish: ${{ steps.resolve_execution.outputs.publish }}
      allow_failure_mode: ${{ steps.resolve_execution.outputs.allow_failure_mode }}
      lane_count_total: ${{ steps.generate.outputs.lane_count_total }}
      lane_count_linux_host: ${{ steps.generate.outputs.lane_count_linux_host }}
      lane_count_linux_container: ${{ steps.generate.outputs.lane_count_linux_container }}
      lane_count_bsd_vm: ${{ steps.generate.outputs.lane_count_bsd_vm }}
      lane_count_macos_host: ${{ steps.generate.outputs.lane_count_macos_host }}
      selected_families: ${{ steps.generate.outputs.selected_families }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve execution model
        id: resolve_execution
        shell: bash
        env:
          INPUT_BUILD_TOOL: ${{ inputs.build_tool }}
          INPUT_GOAL: ${{ inputs.goal }}
          INPUT_REF_MODE: ${{ inputs.ref_mode }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_ALLOW_FAILURE_MODE: ${{ inputs.allow_failure_mode }}
        run: |
          set -euo pipefail

          requested_build_tool="${INPUT_BUILD_TOOL:-auto}"
          goal="${INPUT_GOAL:-verify}"
          ref_mode="${INPUT_REF_MODE:-generate}"
          publish="${INPUT_PUBLISH:-none}"
          allow_failure_mode_raw="${INPUT_ALLOW_FAILURE_MODE:-allow}"
          case "${allow_failure_mode_raw}" in
            false|0|no)
              allow_failure_mode="off"
              ;;
            true|1|yes)
              allow_failure_mode="allow"
              ;;
            *)
              allow_failure_mode="${allow_failure_mode_raw}"
              ;;
          esac

          case "${goal}" in
            verify|ref)
              ;;
            *)
              echo "Unsupported goal: ${goal}" >&2
              exit 2
              ;;
          esac
          case "${ref_mode}" in
            generate|compare)
              ;;
            *)
              echo "Unsupported ref_mode: ${ref_mode}" >&2
              exit 2
              ;;
          esac
          case "${publish}" in
            none|artifact)
              ;;
            *)
              echo "Unsupported publish: ${publish}" >&2
              exit 2
              ;;
          esac
          case "${allow_failure_mode}" in
            off|allow|expect_fail)
              ;;
            *)
              echo "Unsupported allow_failure_mode: ${allow_failure_mode}" >&2
              exit 2
              ;;
          esac
          case "${requested_build_tool}" in
            auto|make|cmake)
              ;;
            *)
              echo "Unsupported build_tool: ${requested_build_tool}" >&2
              exit 2
              ;;
          esac

          if [[ "${goal}" != "ref" && "${ref_mode}" == "compare" ]]; then
            echo "ref_mode=compare is only valid when goal=ref" >&2
            exit 2
          fi
          if [[ "${goal}" == "verify" && "${ref_mode}" != "generate" ]]; then
            echo "goal=verify requires ref_mode=generate" >&2
            exit 2
          fi
          if [[ "${goal}" == "verify" && "${publish}" != "none" ]]; then
            echo "goal=verify requires publish=none" >&2
            exit 2
          fi

          build_tool="${requested_build_tool}"
          if [[ "${build_tool}" == "auto" ]]; then
            if [[ "${goal}" == "ref" && "${ref_mode}" == "compare" ]]; then
              build_tool="cmake"
            else
              build_tool="make"
            fi
          fi

          {
            echo "build_tool=${build_tool}"
            echo "goal=${goal}"
            echo "ref_mode=${ref_mode}"
            echo "publish=${publish}"
            echo "allow_failure_mode=${allow_failure_mode}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build selected lanes matrix
        id: generate
        shell: bash
        env:
          SELECTED_FAMILY: ${{ inputs.family }}
          SELECTED_BUILD_TOOL: ${{ steps.resolve_execution.outputs.build_tool }}
          GOAL: ${{ steps.resolve_execution.outputs.goal }}
          REF_MODE: ${{ steps.resolve_execution.outputs.ref_mode }}
        run: |
          set -euo pipefail

          purpose="generation"
          if [[ "${GOAL}" == "ref" && "${REF_MODE}" == "compare" ]]; then
            purpose="validation"
          fi

          args=(
            python3 "ci/run/ref/build-ref-make-matrix.py"
            --purpose "${purpose}"
            --selected-family "${SELECTED_FAMILY}"
            --build-tool "${SELECTED_BUILD_TOOL}"
            --manifest "ci/run/ref/ref-families.yml"
            --selector-workflow ".github/workflows/ref-make-select.yml"
            --github-output "${GITHUB_OUTPUT}"
          )

          "${args[@]}"

      - name: Matrix summary
        shell: bash
        run: |
          echo "Selected families: ${{ steps.generate.outputs.selected_families }}"
          echo "Build tool: ${{ steps.resolve_execution.outputs.build_tool }}"
          echo "Goal: ${{ steps.resolve_execution.outputs.goal }}"
          echo "Ref mode: ${{ steps.resolve_execution.outputs.ref_mode }}"
          echo "Publish: ${{ steps.resolve_execution.outputs.publish }}"
          echo "Allow-failure mode: ${{ steps.resolve_execution.outputs.allow_failure_mode }}"
          echo "Lane count (total): ${{ steps.generate.outputs.lane_count_total }}"
          echo "Lane count (linux_host): ${{ steps.generate.outputs.lane_count_linux_host }}"
          echo "Lane count (linux_container): ${{ steps.generate.outputs.lane_count_linux_container }}"
          echo "Lane count (bsd_vm): ${{ steps.generate.outputs.lane_count_bsd_vm }}"
          echo "Lane count (macos_host): ${{ steps.generate.outputs.lane_count_macos_host }}"

  ref-linux-host:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_linux_host != '0' }}
    name: ${{ matrix.lane.name }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_linux_host) }}
    uses: ./.github/workflows/ref-make-reusable-linux-host.yml
    secrets: inherit
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
      goal: ${{ needs.build-matrix.outputs.goal }}
      ref_mode: ${{ needs.build-matrix.outputs.ref_mode }}
      publish: ${{ needs.build-matrix.outputs.publish }}
      allow_failure_mode: ${{ needs.build-matrix.outputs.allow_failure_mode }}

  ref-linux-container:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_linux_container != '0' }}
    name: ${{ matrix.lane.name }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_linux_container) }}
    uses: ./.github/workflows/ref-make-reusable-linux-container.yml
    secrets: inherit
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
      goal: ${{ needs.build-matrix.outputs.goal }}
      ref_mode: ${{ needs.build-matrix.outputs.ref_mode }}
      publish: ${{ needs.build-matrix.outputs.publish }}
      allow_failure_mode: ${{ needs.build-matrix.outputs.allow_failure_mode }}

  ref-bsd-vm:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_bsd_vm != '0' }}
    name: ${{ matrix.lane.name }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_bsd_vm) }}
    uses: ./.github/workflows/ref-make-reusable-bsd-vm.yml
    secrets: inherit
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
      goal: ${{ needs.build-matrix.outputs.goal }}
      ref_mode: ${{ needs.build-matrix.outputs.ref_mode }}
      publish: ${{ needs.build-matrix.outputs.publish }}
      allow_failure_mode: ${{ needs.build-matrix.outputs.allow_failure_mode }}

  ref-macos-host:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_macos_host != '0' }}
    name: ${{ matrix.lane.name }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_macos_host) }}
    uses: ./.github/workflows/ref-make-reusable-macos-host.yml
    secrets: inherit
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
      goal: ${{ needs.build-matrix.outputs.goal }}
      ref_mode: ${{ needs.build-matrix.outputs.ref_mode }}
      publish: ${{ needs.build-matrix.outputs.publish }}
      allow_failure_mode: ${{ needs.build-matrix.outputs.allow_failure_mode }}
