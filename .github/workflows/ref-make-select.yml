name: Reference Generation - Select Family

on:
  workflow_dispatch:
    inputs:
      family:
        description: Select which reference-generation family to run
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - freebsd
          - openbsd
          - netbsd
      source_ref:
        description: Optional branch or tag to run this selector on
        required: false
        type: string
  workflow_call:
    inputs:
      family:
        description: Reference-generation family key (or all)
        required: true
        type: string

permissions:
  contents: read

jobs:
  redispatch-selected-ref:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref != '' && inputs.source_ref != github.ref_name && inputs.source_ref != github.ref }}
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch this workflow on selected ref
        uses: actions/github-script@v7
        with:
          retries: 5
          # Keep caller/config errors non-retriable while retrying transient 5xx/network faults.
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ref-make-select.yml',
              ref: '${{ inputs.source_ref }}',
              inputs: {
                family: '${{ inputs.family }}',
                source_ref: '${{ inputs.source_ref }}'
              }
            });
            core.info('Dispatched ref-make-select.yml (family=${{ inputs.family }}) on ref ${{ inputs.source_ref }}');

  build-matrix:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_ref == '' || inputs.source_ref == github.ref_name || inputs.source_ref == github.ref }}
    runs-on: ubuntu-22.04
    outputs:
      matrix_linux: ${{ steps.generate.outputs.matrix_linux }}
      matrix_host_vm: ${{ steps.generate.outputs.matrix_host_vm }}
      lane_count_total: ${{ steps.generate.outputs.lane_count_total }}
      lane_count_linux: ${{ steps.generate.outputs.lane_count_linux }}
      lane_count_host_vm: ${{ steps.generate.outputs.lane_count_host_vm }}
      selected_families: ${{ steps.generate.outputs.selected_families }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build selected lanes matrix
        id: generate
        shell: bash
        env:
          SELECTED_FAMILY: ${{ inputs.family }}
        run: |
          set -euo pipefail
          python3 ci/run/ref/build-ref-make-matrix.py \
            --selected-family "${SELECTED_FAMILY}" \
            --manifest "ci/run/ref/ref-make-families.yml" \
            --selector-workflow ".github/workflows/ref-make-select.yml" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Matrix summary
        shell: bash
        run: |
          echo "Selected families: ${{ steps.generate.outputs.selected_families }}"
          echo "Lane count (total): ${{ steps.generate.outputs.lane_count_total }}"
          echo "Lane count (linux): ${{ steps.generate.outputs.lane_count_linux }}"
          echo "Lane count (host_vm): ${{ steps.generate.outputs.lane_count_host_vm }}"

  ref-make-linux:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_linux != '0' }}
    name: ${{ matrix.lane.name }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_linux) }}
    uses: ./.github/workflows/ref-make-reusable-linux.yml
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}

  ref-make-host-vm:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_host_vm != '0' }}
    name: ${{ matrix.lane.name }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_host_vm) }}
    uses: ./.github/workflows/ref-make-reusable-host-vm.yml
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
