name: Reference Generation - Select Family

on:
  workflow_dispatch:
    inputs:
      family:
        description: Select which reference-generation family to run
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - alpine
          - archlinux
          - centos7
          - debian
          - freebsd
          - macos
          - netbsd
          - openbsd
          - opensuse
          - redhat
          - fedora
          - oraclelinux
          - ubuntu
      build_tool:
        description: Build tool used to generate reference artifacts
        required: true
        type: choice
        default: make
        options:
          - make
          - cmake
      extra_action:
        description: Optional post-build action
        required: true
        type: choice
        default: no
        options:
          - no
          - upload_artifacts
          - compare_artifacts
      source_ref:
        description: Optional branch or tag to run this selector on
        required: false
        type: string
  workflow_call:
    inputs:
      family:
        description: Reference-generation family key (or all)
        required: true
        type: string
      build_tool:
        description: Build tool used to generate reference artifacts
        required: false
        default: make
        type: string
      extra_action:
        description: Optional post-build action (no|upload_artifacts|compare_artifacts)
        required: false
        default: no
        type: string

permissions:
  contents: read

jobs:
  redispatch-selected-ref:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref != '' && inputs.source_ref != github.ref_name && inputs.source_ref != github.ref }}
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch this workflow on selected ref
        uses: actions/github-script@v7
        with:
          retries: 5
          # Keep caller/config errors non-retriable while retrying transient 5xx/network faults.
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ref-make-select.yml',
              ref: '${{ inputs.source_ref }}',
              inputs: {
                family: '${{ inputs.family }}',
                build_tool: '${{ inputs.build_tool }}',
                extra_action: '${{ inputs.extra_action }}',
                source_ref: '${{ inputs.source_ref }}'
              }
            });
            core.info('Dispatched ref-make-select.yml (family=${{ inputs.family }}, build_tool=${{ inputs.build_tool }}, extra_action=${{ inputs.extra_action }}) on ref ${{ inputs.source_ref }}');

  build-matrix:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_ref == '' || inputs.source_ref == github.ref_name || inputs.source_ref == github.ref }}
    runs-on: ubuntu-22.04
    outputs:
      matrix_linux_host: ${{ steps.generate.outputs.matrix_linux_host }}
      matrix_linux_container: ${{ steps.generate.outputs.matrix_linux_container }}
      matrix_bsd_vm: ${{ steps.generate.outputs.matrix_bsd_vm }}
      matrix_macos_host: ${{ steps.generate.outputs.matrix_macos_host }}
      lane_count_total: ${{ steps.generate.outputs.lane_count_total }}
      lane_count_linux_host: ${{ steps.generate.outputs.lane_count_linux_host }}
      lane_count_linux_container: ${{ steps.generate.outputs.lane_count_linux_container }}
      lane_count_bsd_vm: ${{ steps.generate.outputs.lane_count_bsd_vm }}
      lane_count_macos_host: ${{ steps.generate.outputs.lane_count_macos_host }}
      selected_families: ${{ steps.generate.outputs.selected_families }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate selector combination
        shell: bash
        env:
          SELECTED_FAMILY: ${{ inputs.family }}
          EXTRA_ACTION: ${{ inputs.extra_action }}
        run: |
          set -euo pipefail
          if [[ "${EXTRA_ACTION}" == "compare_artifacts" && "${SELECTED_FAMILY}" == "linux" ]]; then
            echo "family=linux is generation-only and cannot be used with extra_action=compare_artifacts" >&2
            exit 2
          fi

      - name: Build selected lanes matrix
        id: generate
        shell: bash
        env:
          SELECTED_FAMILY: ${{ inputs.family }}
          SELECTED_BUILD_TOOL: ${{ inputs.build_tool }}
          EXTRA_ACTION: ${{ inputs.extra_action }}
        run: |
          set -euo pipefail

          matrix_builder="ci/run/ref/build-ref-make-matrix.py"
          skip_dropdown_parity=0
          if [[ "${EXTRA_ACTION}" == "compare_artifacts" ]]; then
            matrix_builder="ci/run/ref/build-ref-validate-matrix.py"
            # Unified selector has generation+comparison families in one dropdown.
            skip_dropdown_parity=1
          fi

          args=(
            python3 "${matrix_builder}"
            --selected-family "${SELECTED_FAMILY}"
            --build-tool "${SELECTED_BUILD_TOOL}"
            --manifest "ci/run/ref/ref-families.yml"
            --selector-workflow ".github/workflows/ref-make-select.yml"
            --github-output "${GITHUB_OUTPUT}"
          )

          if [[ "${skip_dropdown_parity}" == "1" ]]; then
            args+=(--skip-dropdown-parity)
          fi

          "${args[@]}"

      - name: Matrix summary
        shell: bash
        run: |
          echo "Selected families: ${{ steps.generate.outputs.selected_families }}"
          echo "Build tool: ${{ inputs.build_tool }}"
          echo "Extra action: ${{ inputs.extra_action }}"
          echo "Lane count (total): ${{ steps.generate.outputs.lane_count_total }}"
          echo "Lane count (linux_host): ${{ steps.generate.outputs.lane_count_linux_host }}"
          echo "Lane count (linux_container): ${{ steps.generate.outputs.lane_count_linux_container }}"
          echo "Lane count (bsd_vm): ${{ steps.generate.outputs.lane_count_bsd_vm }}"
          echo "Lane count (macos_host): ${{ steps.generate.outputs.lane_count_macos_host }}"

  ref-make-linux-host:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_linux_host != '0' && inputs.extra_action != 'compare_artifacts' }}
    name: ${{ matrix.lane.name }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_linux_host) }}
    uses: ./.github/workflows/ref-make-reusable-linux-host.yml
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
      upload_artifacts: ${{ inputs.extra_action == 'upload_artifacts' && '1' || '0' }}

  ref-make-linux-container:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_linux_container != '0' && inputs.extra_action != 'compare_artifacts' }}
    name: ${{ matrix.lane.name }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_linux_container) }}
    uses: ./.github/workflows/ref-make-reusable-linux-container.yml
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
      upload_artifacts: ${{ inputs.extra_action == 'upload_artifacts' && '1' || '0' }}

  ref-make-bsd-vm:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_bsd_vm != '0' && inputs.extra_action != 'compare_artifacts' }}
    name: ${{ matrix.lane.name }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_bsd_vm) }}
    uses: ./.github/workflows/ref-make-reusable-bsd-vm.yml
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
      upload_artifacts: ${{ inputs.extra_action == 'upload_artifacts' && '1' || '0' }}

  ref-make-macos-host:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_macos_host != '0' && inputs.extra_action != 'compare_artifacts' }}
    name: ${{ matrix.lane.name }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_macos_host) }}
    uses: ./.github/workflows/ref-make-reusable-macos-host.yml
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
      upload_artifacts: ${{ inputs.extra_action == 'upload_artifacts' && '1' || '0' }}

  ref-compare-linux-host:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_linux_host != '0' && inputs.extra_action == 'compare_artifacts' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_linux_host) }}
    name: ${{ matrix.lane.name }}
    uses: ./.github/workflows/ref-validate-reusable-linux-host.yml
    secrets: inherit
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
      upload_artifacts: '0'
      run_compare: '1'

  ref-compare-linux-container:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_linux_container != '0' && inputs.extra_action == 'compare_artifacts' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_linux_container) }}
    name: ${{ matrix.lane.name }}
    uses: ./.github/workflows/ref-validate-reusable-linux-container.yml
    secrets: inherit
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
      upload_artifacts: '0'
      run_compare: '1'

  ref-compare-bsd-vm:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_bsd_vm != '0' && inputs.extra_action == 'compare_artifacts' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_bsd_vm) }}
    name: ${{ matrix.lane.name }}
    uses: ./.github/workflows/ref-validate-reusable-bsd-vm.yml
    secrets: inherit
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
      upload_artifacts: '0'
      run_compare: '1'

  ref-compare-macos-host:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_macos_host != '0' && inputs.extra_action == 'compare_artifacts' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_macos_host) }}
    name: ${{ matrix.lane.name }}
    uses: ./.github/workflows/ref-validate-reusable-macos-host.yml
    secrets: inherit
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
      upload_artifacts: '0'
      run_compare: '1'
