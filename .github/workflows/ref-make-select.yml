name: Reference Generation - Select Family

on:
  workflow_dispatch:
    inputs:
      family:
        description: Select which reference-generation family to run
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - freebsd
          - openbsd
          - netbsd
  workflow_call:
    inputs:
      family:
        description: Reference-generation family key (or all)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      lane_count: ${{ steps.generate.outputs.lane_count }}
      selected_families: ${{ steps.generate.outputs.selected_families }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build selected lanes matrix
        id: generate
        shell: bash
        env:
          SELECTED_FAMILY: ${{ inputs.family }}
        run: |
          set -euo pipefail
          python3 ci/run/ref/build-ref-make-matrix.py \
            --selected-family "${SELECTED_FAMILY}" \
            --manifest "ci/run/ref/ref-make-families.yml" \
            --selector-workflow ".github/workflows/ref-make-select.yml" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Matrix summary
        shell: bash
        run: |
          echo "Selected families: ${{ steps.generate.outputs.selected_families }}"
          echo "Lane count: ${{ steps.generate.outputs.lane_count }}"

  ref-make:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count != '0' }}
    name: ${{ matrix.lane.name }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    uses: ./.github/workflows/ref-make-reusable.yml
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
