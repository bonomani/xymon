name: Reference Validation - Reusable macOS Lane

on:
  workflow_call:
    inputs:
      family:
        description: Reference validation family key (macos)
        required: true
        type: string
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos-host:
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runner || 'macos-latest' }}
    env:
      VARIANT: ${{ fromJSON(inputs.lane_json).variant }}
      ENABLE_LDAP: ${{ fromJSON(inputs.lane_json).variant == 'server' && 'ON' || 'OFF' }}
      ENABLE_SNMP: ${{ fromJSON(inputs.lane_json).variant == 'server' && 'ON' || 'OFF' }}
      LEGACY_APPLY_OWNERSHIP: ON
      XYMONUSER: _www
      XYMONGROUP: _www
      BASELINE_ROOT: ${{ fromJSON(inputs.lane_json).baseline_root }}
      REF_OS: ${{ fromJSON(inputs.lane_json).ref_os }}
      OS_VERSION: ${{ fromJSON(inputs.lane_json).os_version }}
      ARTIFACT_FAMILY: ${{ fromJSON(inputs.lane_json).artifact_family }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load legacy hostname (runs for each matrix variant)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/load-legacy-hostname.sh \
            --config "docs/cmake-legacy-migration/refs/${BASELINE_ROOT}/server/var/lib/xymon/server/etc/xymonserver.cfg"

      - name: Bootstrap install + metadata (CMake)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/bootstrap-cmake-refs.sh \
            --os "${REF_OS}" \
            --version "${OS_VERSION}" \
            --variant "${VARIANT}" \
            --ref-prefix "docs/cmake-legacy-migration/refs/${BASELINE_ROOT}/${VARIANT}" \
            --refs-root ".ci-artifacts/ref-valid-${ARTIFACT_FAMILY}/refs" \
            --artifact-root ".ci-artifacts/ref-valid-${ARTIFACT_FAMILY}/${OS_VERSION}-${VARIANT}"

      - name: Compare refs snapshot (blocking policy checks)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/compare-refs.sh \
            --baseline-prefix "docs/cmake-legacy-migration/refs/${BASELINE_ROOT}/${VARIANT}" \
            --candidate-dir ".ci-artifacts/ref-valid-${ARTIFACT_FAMILY}/refs/cmake.${REF_OS}.${VARIANT}"

      - name: Upload artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-ref-valid-artifacts
        with:
          lane_name: ${{ inputs.lane_name }}
          if_no_files_found: warn
          extra_paths: |
            .ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/${{ env.OS_VERSION }}-${{ env.VARIANT }}/**
            .ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/refs/cmake.${{ env.REF_OS }}.${{ env.VARIANT }}/**
