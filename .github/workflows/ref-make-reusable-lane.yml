name: Reference Lane - Reusable

on:
  workflow_call:
    inputs:
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string
      goal:
        description: Execution goal (verify|ref)
        required: true
        type: string
      ref_mode:
        description: Reference mode when goal=ref (generate|compare)
        required: true
        type: string
      publish:
        description: Publish channel (none|artifact)
        required: true
        type: string
      allow_failure_mode:
        description: Handling of lanes marked allow_failure (off|allow|expect_fail)
        required: true
        type: string

permissions:
  contents: read

jobs:
  lane:
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runner || fromJSON(inputs.lane_json).runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve lane context
        id: lane_ctx
        uses: ./.github/actions/ref-lane-context
        with:
          lane_json: ${{ inputs.lane_json }}
          goal: ${{ inputs.goal }}
          ref_mode: ${{ inputs.ref_mode }}
          publish: ${{ inputs.publish }}
          allow_failure_mode: ${{ inputs.allow_failure_mode }}

      - name: Render lane environment
        id: lane_env
        shell: bash
        env:
          LANE_ENV_JSON: ${{ steps.lane_ctx.outputs.lane_env_json }}
          CI: ${{ env.CI }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          out_file="tmp/xymon-refs/lane.env.sh"
          bash ci/run/ref/write-lane-env.sh \
            --output "${out_file}" \
            --lane-env-json "${LANE_ENV_JSON}"
          echo "path=${out_file}" >> "${GITHUB_OUTPUT}"

      - name: Run lane orchestration (host/container)
        id: lane_run_host_container
        if: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).RUNTIME_EXECUTION != 'vm' }}
        continue-on-error: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).ALLOW_FAILURE_MODE != 'off' && fromJSON(steps.lane_ctx.outputs.lane_env_json).LANE_ALLOW_FAILURE == '1' }}
        shell: bash
        env:
          LANE_ENV_FILE: ${{ steps.lane_env.outputs.path }}
        run: |
          set -euo pipefail
          bash ci/run/ref/run-runtime-lane.sh

      - name: Run lane orchestration on BSD VM
        id: lane_run_bsd_vm
        if: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).RUNTIME_EXECUTION == 'vm' }}
        continue-on-error: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).ALLOW_FAILURE_MODE != 'off' && fromJSON(steps.lane_ctx.outputs.lane_env_json).LANE_ALLOW_FAILURE == '1' }}
        uses: ./.github/actions/run-bsd-vm-with-retry
        with:
          operating_system: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).REF_OS }}
          architecture: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).ARCHITECTURE }}
          version: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).OS_VERSION }}
          shell: bash
          memory: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).VM_MEMORY }}
          cpu_count: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).VM_CPU_COUNT }}
          sync_files: true
          shutdown_vm: true
          run_script: |
            set -euo pipefail
            export LANE_ENV_FILE="${{ steps.lane_env.outputs.path }}"
            bash ci/run/ref/run-runtime-lane.sh

      - name: Resolve lane run outcome
        id: lane_outcome
        if: ${{ always() }}
        shell: bash
        env:
          RUNTIME: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).RUNTIME }}
          OUTCOME_CHANNEL: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).RUNTIME_OUTCOME_CHANNEL }}
          OUTCOME_HOST_CONTAINER: ${{ steps.lane_run_host_container.outcome }}
          OUTCOME_BSD_VM: ${{ steps.lane_run_bsd_vm.outcome }}
        run: |
          set -euo pipefail
          outcome=""
          case "${OUTCOME_CHANNEL}" in
            bsd_vm)
              outcome="${OUTCOME_BSD_VM}"
              ;;
            host_container)
              outcome="${OUTCOME_HOST_CONTAINER}"
              ;;
            *)
              echo "Unsupported outcome channel '${OUTCOME_CHANNEL}' for runtime '${RUNTIME}'" >&2
              exit 2
              ;;
          esac

          if [[ -z "${outcome}" ]]; then
            echo "Missing lane outcome for runtime '${RUNTIME}'" >&2
            exit 2
          fi

          echo "value=${outcome}" >> "${GITHUB_OUTPUT}"

      - name: Post lane (policy + artifacts)
        if: ${{ always() }}
        uses: ./.github/actions/ref-lane-post
        with:
          allow_failure_mode: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).ALLOW_FAILURE_MODE }}
          lane_allow_failure: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).LANE_ALLOW_FAILURE }}
          lane_outcome: ${{ steps.lane_outcome.outputs.value }}
          goal: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).GOAL }}
          ref_mode: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).REF_MODE }}
          dep_report_path: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).CI_DEPS_REPORT_JSON }}
          upload_artifacts: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).UPLOAD_ARTIFACTS }}
          build_tool: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).BUILD_TOOL }}
          platform_id: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).PLATFORM_ID }}
          variant: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).VARIANT }}
          artifact_arch: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).ARTIFACT_ARCH }}
          lane_name: ${{ inputs.lane_name }}
          artifact_family: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).ARTIFACT_FAMILY }}
          ref_stage_root: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).REF_STAGE_ROOT }}
          ref_os: ${{ fromJSON(steps.lane_ctx.outputs.lane_env_json).REF_OS }}
