name: Reference Lane - Reusable

on:
  workflow_call:
    inputs:
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string
      goal:
        description: Execution goal (verify|ref)
        required: true
        type: string
      ref_mode:
        description: Reference mode when goal=ref (generate|compare)
        required: true
        type: string
      publish:
        description: Publish channel (none|artifact)
        required: true
        type: string
      allow_failure_mode:
        description: Handling of lanes marked allow_failure (off|allow|expect_fail)
        required: true
        type: string

permissions:
  contents: read

jobs:
  lane:
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runner || fromJSON(inputs.lane_json).runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve lane context
        id: lane_ctx
        uses: ./.github/actions/ref-lane-context
        with:
          lane_json: ${{ inputs.lane_json }}
          goal: ${{ inputs.goal }}
          ref_mode: ${{ inputs.ref_mode }}
          publish: ${{ inputs.publish }}
          allow_failure_mode: ${{ inputs.allow_failure_mode }}

      - name: Render lane environment
        id: lane_env
        shell: bash
        env:
          LANE_ENV_JSON: ${{ steps.lane_ctx.outputs.lane_env_json }}
          CI: ${{ env.CI }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          out_file="tmp/xymon-refs/lane.env.sh"
          bash ci/run/ref/write-lane-env.sh \
            --output "${out_file}" \
            --lane-env-json "${LANE_ENV_JSON}"
          echo "path=${out_file}" >> "${GITHUB_OUTPUT}"

      - name: Decode lane metadata
        id: lane_meta
        shell: bash
        env:
          LANE_ENV_JSON: ${{ steps.lane_ctx.outputs.lane_env_json }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys


          def fail(msg: str) -> None:
              print(msg, file=sys.stderr)
              raise SystemExit(2)


          try:
              payload = json.loads(os.environ["LANE_ENV_JSON"])
          except Exception as exc:
              fail(f"LANE_ENV_JSON is invalid JSON: {exc}")

          if not isinstance(payload, dict):
              fail("LANE_ENV_JSON must decode to an object")

          required = [
              "RUNTIME_EXECUTION",
              "ALLOW_FAILURE_MODE",
              "LANE_ALLOW_FAILURE",
              "REF_OS",
              "RUNTIME",
              "RUNTIME_OUTCOME_CHANNEL",
          ]
          for key in required:
              if str(payload.get(key, "")).strip() == "":
                  fail(f"LANE_ENV_JSON missing key: {key}")

          continue_on_error = (
              "true"
              if payload["ALLOW_FAILURE_MODE"] != "off" and payload["LANE_ALLOW_FAILURE"] == "1"
              else "false"
          )

          lines = [
              f"runtime_execution={payload['RUNTIME_EXECUTION']}",
              f"continue_on_error={continue_on_error}",
              f"ref_os={payload['REF_OS']}",
              f"architecture={payload.get('ARCHITECTURE', '')}",
              f"os_version={payload.get('OS_VERSION', '')}",
              f"vm_memory={payload.get('VM_MEMORY', '')}",
              f"vm_cpu_count={payload.get('VM_CPU_COUNT', '')}",
              f"runtime={payload['RUNTIME']}",
              f"runtime_outcome_channel={payload['RUNTIME_OUTCOME_CHANNEL']}",
          ]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for line in lines:
                  fh.write(f"{line}\n")
          PY

      - name: Run lane orchestration (host/container)
        id: lane_run_host_container
        if: ${{ steps.lane_meta.outputs.runtime_execution != 'vm' }}
        continue-on-error: ${{ steps.lane_meta.outputs.continue_on_error == 'true' }}
        shell: bash
        env:
          LANE_ENV_FILE: ${{ steps.lane_env.outputs.path }}
        run: |
          set -euo pipefail
          bash ci/run/ref/run-runtime-lane.sh

      - name: Run lane orchestration on BSD VM
        id: lane_run_bsd_vm
        if: ${{ steps.lane_meta.outputs.runtime_execution == 'vm' }}
        continue-on-error: ${{ steps.lane_meta.outputs.continue_on_error == 'true' }}
        uses: ./.github/actions/run-bsd-vm-with-retry
        with:
          operating_system: ${{ steps.lane_meta.outputs.ref_os }}
          architecture: ${{ steps.lane_meta.outputs.architecture }}
          version: ${{ steps.lane_meta.outputs.os_version }}
          shell: bash
          memory: ${{ steps.lane_meta.outputs.vm_memory }}
          cpu_count: ${{ steps.lane_meta.outputs.vm_cpu_count }}
          sync_files: true
          shutdown_vm: true
          run_script: |
            set -euo pipefail
            export LANE_ENV_FILE="${{ steps.lane_env.outputs.path }}"
            bash ci/run/ref/run-runtime-lane.sh

      - name: Resolve lane run outcome
        id: lane_outcome
        if: ${{ always() }}
        shell: bash
        env:
          RUNTIME: ${{ steps.lane_meta.outputs.runtime }}
          OUTCOME_CHANNEL: ${{ steps.lane_meta.outputs.runtime_outcome_channel }}
          OUTCOME_HOST_CONTAINER: ${{ steps.lane_run_host_container.outcome }}
          OUTCOME_BSD_VM: ${{ steps.lane_run_bsd_vm.outcome }}
        run: |
          set -euo pipefail
          outcome=""
          case "${OUTCOME_CHANNEL}" in
            bsd_vm)
              outcome="${OUTCOME_BSD_VM}"
              ;;
            host_container)
              outcome="${OUTCOME_HOST_CONTAINER}"
              ;;
            *)
              echo "Unsupported outcome channel '${OUTCOME_CHANNEL}' for runtime '${RUNTIME}'" >&2
              exit 2
              ;;
          esac

          if [[ -z "${outcome}" ]]; then
            echo "Missing lane outcome for runtime '${RUNTIME}'" >&2
            exit 2
          fi

          echo "value=${outcome}" >> "${GITHUB_OUTPUT}"

      - name: Post lane (policy + artifacts)
        if: ${{ always() }}
        uses: ./.github/actions/ref-lane-post
        with:
          lane_env_json: ${{ steps.lane_ctx.outputs.lane_env_json }}
          lane_outcome: ${{ steps.lane_outcome.outputs.value }}
