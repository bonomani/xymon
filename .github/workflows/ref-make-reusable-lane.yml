name: Reference Lane - Reusable

on:
  workflow_call:
    inputs:
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string
      goal:
        description: Execution goal (verify|ref)
        required: true
        type: string
      ref_mode:
        description: Reference mode when goal=ref (generate|compare)
        required: true
        type: string
      publish:
        description: Publish channel (none|artifact)
        required: true
        type: string
      allow_failure_mode:
        description: Handling of lanes marked allow_failure (off|allow|expect_fail)
        required: true
        type: string

permissions:
  contents: read

jobs:
  lane:
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runner || fromJSON(inputs.lane_json).runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve lane context
        id: lane_ctx
        uses: ./.github/actions/ref-lane-context
        with:
          lane_json: ${{ inputs.lane_json }}
          goal: ${{ inputs.goal }}
          ref_mode: ${{ inputs.ref_mode }}
          publish: ${{ inputs.publish }}
          allow_failure_mode: ${{ inputs.allow_failure_mode }}

      - name: Render lane environment
        id: lane_env
        shell: bash
        env:
          LEGACY_APPLY_OWNERSHIP: ON
          XYMONUSER: _www
          XYMONGROUP: _www
          ENABLE_LDAP: ${{ steps.lane_ctx.outputs.enable_ldap }}
          ENABLE_SNMP: ${{ steps.lane_ctx.outputs.enable_snmp }}
          BUILD_TOOL: ${{ steps.lane_ctx.outputs.build_tool }}
          GOAL: ${{ steps.lane_ctx.outputs.goal }}
          REF_MODE: ${{ steps.lane_ctx.outputs.ref_mode }}
          PUBLISH: ${{ steps.lane_ctx.outputs.publish }}
          VARIANT: ${{ steps.lane_ctx.outputs.variant }}
          BASELINE_ROOT: ${{ steps.lane_ctx.outputs.baseline_root }}
          REF_OS: ${{ steps.lane_ctx.outputs.ref_os }}
          PLATFORM_OS: ${{ steps.lane_ctx.outputs.platform_os }}
          OS_VERSION: ${{ steps.lane_ctx.outputs.os_version }}
          ARTIFACT_FAMILY: ${{ steps.lane_ctx.outputs.artifact_family }}
          PLATFORM_ID: ${{ steps.lane_ctx.outputs.platform_id }}
          REF_STAGE_ROOT: ${{ steps.lane_ctx.outputs.ref_stage_root }}
          CMAKE_BIN: ${{ steps.lane_ctx.outputs.cmake_bin }}
          PREPARE_PROFILE: ${{ steps.lane_ctx.outputs.prepare_profile }}
          CHECKOUT_MODE: ${{ steps.lane_ctx.outputs.checkout_mode }}
          CONTAINER_IMAGE: ${{ steps.lane_ctx.outputs.container }}
          CONTAINER_OPTIONS: ${{ steps.lane_ctx.outputs.container_options }}
          RUNTIME: ${{ steps.lane_ctx.outputs.runtime }}
          CI: ${{ env.CI }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          out_file="tmp/xymon-refs/lane.env.sh"
          bash ci/run/ref/write-lane-env.sh --output "${out_file}"
          echo "path=${out_file}" >> "${GITHUB_OUTPUT}"

      - name: Run lane orchestration (host/container)
        id: lane_run_host_container
        if: ${{ steps.lane_ctx.outputs.runtime != 'bsd_vm' }}
        continue-on-error: ${{ steps.lane_ctx.outputs.allow_failure_mode != 'off' && steps.lane_ctx.outputs.lane_allow_failure == '1' }}
        shell: bash
        env:
          LANE_ENV_FILE: ${{ steps.lane_env.outputs.path }}
        run: |
          set -euo pipefail
          bash ci/run/ref/run-runtime-lane.sh

      - name: Run lane orchestration on BSD VM
        id: lane_run_bsd_vm
        if: ${{ steps.lane_ctx.outputs.runtime == 'bsd_vm' }}
        continue-on-error: ${{ steps.lane_ctx.outputs.allow_failure_mode != 'off' && steps.lane_ctx.outputs.lane_allow_failure == '1' }}
        uses: ./.github/actions/run-bsd-vm-with-retry
        with:
          operating_system: ${{ steps.lane_ctx.outputs.ref_os }}
          architecture: ${{ steps.lane_ctx.outputs.architecture }}
          version: ${{ steps.lane_ctx.outputs.os_version }}
          shell: bash
          memory: ${{ steps.lane_ctx.outputs.vm_memory }}
          cpu_count: ${{ steps.lane_ctx.outputs.vm_cpu_count }}
          sync_files: true
          shutdown_vm: true
          run_script: |
            set -euo pipefail
            export LANE_ENV_FILE="${{ steps.lane_env.outputs.path }}"
            bash ci/run/ref/run-runtime-lane.sh

      - name: Resolve lane run outcome
        id: lane_outcome
        if: ${{ always() }}
        shell: bash
        env:
          RUNTIME: ${{ steps.lane_ctx.outputs.runtime }}
          OUTCOME_HOST_CONTAINER: ${{ steps.lane_run_host_container.outcome }}
          OUTCOME_BSD_VM: ${{ steps.lane_run_bsd_vm.outcome }}
        run: |
          set -euo pipefail
          outcome_channel="$(python3 ci/run/ref/runtime-model-query.py --runtime "${RUNTIME}" --field outcome_channel)"
          outcome=""
          case "${outcome_channel}" in
            bsd_vm)
              outcome="${OUTCOME_BSD_VM}"
              ;;
            host_container)
              outcome="${OUTCOME_HOST_CONTAINER}"
              ;;
            *)
              echo "Unsupported outcome channel '${outcome_channel}' for runtime '${RUNTIME}'" >&2
              exit 2
              ;;
          esac

          if [[ -z "${outcome}" ]]; then
            echo "Missing lane outcome for runtime '${RUNTIME}'" >&2
            exit 2
          fi

          echo "value=${outcome}" >> "${GITHUB_OUTPUT}"

      - name: Post lane (policy + artifacts)
        if: ${{ always() }}
        uses: ./.github/actions/ref-lane-post
        with:
          allow_failure_mode: ${{ steps.lane_ctx.outputs.allow_failure_mode }}
          lane_allow_failure: ${{ steps.lane_ctx.outputs.lane_allow_failure }}
          lane_outcome: ${{ steps.lane_outcome.outputs.value }}
          goal: ${{ steps.lane_ctx.outputs.goal }}
          ref_mode: ${{ steps.lane_ctx.outputs.ref_mode }}
          dep_mode: ${{ steps.lane_ctx.outputs.dep_mode }}
          upload_artifacts: ${{ steps.lane_ctx.outputs.upload_artifacts }}
          build_tool: ${{ steps.lane_ctx.outputs.build_tool }}
          platform_id: ${{ steps.lane_ctx.outputs.platform_id }}
          variant: ${{ steps.lane_ctx.outputs.variant }}
          artifact_arch: ${{ steps.lane_ctx.outputs.artifact_arch }}
          lane_name: ${{ inputs.lane_name }}
          artifact_family: ${{ steps.lane_ctx.outputs.artifact_family }}
          ref_stage_root: ${{ steps.lane_ctx.outputs.ref_stage_root }}
          ref_os: ${{ steps.lane_ctx.outputs.ref_os }}
