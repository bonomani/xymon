name: Reference Generation - Trigger All

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to run the generation workflows on
        required: true
        default: cmake/bootstrap

permissions:
  actions: write
  contents: read

jobs:
  trigger-ref-generation:
    name: trigger / ref-make-select.yml
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch ref-make-select.yml (family=all)
        uses: actions/github-script@v7
        with:
          retries: 5
          # Keep caller/config errors non-retriable while retrying transient 5xx/network faults.
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ref-make-select.yml',
              ref: '${{ inputs.source_ref }}',
              inputs: {
                family: 'all'
              }
            });
            core.info('Dispatched ref-make-select.yml (family=all) on ref ${{ inputs.source_ref }}');
