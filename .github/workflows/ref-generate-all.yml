name: Reference Generation - Trigger All

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to run the generation workflows on
        required: true
        default: cmake/bootstrap

permissions:
  actions: write
  contents: read

jobs:
  build-workflow-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      workflow_count: ${{ steps.generate.outputs.workflow_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build workflow matrix
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflows < <(bash ci/run/ref/list-ref-make-workflows.sh)
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo "No ref-make workflows configured" >&2
            exit 1
          fi
          python3 - "${GITHUB_OUTPUT}" "${workflows[@]}" <<'PY'
          import json
          import sys

          output = sys.argv[1]
          workflows = sys.argv[2:]
          matrix = {"workflow": workflows}

          with open(output, "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              fh.write(f"workflow_count={len(workflows)}\n")
          PY

  trigger-ref-generation:
    needs: build-workflow-matrix
    if: ${{ needs.build-workflow-matrix.outputs.workflow_count != '0' }}
    name: trigger / ${{ matrix.workflow }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.build-workflow-matrix.outputs.matrix) }}
    steps:
      - name: Dispatch ${{ matrix.workflow }}
        uses: actions/github-script@v7
        with:
          retries: 5
          # Keep caller/config errors non-retriable while retrying transient 5xx/network faults.
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '${{ matrix.workflow }}',
              ref: '${{ inputs.source_ref }}'
            });
            core.info('Dispatched ${{ matrix.workflow }} on ref ${{ inputs.source_ref }}');
