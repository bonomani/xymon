name: Export platform catalog

on:
  workflow_dispatch:
    inputs:
      refresh_container_manifests:
        description: Refresh cached container manifest metadata from Docker Hub
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Export discovered platform catalog
        run: |
          args=()
          if [ "${{ inputs.refresh_container_manifests }}" = "true" ]; then
            args+=(--refresh-container-manifests)
          fi
          python .github/scripts/export-platform-catalog.py "${args[@]}"

      - name: Commit catalog artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/data/platform-releases-discovered.yml .github/data/platform-availability.yml .github/data/docker-availability-raw.yml
          if git diff --staged --quiet; then
            echo "No catalog updates"
            exit 0
          fi
          git commit -m 'Refresh discovered platform catalog'
          git push
