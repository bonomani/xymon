name: Reference Validation - Trigger All

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to run the validation workflows on
        required: true
        default: cmake/bootstrap
      build_tool:
        description: Build tool used for the validation candidate
        required: true
        type: choice
        default: cmake
        options:
          - cmake
          - make

permissions:
  actions: write
  contents: read

jobs:
  trigger-ref-validation:
    name: trigger / ref-validate-select.yml
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch ref-validate-select.yml (family=all, build_tool=${{ inputs.build_tool }})
        uses: actions/github-script@v7
        with:
          retries: 5
          # Keep caller/config errors non-retriable while retrying transient 5xx/network faults.
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ref-validate-select.yml',
              ref: '${{ inputs.source_ref }}',
              inputs: {
                family: 'all',
                build_tool: '${{ inputs.build_tool }}'
              }
            });
            core.info('Dispatched ref-validate-select.yml (family=all, build_tool=${{ inputs.build_tool }}) on ref ${{ inputs.source_ref }}');
