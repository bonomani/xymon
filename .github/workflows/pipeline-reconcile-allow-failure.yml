name: Pipeline - Reconcile Lane allow_failure

on:
  workflow_dispatch:
    inputs:
      selection_mode:
        description: How to choose the selector workflow run
        required: true
        default: explicit
        type: choice
        options:
          - explicit
          - latest
      run_selector:
        description: Selector run reference used when selection_mode=explicit (numeric ID, run URL, or "... #N")
        required: false
        type: string
      source_branch:
        description: Branch filter used when selection_mode=latest
        required: false
        type: string
      event_filter:
        description: Event filter used when selection_mode=latest
        required: true
        default: workflow_dispatch
        type: choice
        options:
          - workflow_dispatch
          - workflow_call
          - all
      allow_latest_apply:
        description: Override safety guard and allow apply_changes with selection_mode=latest
        required: true
        type: boolean
        default: false
      apply_changes:
        description: Apply and push allow_failure updates on this branch
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile allow_failure flags
        id: reconcile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SELECTION_MODE: ${{ inputs.selection_mode }}
          INPUT_RUN_SELECTOR: ${{ inputs.run_selector }}
          INPUT_SOURCE_BRANCH: ${{ inputs.source_branch }}
          INPUT_EVENT_FILTER: ${{ inputs.event_filter }}
          INPUT_ALLOW_LATEST_APPLY: ${{ inputs.allow_latest_apply }}
          INPUT_APPLY_CHANGES: ${{ inputs.apply_changes }}
        run: |
          set -euo pipefail

          markdown="${RUNNER_TEMP}/allow-failure-reconcile.md"
          report_json="${RUNNER_TEMP}/allow-failure-reconcile.json"
          args=(
            --repo "${GITHUB_REPOSITORY}"
            --workflow "pipeline-select-run-lanes.yml"
            --markdown-output "${markdown}"
            --json-output "${report_json}"
            --github-output "${GITHUB_OUTPUT}"
          )

          case "${INPUT_SELECTION_MODE}" in
            explicit)
              if [[ -z "${INPUT_RUN_SELECTOR}" ]]; then
                echo "selection_mode=explicit requires run_selector" >&2
                exit 1
              fi
              args+=(--run-selector "${INPUT_RUN_SELECTOR}")
              ;;
            latest)
              if [[ "${INPUT_APPLY_CHANGES}" == "true" && "${INPUT_ALLOW_LATEST_APPLY}" != "true" ]]; then
                echo "apply_changes=true with selection_mode=latest is blocked; provide an explicit run_selector or set allow_latest_apply=true" >&2
                exit 1
              fi

              if [[ -n "${INPUT_SOURCE_BRANCH}" ]]; then
                args+=(--branch "${INPUT_SOURCE_BRANCH}")
              fi

              if [[ -n "${INPUT_EVENT_FILTER}" ]]; then
                args+=(--event "${INPUT_EVENT_FILTER}")
              fi
              ;;
            *)
              echo "Unsupported selection_mode: ${INPUT_SELECTION_MODE}" >&2
              exit 1
              ;;
          esac

          if [[ "${INPUT_APPLY_CHANGES}" == "true" ]]; then
            args+=(--apply)
          fi

          python3 ci/run/ref/reconcile-allow-failure.py "${args[@]}"
          cat "${markdown}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload reconciliation artifact
        uses: actions/upload-artifact@v4
        with:
          name: allow_failure_reconcile_${{ steps.reconcile.outputs.run_id }}
          path: |
            ${{ runner.temp }}/allow-failure-reconcile.md
            ${{ runner.temp }}/allow-failure-reconcile.json

      - name: Commit and push lane updates
        if: ${{ inputs.apply_changes && steps.reconcile.outputs.proposed_change_count != '0' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci/run/ref/lanes/*.yml ci/run/ref/make-lanes/*.yml

          if git diff --cached --quiet; then
            echo "No staged lane changes after reconciliation."
            exit 0
          fi

          git commit -m "ci: reconcile allow_failure lanes from run ${{ steps.reconcile.outputs.run_id }}"
          git push
