name: Reference Generation - Reusable Linux Container Lane

on:
  workflow_call:
    inputs:
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-container:
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runs_on || 'ubuntu-22.04' }}
    continue-on-error: ${{ fromJSON(inputs.lane_json).allow_failure == true }}
    env:
      BUILD_TOOL: ${{ fromJSON(inputs.lane_json).build_tool || 'make' }}
      REF_OS: ${{ fromJSON(inputs.lane_json).ref_os || 'linux' }}
      PLATFORM_OS: ${{ fromJSON(inputs.lane_json).platform_os || fromJSON(inputs.lane_json).ref_os || 'linux' }}
      PLATFORM_ID: ${{ fromJSON(inputs.lane_json).platform_id || fromJSON(inputs.lane_json).ref_os || 'linux' }}
      VARIANT: ${{ fromJSON(inputs.lane_json).variant }}
      ARTIFACT_ARCH: ${{ fromJSON(inputs.lane_json).artifact_arch || 'amd64' }}
      PREPARE_PROFILE: ${{ fromJSON(inputs.lane_json).prepare_profile || 'default' }}
      UPLOAD_ARTIFACTS: ${{ fromJSON(inputs.lane_json).upload_artifacts == false && '0' || '1' }}
      REF_STAGE_ROOT: ${{ github.workspace }}/tmp/xymon-refs
      CONTAINER_IMAGE: ${{ fromJSON(inputs.lane_json).container }}
      CONTAINER_OPTIONS: ${{ fromJSON(inputs.lane_json).container_options || '--platform linux/amd64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bootstrap install + refs in Linux container
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/run-host-managed-linux-container.sh \
            bash ci/run/ref/bootstrap-make-refs.sh

      - name: Upload dependency report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deps_${{ env.BUILD_TOOL }}_${{ env.PLATFORM_ID }}_${{ env.VARIANT }}__${{ env.ARTIFACT_ARCH }}__${{ inputs.lane_name }}
          path: ${{ env.REF_STAGE_ROOT }}/${{ env.BUILD_TOOL }}.${{ env.REF_OS }}.${{ env.VARIANT }}/meta/deps-report.json
          if-no-files-found: warn

      - name: Upload legacy references
        if: ${{ env.UPLOAD_ARTIFACTS == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: ref_${{ env.BUILD_TOOL }}_${{ env.REF_OS }}-${{ env.VARIANT }}
          path: |
            ${{ env.REF_STAGE_ROOT }}/${{ env.BUILD_TOOL }}.${{ env.REF_OS }}.${{ env.VARIANT }}/**
          if-no-files-found: error

      - name: Skip artifacts when upload is disabled
        if: ${{ env.UPLOAD_ARTIFACTS != '1' }}
        shell: bash
        run: |
          echo "Skipping actions/upload-artifact for this lane."
