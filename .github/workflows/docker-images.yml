name: Build Docker Images

on:
  workflow_dispatch:
    inputs:
      target:
        description: Service name from ci/deps/docker-matrix.yaml, or all (comma-separated accepted).
        required: true
        type: string
        default: all
      image_tag:
        description: Image tag to publish/use. Empty = sha-<short>.
        required: false
        type: string
        default: ""
      push:
        description: Push images to GHCR.
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"
  workflow_call:
    inputs:
      target:
        description: Service name from ci/deps/docker-matrix.yaml, or all (comma-separated accepted).
        required: false
        type: string
        default: all
      image_tag:
        description: Image tag to publish/use. Empty = sha-<short>.
        required: false
        type: string
        default: ""
      push:
        description: Push images to GHCR (no|yes).
        required: false
        type: string
        default: "no"

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      matrix_count: ${{ steps.prepare.outputs.matrix_count }}
      image_tag: ${{ steps.prepare.outputs.image_tag }}
      push_enabled: ${{ steps.prepare.outputs.push_enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install workflow parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml

      - name: Resolve docker build matrix
        id: prepare
        shell: bash
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_PUSH: ${{ inputs.push }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 ci/run/docker/resolve-matrix.py \
            --matrix-file ci/deps/docker-matrix.yaml \
            --target "${INPUT_TARGET}" \
            --image-tag "${INPUT_IMAGE_TAG}" \
            --push "${INPUT_PUSH}" \
            --repo-owner "${REPOSITORY_OWNER}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Summary
        shell: bash
        run: |
          echo "Image tag: ${{ steps.prepare.outputs.image_tag }}"
          echo "Push enabled: ${{ steps.prepare.outputs.push_enabled }}"
          echo "Images selected: ${{ steps.prepare.outputs.matrix_count }}"

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix_count != '0' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ needs.prepare.outputs.push_enabled == '1' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and optionally push) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ needs.prepare.outputs.push_enabled == '1' }}
          tags: |
            ${{ matrix.image }}:${{ needs.prepare.outputs.image_tag }}
