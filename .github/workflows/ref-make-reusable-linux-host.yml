name: Reference Lane - Reusable Linux Host

on:
  workflow_call:
    inputs:
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string
      goal:
        description: Execution goal (verify|ref)
        required: true
        type: string
      ref_mode:
        description: Reference mode when goal=ref (generate|compare)
        required: true
        type: string
      publish:
        description: Publish channel (none|artifact)
        required: true
        type: string
      allow_failure_mode:
        description: Handling of lanes marked allow_failure (off|allow|expect_fail)
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-host:
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runs_on }}
    env:
      GOAL: ${{ inputs.goal }}
      REF_MODE: ${{ inputs.ref_mode }}
      PUBLISH: ${{ inputs.publish }}
      DEP_MODE: ${{ inputs.goal == 'ref' && inputs.ref_mode == 'compare' && 'compare' || 'generate' }}
      BUILD_TOOL: ${{ fromJSON(inputs.lane_json).build_tool }}
      LEGACY_APPLY_OWNERSHIP: ON
      REF_OS: ${{ fromJSON(inputs.lane_json).ref_os }}
      PLATFORM_OS: ${{ fromJSON(inputs.lane_json).platform_os }}
      PLATFORM_ID: ${{ fromJSON(inputs.lane_json).platform_id }}
      VARIANT: ${{ fromJSON(inputs.lane_json).variant }}
      ARTIFACT_ARCH: ${{ fromJSON(inputs.lane_json).artifact_arch }}
      CMAKE_BIN: ${{ fromJSON(inputs.lane_json).cmake_bin }}
      OS_VERSION: ${{ fromJSON(inputs.lane_json).os_version }}
      BASELINE_ROOT: ${{ fromJSON(inputs.lane_json).baseline_root }}
      ARTIFACT_FAMILY: ${{ fromJSON(inputs.lane_json).artifact_family }}
      REF_STAGE_ROOT: ${{ github.workspace }}/tmp/xymon-refs
      UPLOAD_ARTIFACTS: ${{ inputs.publish == 'artifact' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run lane orchestration on Linux host
        id: lane_run
        continue-on-error: ${{ inputs.allow_failure_mode != 'off' && fromJSON(inputs.lane_json).allow_failure == true }}
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/run-ref-lane.sh \
            --build "${BUILD_TOOL}" \
            --goal "${GOAL}" \
            --ref-mode "${REF_MODE}" \
            --publish "${PUBLISH}" \
            --variant "${VARIANT}" \
            --baseline-root "${BASELINE_ROOT}" \
            --ref-os "${REF_OS}" \
            --platform-os "${PLATFORM_OS}" \
            --version "${OS_VERSION}" \
            --artifact-family "${ARTIFACT_FAMILY}" \
              --platform-id "${PLATFORM_ID}"

      - name: Post lane (policy + artifacts)
        if: ${{ always() }}
        uses: ./.github/actions/ref-lane-post
        with:
          allow_failure_mode: ${{ inputs.allow_failure_mode }}
          lane_allow_failure: ${{ fromJSON(inputs.lane_json).allow_failure == true && '1' || '0' }}
          lane_outcome: ${{ steps.lane_run.outcome }}
          dep_mode: ${{ env.DEP_MODE }}
          goal: ${{ env.GOAL }}
          ref_mode: ${{ env.REF_MODE }}
          upload_artifacts: ${{ env.UPLOAD_ARTIFACTS }}
          build_tool: ${{ env.BUILD_TOOL }}
          platform_id: ${{ env.PLATFORM_ID }}
          variant: ${{ env.VARIANT }}
          artifact_arch: ${{ env.ARTIFACT_ARCH }}
          lane_name: ${{ inputs.lane_name }}
          artifact_family: ${{ env.ARTIFACT_FAMILY }}
          ref_stage_root: ${{ env.REF_STAGE_ROOT }}
          ref_os: ${{ env.REF_OS }}
