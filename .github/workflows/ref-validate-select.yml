name: Reference Validation - Select Family (Pass 1)

on:
  workflow_dispatch:
    inputs:
      family:
        description: Select which reference-validation family to run
        required: true
        type: choice
        default: all
        options:
          - all
          - alpine
          - archlinux
          - centos7
          - debian
          - freebsd
          - macos
          - netbsd
          - openbsd
          - opensuse
          - rpm
          - ubuntu
  workflow_call:
    inputs:
      family:
        description: Reference-validation family key (or all)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix_linux: ${{ steps.generate.outputs.matrix_linux }}
      matrix_host_vm: ${{ steps.generate.outputs.matrix_host_vm }}
      lane_count_total: ${{ steps.generate.outputs.lane_count_total }}
      lane_count_linux: ${{ steps.generate.outputs.lane_count_linux }}
      lane_count_host_vm: ${{ steps.generate.outputs.lane_count_host_vm }}
      selected_families: ${{ steps.generate.outputs.selected_families }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build selected lanes matrix
        id: generate
        shell: bash
        env:
          SELECTED_FAMILY: ${{ inputs.family }}
        run: |
          set -euo pipefail
          python3 ci/run/ref/build-ref-validate-matrix.py \
            --selected-family "${SELECTED_FAMILY}" \
            --manifest "ci/run/ref/ref-validate-families.yml" \
            --selector-workflow ".github/workflows/ref-validate-select.yml" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Matrix summary
        shell: bash
        run: |
          echo "Selected families: ${{ steps.generate.outputs.selected_families }}"
          echo "Lane count (total): ${{ steps.generate.outputs.lane_count_total }}"
          echo "Lane count (linux): ${{ steps.generate.outputs.lane_count_linux }}"
          echo "Lane count (host_vm): ${{ steps.generate.outputs.lane_count_host_vm }}"

  ref-validate-linux:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_linux != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_linux) }}
    name: ${{ matrix.lane.name }}
    uses: ./.github/workflows/ref-validate-reusable-linux.yml
    secrets: inherit
    with:
      family: ${{ matrix.family }}
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}

  ref-validate-host-vm:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_host_vm != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_host_vm) }}
    name: ${{ matrix.lane.name }}
    uses: ./.github/workflows/ref-validate-reusable-host-vm.yml
    secrets: inherit
    with:
      family: ${{ matrix.family }}
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
