name: Reference Validation - Select Family (Pass 1)

on:
  workflow_dispatch:
    inputs:
      family:
        description: Select which reference-validation family to run
        required: true
        type: choice
        default: all
        options:
          - all
          - alpine
          - archlinux
          - centos7
          - debian
          - freebsd
          - macos
          - netbsd
          - openbsd
          - opensuse
          - rpm
          - ubuntu

permissions:
  contents: read

jobs:
  build-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix_linux: ${{ steps.generate.outputs.matrix_linux }}
      matrix_bsd: ${{ steps.generate.outputs.matrix_bsd }}
      matrix_macos: ${{ steps.generate.outputs.matrix_macos }}
      lane_count_total: ${{ steps.generate.outputs.lane_count_total }}
      lane_count_linux: ${{ steps.generate.outputs.lane_count_linux }}
      lane_count_bsd: ${{ steps.generate.outputs.lane_count_bsd }}
      lane_count_macos: ${{ steps.generate.outputs.lane_count_macos }}
      selected_families: ${{ steps.generate.outputs.selected_families }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build selected lanes matrix
        id: generate
        shell: bash
        env:
          SELECTED_FAMILY: ${{ inputs.family }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          selected_family = os.environ["SELECTED_FAMILY"]
          workflows_dir = Path(".github/workflows")

          workflow_map = [
              ("alpine", "linux_container", "ref-valid-alpine.yml"),
              ("archlinux", "linux_container", "ref-valid-archlinux.yml"),
              ("centos7", "linux_container", "ref-valid-centos7.yml"),
              ("debian", "linux_container", "ref-valid-debian.yml"),
              ("freebsd", "bsd_vm", "ref-valid-freebsd.yml"),
              ("macos", "macos_host", "ref-valid-macos.yml"),
              ("netbsd", "bsd_vm", "ref-valid-netbsd.yml"),
              ("openbsd", "bsd_vm", "ref-valid-openbsd.yml"),
              ("opensuse", "linux_container", "ref-valid-opensuse.yml"),
              ("rpm", "linux_container", "ref-valid-rpm.yml"),
              ("ubuntu", "linux_container", "ref-valid-ubuntu.yml"),
          ]
          lookup = {family: (runtime, filename) for family, runtime, filename in workflow_map}

          if selected_family == "all":
              selected = list(workflow_map)
          else:
              if selected_family not in lookup:
                  raise SystemExit(f"Unsupported family input: {selected_family}")
              runtime, filename = lookup[selected_family]
              selected = [(selected_family, runtime, filename)]

          linux_include = []
          bsd_include = []
          macos_include = []
          selected_families = []

          for family, runtime, filename in selected:
              wf_path = workflows_dir / filename
              if not wf_path.exists():
                  raise SystemExit(f"Missing workflow file: {wf_path}")

              data = yaml.safe_load(wf_path.read_text()) or {}
              jobs = data.get("jobs", {})
              if not isinstance(jobs, dict) or not jobs:
                  raise SystemExit(f"Workflow has no jobs mapping: {wf_path}")

              lane_job = None
              for job in jobs.values():
                  if isinstance(job, dict) and isinstance(job.get("strategy"), dict):
                      lane_job = job
                      break
              if lane_job is None:
                  raise SystemExit(f"Workflow has no matrix strategy job: {wf_path}")

              lanes = lane_job.get("strategy", {}).get("matrix", {}).get("include", [])
              if not isinstance(lanes, list):
                  raise SystemExit(f"Workflow matrix.include is not a list: {wf_path}")

              selected_families.append(family)
              for lane in lanes:
                  if not isinstance(lane, dict):
                      continue
                  lane_obj = dict(lane)
                  lane_obj.setdefault("allow_failure", False)

                  if runtime == "linux_container":
                      lane_obj["ref_os"] = "linux"
                      lane_obj["baseline_root"] = "make_linux"
                      lane_obj["artifact_family"] = "linux"
                      lane_obj["prepare_profile"] = "default"
                      lane_obj["checkout_mode"] = "action"
                      lane_obj["needs_bash_awk"] = False
                      lane_obj["upload_artifacts"] = True
                      container_image = str(lane_obj.get("container", "")).lower()
                      container_options = str(lane_obj.get("container_options", "")).lower()
                      is_alpine_arm_lane = (
                          container_image.startswith("alpine:")
                          and "linux/arm64" in container_options
                      )
                      if family == "rpm":
                          lane_obj["prepare_profile"] = "rpm"
                      if family == "centos7":
                          lane_obj["prepare_profile"] = "centos7"
                          lane_obj["checkout_mode"] = "git"
                          lane_obj["upload_artifacts"] = False
                      if is_alpine_arm_lane:
                          lane_obj["checkout_mode"] = "git"
                          lane_obj["upload_artifacts"] = False
                      if family == "opensuse":
                          lane_obj["needs_bash_awk"] = True

                  elif runtime == "bsd_vm":
                      lane_obj["ref_os"] = family
                      lane_obj["artifact_family"] = family
                      lane_obj["baseline_root"] = f"make_{family}"
                      lane_obj["upload_artifacts"] = True
                      if family == "freebsd":
                          lane_obj["os_version"] = lane_obj.get("freebsd_version")
                          lane_obj.setdefault("architecture", "x86-64")
                      elif family == "netbsd":
                          lane_obj["os_version"] = lane_obj.get("netbsd_version")
                          lane_obj.setdefault("architecture", "x86-64")
                      elif family == "openbsd":
                          lane_obj["os_version"] = lane_obj.get("openbsd_version")
                          lane_obj.setdefault("architecture", "x86-64")
                      else:
                          raise SystemExit(f"Unexpected BSD family: {family}")

                  elif runtime == "macos_host":
                      lane_obj["ref_os"] = "macos"
                      lane_obj["artifact_family"] = "macos"
                      lane_obj["baseline_root"] = "make_freebsd"
                      lane_obj["os_version"] = lane_obj.get("macos_version")
                      lane_obj.setdefault("runner", "macos-latest")
                      lane_obj["upload_artifacts"] = True

                  else:
                      raise SystemExit(f"Unknown runtime adapter: {runtime}")

                  item = {
                      "family": family,
                      "lane": lane_obj,
                  }
                  if runtime == "linux_container":
                      linux_include.append(item)
                  elif runtime == "bsd_vm":
                      bsd_include.append(item)
                  elif runtime == "macos_host":
                      macos_include.append(item)
                  else:
                      raise SystemExit(f"Unknown runtime adapter: {runtime}")

          matrix_linux = {"include": linux_include}
          matrix_bsd = {"include": bsd_include}
          matrix_macos = {"include": macos_include}
          lane_count_linux = len(linux_include)
          lane_count_bsd = len(bsd_include)
          lane_count_macos = len(macos_include)
          lane_count_total = lane_count_linux + lane_count_bsd + lane_count_macos
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"matrix_linux={json.dumps(matrix_linux)}\n")
              fh.write(f"matrix_bsd={json.dumps(matrix_bsd)}\n")
              fh.write(f"matrix_macos={json.dumps(matrix_macos)}\n")
              fh.write(f"lane_count_total={lane_count_total}\n")
              fh.write(f"lane_count_linux={lane_count_linux}\n")
              fh.write(f"lane_count_bsd={lane_count_bsd}\n")
              fh.write(f"lane_count_macos={lane_count_macos}\n")
              fh.write(f"selected_families={','.join(selected_families)}\n")
          PY

      - name: Matrix summary
        shell: bash
        run: |
          echo "Selected families: ${{ steps.generate.outputs.selected_families }}"
          echo "Lane count (total): ${{ steps.generate.outputs.lane_count_total }}"
          echo "Lane count (linux): ${{ steps.generate.outputs.lane_count_linux }}"
          echo "Lane count (bsd): ${{ steps.generate.outputs.lane_count_bsd }}"
          echo "Lane count (macos): ${{ steps.generate.outputs.lane_count_macos }}"

  ref-validate-linux:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_linux != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_linux) }}
    name: ${{ matrix.lane.name }}
    uses: ./.github/workflows/ref-validate-reusable-linux.yml
    secrets: inherit
    with:
      family: ${{ matrix.family }}
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}

  ref-validate-bsd:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_bsd != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_bsd) }}
    name: ${{ matrix.lane.name }}
    uses: ./.github/workflows/ref-validate-reusable-bsd.yml
    secrets: inherit
    with:
      family: ${{ matrix.family }}
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}

  ref-validate-macos:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_macos != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_macos) }}
    name: ${{ matrix.lane.name }}
    uses: ./.github/workflows/ref-validate-reusable-macos.yml
    secrets: inherit
    with:
      family: ${{ matrix.family }}
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
