name: Pipeline - Run Lane (Reusable)

on:
  workflow_call:
    inputs:
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string
      verify_depth:
        description: Verification depth (configure|build|install)
        required: true
        type: string
      goal:
        description: Execution goal (verify|ref)
        required: true
        type: string
      ref_mode:
        description: Reference handling mode (off|generate|compare)
        required: true
        type: string
      publish:
        description: Publish channel (none|artifact)
        required: true
        type: string
      allow_failure_mode:
        description: Handling of lanes marked allow_failure (off|allow|expect_fail)
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lane:
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve lane context
        id: lane_ctx
        uses: ./.github/actions/ref-lane-context
        with:
          lane_json: ${{ inputs.lane_json }}
          verify_depth: ${{ inputs.verify_depth }}
          goal: ${{ inputs.goal }}
          ref_mode: ${{ inputs.ref_mode }}
          publish: ${{ inputs.publish }}
          allow_failure_mode: ${{ inputs.allow_failure_mode }}

      - name: Render lane environment
        id: lane_env
        uses: ./.github/actions/render-lane-env
        with:
          lane_env_json: ${{ steps.lane_ctx.outputs.lane_env_json }}
          output: tmp/xymon-refs/lane.env.sh

      - name: Set up QEMU for emulated container lanes
        if: ${{ steps.lane_ctx.outputs.runtime_execution == 'container' && (contains(inputs.lane_json, 'linux/arm/v7') || contains(inputs.lane_json, 'linux/ppc64le') || contains(inputs.lane_json, 'linux/riscv64') || contains(inputs.lane_json, 'linux/s390x')) }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,ppc64le,riscv64,s390x

      - name: Run lane orchestration (host/container)
        id: lane_run_host_container
        if: ${{ steps.lane_ctx.outputs.runtime_execution != 'vm' }}
        continue-on-error: ${{ steps.lane_ctx.outputs.continue_on_error == 'true' }}
        shell: bash
        env:
          LANE_ENV_FILE: ${{ steps.lane_env.outputs.path }}
        run: |
          set -euo pipefail
          bash ci/run/ref/run-runtime-lane.sh

      - name: Run lane orchestration on BSD VM
        id: lane_run_bsd_vm
        if: ${{ steps.lane_ctx.outputs.runtime_execution == 'vm' }}
        continue-on-error: ${{ steps.lane_ctx.outputs.continue_on_error == 'true' }}
        uses: ./.github/actions/run-bsd-vm-with-retry
        with:
          operating_system: ${{ steps.lane_ctx.outputs.ref_os }}
          architecture: ${{ steps.lane_ctx.outputs.architecture }}
          version: ${{ steps.lane_ctx.outputs.os_version }}
          shell: bash
          memory: ${{ steps.lane_ctx.outputs.vm_memory }}
          cpu_count: ${{ steps.lane_ctx.outputs.vm_cpu_count }}
          sync_files: true
          shutdown_vm: true
          run_script: |
            set -euo pipefail
            export LANE_ENV_FILE="${{ steps.lane_env.outputs.path }}"
            bash ci/run/ref/run-runtime-lane.sh

      - name: Resolve lane run outcome
        id: lane_outcome
        if: ${{ always() }}
        shell: bash
        env:
          RUNTIME: ${{ steps.lane_ctx.outputs.runtime }}
          OUTCOME_HOST_CONTAINER: ${{ steps.lane_run_host_container.outcome }}
          OUTCOME_BSD_VM: ${{ steps.lane_run_bsd_vm.outcome }}
        run: |
          set -euo pipefail
          python3 ci/run/ref/runtime_resolution.py outcome \
            --runtime "${RUNTIME}" \
            --outcome-host-container "${OUTCOME_HOST_CONTAINER}" \
            --outcome-bsd-vm "${OUTCOME_BSD_VM}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Post lane (policy + artifacts)
        if: ${{ always() }}
        uses: ./.github/actions/ref-lane-post
        with:
          lane_post_json: ${{ steps.lane_ctx.outputs.lane_post_json }}
          lane_outcome: ${{ steps.lane_outcome.outputs.value }}
