name: probe portability flake
on:
  push:
    branches: [test/openbsd-portability-flake]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        version: ["7.8", "7.9"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: openbsd
          version: ${{ matrix.version }}
          sync_files: "false"
      - shell: bash
        run: |
          cat > "$RUNNER_TEMP/probe.sh" <<'EOF'
          set -u
          uname -sr
          sudo pkg_add -I bash >/dev/null 2>&1 || pkg_add -I bash >/dev/null 2>&1 || true
          command -v bash || { echo "no bash"; exit 1; }
          cd "$GITHUB_WORKSPACE" 2>/dev/null || cd ~/work/*/* 2>/dev/null || pwd
          echo "== real check, 100 runs"
          fails=0
          for i in $(seq 1 100); do
            if ! bash tests/buildsystem/test-suite-portability.sh > /tmp/pc.out 2>&1; then
              fails=$((fails+1)); [ -f /tmp/pc.first ] || cp /tmp/pc.out /tmp/pc.first
            fi
          done
          echo "real check: $fails false reports of 100"
          [ -f /tmp/pc.first ] && { echo "-- first false report:"; tail -6 /tmp/pc.first; }
          echo "== exact pipe, with stage statuses"
          for f in tests/server/xymond-noflap-list.sh tests/server/xymond-holdtime-bridge.sh; do bash .github/flake-pipe.sh "$f" 3000; done
          EOF
          cpa.sh "$RUNNER_TEMP/probe.sh" --sync-files runner-to-vm
