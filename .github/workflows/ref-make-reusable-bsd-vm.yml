name: Reference Generation - Reusable BSD VM Lane

on:
  workflow_call:
    inputs:
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string

permissions:
  contents: read

jobs:
  make-bsd-vm:
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runs_on || 'ubuntu-22.04' }}
    env:
      BUILD_TOOL: ${{ fromJSON(inputs.lane_json).build_tool || 'make' }}
      REF_OS: ${{ fromJSON(inputs.lane_json).ref_os }}
      PLATFORM_OS: ${{ fromJSON(inputs.lane_json).platform_os || fromJSON(inputs.lane_json).ref_os }}
      PLATFORM_ID: ${{ fromJSON(inputs.lane_json).platform_id || fromJSON(inputs.lane_json).ref_os || 'bsd' }}
      OS_VERSION: ${{ fromJSON(inputs.lane_json).os_version }}
      VARIANT: ${{ fromJSON(inputs.lane_json).variant }}
      ARCHITECTURE: ${{ fromJSON(inputs.lane_json).architecture || 'x86-64' }}
      VM_MEMORY: ${{ fromJSON(inputs.lane_json).vm_memory || '1024M' }}
      VM_CPU_COUNT: ${{ fromJSON(inputs.lane_json).vm_cpu_count || 2 }}
      REF_STAGE_ROOT: ${{ github.workspace }}/tmp/xymon-refs
      UPLOAD_ARTIFACTS: ${{ fromJSON(inputs.lane_json).upload_artifacts == false && '0' || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap install + refs on BSD VM
        uses: ./.github/actions/run-bsd-vm-with-retry
        with:
          operating_system: ${{ env.REF_OS }}
          architecture: ${{ env.ARCHITECTURE }}
          version: ${{ env.OS_VERSION }}
          shell: bash
          memory: ${{ env.VM_MEMORY }}
          cpu_count: ${{ env.VM_CPU_COUNT }}
          sync_files: true
          shutdown_vm: true
          run_script: |
            set -euo pipefail
            export BUILD_TOOL="${{ env.BUILD_TOOL }}"
            export REF_OS="${{ env.REF_OS }}"
            export PLATFORM_OS="${{ env.PLATFORM_OS }}"
            export OS_VERSION="${{ env.OS_VERSION }}"
            export VARIANT="${{ env.VARIANT }}"
            export REF_STAGE_ROOT="${{ env.REF_STAGE_ROOT }}"
            bash ci/run/ref/bootstrap-make-refs.sh

      - name: Upload dependency report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deps_${{ env.BUILD_TOOL }}_${{ env.PLATFORM_ID }}_${{ env.VARIANT }}
          path: ${{ env.REF_STAGE_ROOT }}/${{ env.BUILD_TOOL }}.${{ env.REF_OS }}.${{ env.VARIANT }}/meta/deps-report.json
          if-no-files-found: warn

      - name: Upload legacy references
        if: ${{ env.UPLOAD_ARTIFACTS == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: ref_${{ env.BUILD_TOOL }}_${{ env.REF_OS }}-${{ env.VARIANT }}
          path: |
            ${{ env.REF_STAGE_ROOT }}/${{ env.BUILD_TOOL }}.${{ env.REF_OS }}.${{ env.VARIANT }}/**
          if-no-files-found: error

      - name: Skip artifacts when upload is disabled
        if: ${{ env.UPLOAD_ARTIFACTS != '1' }}
        shell: bash
        run: |
          echo "Skipping actions/upload-artifact for this lane."
