name: Reference Lane - Reusable BSD VM

on:
  workflow_call:
    inputs:
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string
      goal:
        description: Execution goal (verify|ref)
        required: true
        type: string
      ref_mode:
        description: Reference mode when goal=ref (generate|compare)
        required: true
        type: string
      publish:
        description: Publish channel (none|artifact)
        required: true
        type: string
      dep_mode:
        description: Dependency report mode (generate|compare), resolved upstream.
        required: true
        type: string
      allow_failure_mode:
        description: Handling of lanes marked allow_failure (off|allow|expect_fail)
        required: true
        type: string

permissions:
  contents: read

jobs:
  bsd-vm:
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve lane context
        id: lane_ctx
        uses: ./.github/actions/ref-lane-context
        with:
          lane_json: ${{ inputs.lane_json }}
          goal: ${{ inputs.goal }}
          ref_mode: ${{ inputs.ref_mode }}
          publish: ${{ inputs.publish }}
          allow_failure_mode: ${{ inputs.allow_failure_mode }}
          dep_mode: ${{ inputs.dep_mode }}

      - name: Run lane orchestration on BSD VM
        id: lane_run
        continue-on-error: ${{ steps.lane_ctx.outputs.allow_failure_mode != 'off' && steps.lane_ctx.outputs.lane_allow_failure == '1' }}
        uses: ./.github/actions/run-bsd-vm-with-retry
        with:
          operating_system: ${{ steps.lane_ctx.outputs.ref_os }}
          architecture: ${{ steps.lane_ctx.outputs.architecture }}
          version: ${{ steps.lane_ctx.outputs.os_version }}
          shell: bash
          memory: ${{ steps.lane_ctx.outputs.dep_mode == 'compare' && '2048M' || steps.lane_ctx.outputs.vm_memory }}
          cpu_count: ${{ steps.lane_ctx.outputs.vm_cpu_count }}
          sync_files: true
          shutdown_vm: true
          run_script: |
            set -euo pipefail
            export LEGACY_APPLY_OWNERSHIP=ON
            export ENABLE_LDAP="${{ steps.lane_ctx.outputs.enable_ldap }}"
            export ENABLE_SNMP="${{ steps.lane_ctx.outputs.enable_snmp }}"
            export BUILD_TOOL="${{ steps.lane_ctx.outputs.build_tool }}"
            export GOAL="${{ steps.lane_ctx.outputs.goal }}"
            export REF_MODE="${{ steps.lane_ctx.outputs.ref_mode }}"
            export PUBLISH="${{ steps.lane_ctx.outputs.publish }}"
            export DEP_MODE="${{ steps.lane_ctx.outputs.dep_mode }}"
            export REF_OS="${{ steps.lane_ctx.outputs.ref_os }}"
            export PLATFORM_OS="${{ steps.lane_ctx.outputs.platform_os }}"
            export OS_VERSION="${{ steps.lane_ctx.outputs.os_version }}"
            export VARIANT="${{ steps.lane_ctx.outputs.variant }}"
            export BASELINE_ROOT="${{ steps.lane_ctx.outputs.baseline_root }}"
            export ARTIFACT_FAMILY="${{ steps.lane_ctx.outputs.artifact_family }}"
            export PLATFORM_ID="${{ steps.lane_ctx.outputs.platform_id }}"
            export REF_STAGE_ROOT="${{ steps.lane_ctx.outputs.ref_stage_root }}"
            bash ci/run/ref/run-ref-lane.sh \
              --build "${BUILD_TOOL}" \
              --goal "${GOAL}" \
              --ref-mode "${REF_MODE}" \
              --publish "${PUBLISH}" \
              --dep-mode "${DEP_MODE}" \
              --ref-os "${REF_OS}" \
              --platform-os "${PLATFORM_OS}" \
              --version "${OS_VERSION}" \
              --variant "${VARIANT}" \
              --baseline-root "${BASELINE_ROOT}" \
              --artifact-family "${ARTIFACT_FAMILY}" \
              --platform-id "${PLATFORM_ID}"

      - name: Post lane (policy + artifacts)
        if: ${{ always() }}
        uses: ./.github/actions/ref-lane-post
        with:
          allow_failure_mode: ${{ steps.lane_ctx.outputs.allow_failure_mode }}
          lane_allow_failure: ${{ steps.lane_ctx.outputs.lane_allow_failure }}
          lane_outcome: ${{ steps.lane_run.outcome }}
          dep_mode: ${{ steps.lane_ctx.outputs.dep_mode }}
          goal: ${{ steps.lane_ctx.outputs.goal }}
          ref_mode: ${{ steps.lane_ctx.outputs.ref_mode }}
          upload_artifacts: ${{ steps.lane_ctx.outputs.upload_artifacts }}
          build_tool: ${{ steps.lane_ctx.outputs.build_tool }}
          platform_id: ${{ steps.lane_ctx.outputs.platform_id }}
          variant: ${{ steps.lane_ctx.outputs.variant }}
          artifact_arch: ${{ steps.lane_ctx.outputs.artifact_arch }}
          lane_name: ${{ inputs.lane_name }}
          artifact_family: ${{ steps.lane_ctx.outputs.artifact_family }}
          ref_stage_root: ${{ steps.lane_ctx.outputs.ref_stage_root }}
          ref_os: ${{ steps.lane_ctx.outputs.ref_os }}
          ref_valid_if_no_files_found: warn
