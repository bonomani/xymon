name: Reference Lane - Reusable BSD VM

on:
  workflow_call:
    inputs:
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string
      mode:
        description: Lane mode (generate or compare)
        required: false
        default: generate
        type: string
      upload_artifacts:
        description: Override artifact upload behavior (1 or 0)
        required: false
        default: ''
        type: string
      run_compare:
        description: Run compare policy checks (1 or 0)
        required: false
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  bsd-vm:
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runs_on || 'ubuntu-22.04' }}
    continue-on-error: ${{ inputs.mode == 'compare' && fromJSON(inputs.lane_json).allow_failure == true }}
    env:
      MODE: ${{ inputs.mode }}
      BUILD_TOOL: ${{ fromJSON(inputs.lane_json).build_tool || (inputs.mode == 'compare' && 'cmake' || 'make') }}
      VARIANT: ${{ fromJSON(inputs.lane_json).variant }}
      ENABLE_LDAP: ${{ fromJSON(inputs.lane_json).variant == 'server' && 'ON' || 'OFF' }}
      ENABLE_SNMP: ${{ fromJSON(inputs.lane_json).variant == 'server' && 'ON' || 'OFF' }}
      LEGACY_APPLY_OWNERSHIP: ON
      REF_OS: ${{ fromJSON(inputs.lane_json).ref_os }}
      PLATFORM_OS: ${{ fromJSON(inputs.lane_json).platform_os || fromJSON(inputs.lane_json).ref_os }}
      PLATFORM_ID: ${{ fromJSON(inputs.lane_json).platform_id || fromJSON(inputs.lane_json).ref_os || 'bsd' }}
      ARTIFACT_ARCH: ${{ fromJSON(inputs.lane_json).artifact_arch || 'amd64' }}
      OS_VERSION: ${{ fromJSON(inputs.lane_json).os_version }}
      ARCHITECTURE: ${{ fromJSON(inputs.lane_json).architecture || 'x86-64' }}
      VM_MEMORY: ${{ fromJSON(inputs.lane_json).vm_memory || '1024M' }}
      VM_CPU_COUNT: ${{ fromJSON(inputs.lane_json).vm_cpu_count || 2 }}
      BASELINE_ROOT: ${{ fromJSON(inputs.lane_json).baseline_root }}
      ARTIFACT_FAMILY: ${{ fromJSON(inputs.lane_json).artifact_family }}
      REF_STAGE_ROOT: ${{ github.workspace }}/tmp/xymon-refs
      UPLOAD_ARTIFACTS: ${{ inputs.upload_artifacts != '' && inputs.upload_artifacts || (inputs.mode == 'compare' && (fromJSON(inputs.lane_json).upload_artifacts == true && '1' || '0') || (fromJSON(inputs.lane_json).upload_artifacts == false && '0' || '1')) }}
      RUN_COMPARE: ${{ inputs.run_compare }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bootstrap install + refs on BSD VM
        if: ${{ env.MODE == 'generate' }}
        uses: ./.github/actions/run-bsd-vm-with-retry
        with:
          operating_system: ${{ env.REF_OS }}
          architecture: ${{ env.ARCHITECTURE }}
          version: ${{ env.OS_VERSION }}
          shell: bash
          memory: ${{ env.VM_MEMORY }}
          cpu_count: ${{ env.VM_CPU_COUNT }}
          sync_files: true
          shutdown_vm: true
          run_script: |
            set -euo pipefail
            export BUILD_TOOL="${{ env.BUILD_TOOL }}"
            export REF_OS="${{ env.REF_OS }}"
            export PLATFORM_OS="${{ env.PLATFORM_OS }}"
            export OS_VERSION="${{ env.OS_VERSION }}"
            export VARIANT="${{ env.VARIANT }}"
            export REF_STAGE_ROOT="${{ env.REF_STAGE_ROOT }}"
            bash ci/run/ref/bootstrap-make-refs.sh

      - name: Load legacy hostname (runs for each matrix variant)
        if: ${{ env.MODE == 'compare' }}
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/load-legacy-hostname.sh \
            --config "docs/cmake-legacy-migration/refs/${BASELINE_ROOT}/server/var/lib/xymon/server/etc/xymonserver.cfg"

      - name: Bootstrap install + refs snapshot (BSD VM)
        if: ${{ env.MODE == 'compare' }}
        uses: ./.github/actions/run-bsd-vm-with-retry
        with:
          operating_system: ${{ env.REF_OS }}
          architecture: ${{ env.ARCHITECTURE }}
          version: ${{ env.OS_VERSION }}
          shell: bash
          memory: 2048M
          cpu_count: 2
          sync_files: true
          run_script: |
            set -euo pipefail
            export PLATFORM_OS="${{ env.PLATFORM_OS }}"
            bash ci/run/ref/bootstrap-build-refs.sh \
              --build "${{ env.BUILD_TOOL }}" \
              --os "${{ env.REF_OS }}" \
              --version "${{ env.OS_VERSION }}" \
              --variant "${{ env.VARIANT }}" \
              --ref-prefix "docs/cmake-legacy-migration/refs/${{ env.BASELINE_ROOT }}/${{ env.VARIANT }}" \
              --refs-root ".ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/refs" \
              --artifact-root ".ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/${{ env.BUILD_TOOL }}-${{ env.OS_VERSION }}-${{ env.VARIANT }}"

      - name: Compare refs snapshot (blocking policy checks)
        if: ${{ env.MODE == 'compare' && env.RUN_COMPARE == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          bash ci/compare-refs.sh \
            --baseline-prefix "docs/cmake-legacy-migration/refs/${BASELINE_ROOT}/${VARIANT}" \
            --candidate-dir ".ci-artifacts/ref-valid-${ARTIFACT_FAMILY}/refs/${BUILD_TOOL}.${REF_OS}.${VARIANT}"

      - name: Upload dependency report
        if: ${{ env.MODE == 'generate' && env.UPLOAD_ARTIFACTS == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: deps_${{ env.BUILD_TOOL }}_${{ env.PLATFORM_ID }}_${{ env.VARIANT }}__${{ env.ARTIFACT_ARCH }}__${{ inputs.lane_name }}
          path: ${{ env.REF_STAGE_ROOT }}/${{ env.BUILD_TOOL }}.${{ env.REF_OS }}.${{ env.VARIANT }}/meta/deps-report.json
          if-no-files-found: warn

      - name: Upload legacy references
        if: ${{ env.MODE == 'generate' && env.UPLOAD_ARTIFACTS == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: ref_${{ env.BUILD_TOOL }}_${{ env.REF_OS }}-${{ env.VARIANT }}__${{ env.PLATFORM_ID }}__${{ env.ARTIFACT_ARCH }}
          path: |
            ${{ env.REF_STAGE_ROOT }}/${{ env.BUILD_TOOL }}.${{ env.REF_OS }}.${{ env.VARIANT }}/**
          if-no-files-found: error

      - name: Upload dependency report
        if: ${{ always() && env.MODE == 'compare' && env.UPLOAD_ARTIFACTS == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: deps_valid_${{ env.BUILD_TOOL }}_${{ env.PLATFORM_ID }}_${{ env.VARIANT }}__${{ env.ARTIFACT_ARCH }}__${{ inputs.lane_name }}
          path: .ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/${{ env.BUILD_TOOL }}-${{ env.OS_VERSION }}-${{ env.VARIANT }}/deps-report.json
          if-no-files-found: warn

      - name: Upload artifacts
        if: ${{ always() && env.MODE == 'compare' && env.UPLOAD_ARTIFACTS == '1' }}
        uses: ./.github/actions/upload-ref-valid-artifacts
        with:
          lane_name: ${{ inputs.lane_name }}
          if_no_files_found: warn
          extra_paths: |
            .ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/${{ env.BUILD_TOOL }}-${{ env.OS_VERSION }}-${{ env.VARIANT }}/**
            .ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/refs/${{ env.BUILD_TOOL }}.${{ env.REF_OS }}.${{ env.VARIANT }}/**

      - name: Skip artifacts when upload is disabled
        if: ${{ always() && env.UPLOAD_ARTIFACTS != '1' }}
        shell: bash
        run: |
          echo "Skipping actions/upload-artifact for this lane."
