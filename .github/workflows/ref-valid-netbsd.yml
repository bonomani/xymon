name: Reference Validation - NetBSD

on:
  workflow_dispatch:

jobs:
  ref-valid-netbsd:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NetBSD 10.1 x86-64 - Server
            netbsd_version: "10.1"
            architecture: x86-64
            variant: server
          - name: NetBSD 10.1 x86-64 - Client (ct-client)
            netbsd_version: "10.1"
            architecture: x86-64
            variant: localclient
          - name: NetBSD 10.1 x86-64 - Client (ct-server)
            netbsd_version: "10.1"
            architecture: x86-64
            variant: client
          - name: NetBSD 10.1 arm64 - Server
            netbsd_version: "10.1"
            architecture: arm64
            variant: server
          - name: NetBSD 10.1 arm64 - Client (ct-client)
            netbsd_version: "10.1"
            architecture: arm64
            variant: localclient
          - name: NetBSD 10.1 arm64 - Client (ct-server)
            netbsd_version: "10.1"
            architecture: arm64
            variant: client
          - name: NetBSD 10.0 x86-64 - Server
            netbsd_version: "10.0"
            architecture: x86-64
            variant: server
          - name: NetBSD 10.0 x86-64 - Client (ct-client)
            netbsd_version: "10.0"
            architecture: x86-64
            variant: localclient
          - name: NetBSD 10.0 x86-64 - Client (ct-server)
            netbsd_version: "10.0"
            architecture: x86-64
            variant: client
          - name: NetBSD 10.0 arm64 - Server
            netbsd_version: "10.0"
            architecture: arm64
            variant: server
          - name: NetBSD 10.0 arm64 - Client (ct-client)
            netbsd_version: "10.0"
            architecture: arm64
            variant: localclient
          - name: NetBSD 10.0 arm64 - Client (ct-server)
            netbsd_version: "10.0"
            architecture: arm64
            variant: client
          - name: NetBSD 9.4 x86-64 - Server
            netbsd_version: "9.4"
            architecture: x86-64
            variant: server
          - name: NetBSD 9.4 x86-64 - Client (ct-client)
            netbsd_version: "9.4"
            architecture: x86-64
            variant: localclient
          - name: NetBSD 9.4 x86-64 - Client (ct-server)
            netbsd_version: "9.4"
            architecture: x86-64
            variant: client
          - name: NetBSD 9.3 x86-64 - Server
            netbsd_version: "9.3"
            architecture: x86-64
            variant: server
          - name: NetBSD 9.3 x86-64 - Client (ct-client)
            netbsd_version: "9.3"
            architecture: x86-64
            variant: localclient
          - name: NetBSD 9.3 x86-64 - Client (ct-server)
            netbsd_version: "9.3"
            architecture: x86-64
            variant: client
          - name: NetBSD 9.2 x86-64 - Server
            netbsd_version: "9.2"
            architecture: x86-64
            variant: server
          - name: NetBSD 9.2 x86-64 - Client (ct-client)
            netbsd_version: "9.2"
            architecture: x86-64
            variant: localclient
          - name: NetBSD 9.2 x86-64 - Client (ct-server)
            netbsd_version: "9.2"
            architecture: x86-64
            variant: client
    env:
      VARIANT: ${{ matrix.variant }}
      ENABLE_LDAP: ${{ matrix.variant == 'server' && 'ON' || 'OFF' }}
      ENABLE_SNMP: ${{ matrix.variant == 'server' && 'ON' || 'OFF' }}
      LEGACY_APPLY_OWNERSHIP: ON
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load legacy hostname (runs for each matrix variant)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/load-legacy-hostname.sh \
            --config "docs/cmake-legacy-migration/refs/make_netbsd/server/var/lib/xymon/server/etc/xymonserver.cfg"

      - name: Bootstrap install + metadata (CMake)
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: netbsd
          architecture: "${{ matrix.architecture }}"
          version: "${{ matrix.netbsd_version }}"
          shell: bash
          memory: 2048M
          cpu_count: 2
          sync_files: true
          run: |
            set -euo pipefail
            bash ci/run/ref/bootstrap-cmake-refs.sh \
              --os netbsd \
              --version "${{ matrix.netbsd_version }}" \
              --variant "${{ matrix.variant }}" \
              --ref-prefix "docs/cmake-legacy-migration/refs/make_netbsd/${{ matrix.variant }}" \
              --refs-root ".ci-artifacts/ref-valid-netbsd/refs" \
              --artifact-root ".ci-artifacts/ref-valid-netbsd/${{ matrix.netbsd_version }}-${{ matrix.variant }}"

      - name: Compare refs snapshot (blocking policy checks)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/compare-refs.sh \
            --baseline-prefix "docs/cmake-legacy-migration/refs/make_netbsd/${{ matrix.variant }}" \
            --candidate-dir ".ci-artifacts/ref-valid-netbsd/refs/cmake.netbsd.${{ matrix.variant }}"

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ref-valid-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            .ci-artifacts/ref-valid-netbsd/${{ matrix.netbsd_version }}-${{ matrix.variant }}/**
            .ci-artifacts/ref-valid-netbsd/refs/cmake.netbsd.${{ matrix.variant }}/**
            /tmp/legacy.config.extract
            /tmp/cmake.config.extract
            /tmp/config.diff
            /tmp/legacy.list
            /tmp/cmake.list
            /tmp/cmake.filtered.list
            /tmp/allowed-extras.list
            /tmp/legacy-cmake.diff
            /tmp/legacy.keyfiles.missing
            /tmp/legacy.keyfiles.sha256
            /tmp/legacy.keyfiles.perms
            /tmp/legacy.keyfiles.sha256.diff
            /tmp/legacy.symlinks.broken
            /tmp/legacy.symlinks.list
            /tmp/legacy.perms.snapshot
            /tmp/legacy.owners.snapshot
            /tmp/legacy.bin.links
            /tmp/legacy.embedded.paths
            /tmp/legacy.symlinks.diff
            /tmp/legacy.perms.diff
            /tmp/legacy.owners.diff
            /tmp/legacy.owners.names.diff
            /tmp/legacy.binlinks.diff
            /tmp/legacy.needed.norm.diff
            /tmp/legacy.embedded.diff
