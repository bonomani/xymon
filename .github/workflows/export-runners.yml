name: Export host runner catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-runners:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export normalized host runner catalog
        run: python .github/scripts/export-runners.py

      - name: Commit and push runner catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/data/github-host-runners.yml
          git rm -q --ignore-unmatch .github/data/runtime-runners.yml
          if git diff --staged --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Update host runner catalog'
          git push
