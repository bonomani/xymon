name: Export hosted runner list

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  actions: read

jobs:
  export-runners:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Ensure data directory
        run: mkdir -p .github/data

      - name: Query hosted runner set
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python .github/scripts/export-runners.py

      - name: Commit and push runner list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/data/runtime-runners.yml
          if git diff --staged --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Update hosted runner list'
          git push
