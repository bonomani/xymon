name: Build Packages

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (ex: 4.3.34). Empty = derive from rel-* tag."
        required: false
        type: string
        default: ""
      package_set:
        description: Package formats to build.
        required: true
        type: choice
        default: all
        options:
          - all
          - deb
          - rpm
  push:
    tags:
      - 'rel-*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release_version: ${{ steps.prepare.outputs.release_version }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      matrix_count: ${{ steps.prepare.outputs.matrix_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve package execution model
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/run/package/resolve-package-build.py \
            --release-version "${{ inputs.release_version }}" \
            --package-set "${{ inputs.package_set }}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Summary
        shell: bash
        run: |
          echo "Release version: ${{ steps.prepare.outputs.release_version }}"
          echo "Package jobs selected: ${{ steps.prepare.outputs.matrix_count }}"

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix_count != '0' }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install packaging dependencies
        shell: bash
        env:
          HOST_PACKAGES: ${{ matrix.host_packages }}
        run: |
          set -euo pipefail
          mapfile -t packages <<< "${HOST_PACKAGES}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Build package artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash "${{ matrix.build_script }}" --release "${{ needs.prepare.outputs.release_version }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
