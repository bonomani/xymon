name: Reference Validation - FreeBSD

on:
  workflow_dispatch:

jobs:
  ref-valid-freebsd:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: FreeBSD 15.0 - Server
            freebsd_version: "15.0"
            variant: server
          - name: FreeBSD 15.0 - Client (ct-client)
            freebsd_version: "15.0"
            variant: localclient
          - name: FreeBSD 15.0 - Client (ct-server)
            freebsd_version: "15.0"
            variant: client
          - name: FreeBSD 14.3 - Server
            freebsd_version: "14.3"
            variant: server
          - name: FreeBSD 14.3 - Client (ct-client)
            freebsd_version: "14.3"
            variant: localclient
          - name: FreeBSD 14.3 - Client (ct-server)
            freebsd_version: "14.3"
            variant: client
          - name: FreeBSD 13.5 - Server
            freebsd_version: "13.5"
            variant: server
          - name: FreeBSD 13.5 - Client (ct-client)
            freebsd_version: "13.5"
            variant: localclient
          - name: FreeBSD 13.5 - Client (ct-server)
            freebsd_version: "13.5"
            variant: client
    env:
      VARIANT: ${{ matrix.variant }}
      ENABLE_LDAP: ${{ matrix.variant == 'server' && 'ON' || 'OFF' }}
      ENABLE_SNMP: ${{ matrix.variant == 'server' && 'ON' || 'OFF' }}
      LEGACY_APPLY_OWNERSHIP: ON
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load legacy hostname (runs for each matrix variant)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/load-legacy-hostname.sh \
            --config "docs/cmake-legacy-migration/refs/make_freebsd/server/var/lib/xymon/server/etc/xymonserver.cfg"

      - name: Bootstrap install + metadata (CMake)
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          architecture: x86-64
          version: "${{ matrix.freebsd_version }}"
          shell: bash
          memory: 2048M
          cpu_count: 2
          sync_files: true
          run: |
            set -euo pipefail
            bash ci/run/ref/bootstrap-cmake-refs.sh \
              --os freebsd \
              --version "${{ matrix.freebsd_version }}" \
              --variant "${{ matrix.variant }}" \
              --ref-prefix "docs/cmake-legacy-migration/refs/make_freebsd/${{ matrix.variant }}" \
              --refs-root ".ci-artifacts/ref-valid-freebsd/refs" \
              --artifact-root ".ci-artifacts/ref-valid-freebsd/${{ matrix.freebsd_version }}-${{ matrix.variant }}"

      - name: Compare refs snapshot (blocking policy checks)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/compare-refs.sh \
            --baseline-prefix "docs/cmake-legacy-migration/refs/make_freebsd/${{ matrix.variant }}" \
            --candidate-dir ".ci-artifacts/ref-valid-freebsd/refs/cmake.freebsd.${{ matrix.variant }}"

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ref-valid-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            .ci-artifacts/ref-valid-freebsd/${{ matrix.freebsd_version }}-${{ matrix.variant }}/**
            .ci-artifacts/ref-valid-freebsd/refs/cmake.freebsd.${{ matrix.variant }}/**
            /tmp/legacy.config.extract
            /tmp/cmake.config.extract
            /tmp/config.diff
            /tmp/legacy.list
            /tmp/cmake.list
            /tmp/cmake.filtered.list
            /tmp/allowed-extras.list
            /tmp/legacy-cmake.diff
            /tmp/legacy.keyfiles.missing
            /tmp/legacy.keyfiles.sha256
            /tmp/legacy.keyfiles.perms
            /tmp/legacy.keyfiles.sha256.diff
            /tmp/legacy.symlinks.broken
            /tmp/legacy.symlinks.list
            /tmp/legacy.perms.snapshot
            /tmp/legacy.owners.snapshot
            /tmp/legacy.bin.links
            /tmp/legacy.embedded.paths
            /tmp/legacy.symlinks.diff
            /tmp/legacy.perms.diff
            /tmp/legacy.owners.diff
            /tmp/legacy.owners.names.diff
            /tmp/legacy.binlinks.diff
            /tmp/legacy.needed.norm.diff
            /tmp/legacy.embedded.diff
