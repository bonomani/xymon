name: Reference Validation - RPM

on:
  workflow_dispatch:

jobs:
  ref-valid-rpm:
    runs-on: ${{ matrix.runs_on }}
    container:
      image: ${{ matrix.container }}
      options: ${{ matrix.container_options || '--platform linux/amd64' }}
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rocky Linux 8 - Server
            runs_on: ubuntu-22.04
            container: rockylinux:8
            container_options: --platform linux/amd64
            variant: server
            allow_failure: false
          - name: Rocky Linux 8 - Client (ct-client)
            runs_on: ubuntu-22.04
            container: rockylinux:8
            container_options: --platform linux/amd64
            variant: localclient
            allow_failure: false
          - name: Rocky Linux 8 - Client (ct-server)
            runs_on: ubuntu-22.04
            container: rockylinux:8
            container_options: --platform linux/amd64
            variant: client
            allow_failure: false
          - name: Rocky Linux 9 - Server
            runs_on: ubuntu-22.04
            container: rockylinux:9
            container_options: --platform linux/amd64
            variant: server
            allow_failure: false
          - name: Rocky Linux 9 - Client (ct-client)
            runs_on: ubuntu-22.04
            container: rockylinux:9
            container_options: --platform linux/amd64
            variant: localclient
            allow_failure: false
          - name: Rocky Linux 9 - Client (ct-server)
            runs_on: ubuntu-22.04
            container: rockylinux:9
            container_options: --platform linux/amd64
            variant: client
            allow_failure: false
          - name: AlmaLinux 8 - Server
            runs_on: ubuntu-22.04
            container: almalinux:8
            container_options: --platform linux/amd64
            variant: server
            allow_failure: false
          - name: AlmaLinux 8 - Client (ct-client)
            runs_on: ubuntu-22.04
            container: almalinux:8
            container_options: --platform linux/amd64
            variant: localclient
            allow_failure: false
          - name: AlmaLinux 8 - Client (ct-server)
            runs_on: ubuntu-22.04
            container: almalinux:8
            container_options: --platform linux/amd64
            variant: client
            allow_failure: false
          - name: AlmaLinux 9 - Server
            runs_on: ubuntu-22.04
            container: almalinux:9
            container_options: --platform linux/amd64
            variant: server
            allow_failure: false
          - name: AlmaLinux 9 - Client (ct-client)
            runs_on: ubuntu-22.04
            container: almalinux:9
            container_options: --platform linux/amd64
            variant: localclient
            allow_failure: false
          - name: AlmaLinux 9 - Client (ct-server)
            runs_on: ubuntu-22.04
            container: almalinux:9
            container_options: --platform linux/amd64
            variant: client
            allow_failure: false
          - name: AlmaLinux 10 - Server
            runs_on: ubuntu-22.04
            container: almalinux:10
            container_options: --platform linux/amd64
            variant: server
            allow_failure: false
          - name: AlmaLinux 10 - Client (ct-client)
            runs_on: ubuntu-22.04
            container: almalinux:10
            container_options: --platform linux/amd64
            variant: localclient
            allow_failure: false
          - name: AlmaLinux 10 - Client (ct-server)
            runs_on: ubuntu-22.04
            container: almalinux:10
            container_options: --platform linux/amd64
            variant: client
            allow_failure: false
          - name: Fedora 40 - Server
            runs_on: ubuntu-22.04
            container: fedora:40
            container_options: --platform linux/amd64
            variant: server
            allow_failure: false
          - name: Fedora 40 - Client (ct-client)
            runs_on: ubuntu-22.04
            container: fedora:40
            container_options: --platform linux/amd64
            variant: localclient
            allow_failure: false
          - name: Fedora 40 - Client (ct-server)
            runs_on: ubuntu-22.04
            container: fedora:40
            container_options: --platform linux/amd64
            variant: client
            allow_failure: false
          - name: Fedora 41 - Server
            runs_on: ubuntu-22.04
            container: fedora:41
            container_options: --platform linux/amd64
            variant: server
            allow_failure: false
          - name: Fedora 41 - Client (ct-client)
            runs_on: ubuntu-22.04
            container: fedora:41
            container_options: --platform linux/amd64
            variant: localclient
            allow_failure: false
          - name: Fedora 41 - Client (ct-server)
            runs_on: ubuntu-22.04
            container: fedora:41
            container_options: --platform linux/amd64
            variant: client
            allow_failure: false
          - name: Fedora 42 - Server
            runs_on: ubuntu-22.04
            container: fedora:42
            container_options: --platform linux/amd64
            variant: server
            allow_failure: false
          - name: Fedora 42 - Client (ct-client)
            runs_on: ubuntu-22.04
            container: fedora:42
            container_options: --platform linux/amd64
            variant: localclient
            allow_failure: false
          - name: Fedora 42 - Client (ct-server)
            runs_on: ubuntu-22.04
            container: fedora:42
            container_options: --platform linux/amd64
            variant: client
            allow_failure: false
    name: ${{ matrix.name }}
    env:
      VARIANT: ${{ matrix.variant }}
      ENABLE_LDAP: ${{ matrix.variant == 'server' && 'ON' || 'OFF' }}
      ENABLE_SNMP: ${{ matrix.variant == 'server' && 'ON' || 'OFF' }}
      LEGACY_APPLY_OWNERSHIP: ON

    steps:
      - name: Prepare checkout tools in container
        shell: sh
        run: |
          set -eu
          need_install=0
          command -v tar >/dev/null 2>&1 || need_install=1
          command -v git >/dev/null 2>&1 || need_install=1
          command -v awk >/dev/null 2>&1 || need_install=1
          command -v update-ca-certificates >/dev/null 2>&1 || need_install=1
          [ "${need_install}" -eq 1 ] || exit 0

          if [ -r /etc/os-release ]; then
            # shellcheck disable=SC1091
            . /etc/os-release
          fi

          configure_rocky_fallback_repos() {
            [ "${ID:-}" = "rocky" ] || return 0
            rocky_major="${VERSION_ID%%.*}"
            [ -n "${rocky_major}" ] || rocky_major="8"

            {
              printf '%s\n' '[ci-rocky-baseos]'
              printf '%s\n' 'name=CI Rocky BaseOS fallback mirrors'
              printf '%s\n' 'baseurl=https://mirror.rackspace.com/rocky/@ROCKY_MAJOR@/BaseOS/$basearch/os/'
              printf '%s\n' '        https://mirror.math.princeton.edu/pub/rocky/@ROCKY_MAJOR@/BaseOS/$basearch/os/'
              printf '%s\n' '        https://mirrors.sonic.net/rocky/@ROCKY_MAJOR@/BaseOS/$basearch/os/'
              printf '%s\n' '        https://ftp.iij.ad.jp/pub/linux/rocky/@ROCKY_MAJOR@/BaseOS/$basearch/os/'
              printf '%s\n' 'enabled=1'
              printf '%s\n' 'gpgcheck=1'
              printf '%s\n' 'gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-rockyofficial'
              printf '%s\n' 'skip_if_unavailable=1'
              printf '\n'

              printf '%s\n' '[ci-rocky-appstream]'
              printf '%s\n' 'name=CI Rocky AppStream fallback mirrors'
              printf '%s\n' 'baseurl=https://mirror.rackspace.com/rocky/@ROCKY_MAJOR@/AppStream/$basearch/os/'
              printf '%s\n' '        https://mirror.math.princeton.edu/pub/rocky/@ROCKY_MAJOR@/AppStream/$basearch/os/'
              printf '%s\n' '        https://mirrors.sonic.net/rocky/@ROCKY_MAJOR@/AppStream/$basearch/os/'
              printf '%s\n' '        https://ftp.iij.ad.jp/pub/linux/rocky/@ROCKY_MAJOR@/AppStream/$basearch/os/'
              printf '%s\n' 'enabled=1'
              printf '%s\n' 'gpgcheck=1'
              printf '%s\n' 'gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-rockyofficial'
              printf '%s\n' 'skip_if_unavailable=1'
              printf '\n'

              printf '%s\n' '[ci-rocky-extras]'
              printf '%s\n' 'name=CI Rocky Extras fallback mirrors'
              printf '%s\n' 'baseurl=https://mirror.rackspace.com/rocky/@ROCKY_MAJOR@/extras/$basearch/os/'
              printf '%s\n' '        https://mirror.math.princeton.edu/pub/rocky/@ROCKY_MAJOR@/extras/$basearch/os/'
              printf '%s\n' '        https://mirrors.sonic.net/rocky/@ROCKY_MAJOR@/extras/$basearch/os/'
              printf '%s\n' '        https://ftp.iij.ad.jp/pub/linux/rocky/@ROCKY_MAJOR@/extras/$basearch/os/'
              printf '%s\n' 'enabled=1'
              printf '%s\n' 'gpgcheck=1'
              printf '%s\n' 'gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-rockyofficial'
              printf '%s\n' 'skip_if_unavailable=1'
            } > /etc/yum.repos.d/ci-rocky-fallback.repo

            sed -i "s|@ROCKY_MAJOR@|${rocky_major}|g" /etc/yum.repos.d/ci-rocky-fallback.repo
          }

          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends tar git gawk ca-certificates
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive refresh
            zypper --non-interactive install tar git gawk ca-certificates
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache tar git gawk ca-certificates
          elif command -v dnf >/dev/null 2>&1; then
            configure_rocky_fallback_repos
            if [ "${ID:-}" = "rocky" ]; then
              dnf -y \
                --disablerepo=baseos \
                --disablerepo=appstream \
                --disablerepo=extras \
                --enablerepo=ci-rocky-baseos \
                --enablerepo=ci-rocky-appstream \
                --enablerepo=ci-rocky-extras \
                install tar git gawk ca-certificates
            else
              dnf -y install tar git gawk ca-certificates
            fi
          elif command -v yum >/dev/null 2>&1; then
            configure_rocky_fallback_repos
            if [ "${ID:-}" = "rocky" ]; then
              yum -y \
                --disablerepo=baseos \
                --disablerepo=appstream \
                --disablerepo=extras \
                --enablerepo=ci-rocky-baseos \
                --enablerepo=ci-rocky-appstream \
                --enablerepo=ci-rocky-extras \
                install tar git gawk ca-certificates
            else
              yum -y install tar git gawk ca-certificates
            fi
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm archlinux-keyring || true
            pacman -S --noconfirm tar git gawk ca-certificates
          else
            echo "Unsupported package manager for installing checkout tools" >&2
            exit 2
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load legacy hostname (runs for each matrix variant)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/load-legacy-hostname.sh \
            --config "docs/cmake-legacy-migration/refs/make_linux/server/var/lib/xymon/server/etc/xymonserver.cfg"
      - name: Seed baseline UID/GID identities (container)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/seed-legacy-identities.sh \
            --passwd "docs/cmake-legacy-migration/refs/make_linux/${{ matrix.variant }}/owners.passwd" \
            --group "docs/cmake-legacy-migration/refs/make_linux/${{ matrix.variant }}/owners.group"
      - name: Bootstrap install + metadata (CMake)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/bootstrap-cmake.sh \
            --os linux \
            --variant "${{ matrix.variant }}"
      - name: Load staged tree metadata
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/load-staged-metadata.sh
      - name: Validate config.h parity
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/validate-config-parity.sh \
            --legacy-config "docs/cmake-legacy-migration/refs/make_linux/${{ matrix.variant }}/meta/config.h"
      - name: Generate CMake refs snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xymon-refs
          bash ci/generate-refs.sh \
            --os linux \
            --variant "${{ matrix.variant }}" \
            --build cmake \
            --root "${LEGACY_ROOT}" \
            --topdir "${LEGACY_TOPDIR}" \
            --config-h "${XYMON_CONFIG_H:-}" \
            --refs-root /tmp/xymon-refs

      - name: Compare refs snapshot (blocking policy checks)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/compare-refs.sh \
            --baseline-prefix "docs/cmake-legacy-migration/refs/make_linux/${{ matrix.variant }}" \
            --candidate-dir "/tmp/xymon-refs/cmake.linux.${{ matrix.variant }}" \
            --candidate-root "${LEGACY_ROOT}"

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ref-valid-${{ matrix.name }}
          path: |
            /tmp/legacy.config.extract
            /tmp/cmake.config.extract
            /tmp/config.diff
            /tmp/legacy.list
            /tmp/cmake.list
            /tmp/cmake.filtered.list
            /tmp/allowed-extras.list
            /tmp/legacy-cmake.diff
            /tmp/legacy.keyfiles.missing
            /tmp/legacy.keyfiles.sha256
            /tmp/legacy.keyfiles.perms
            /tmp/legacy.keyfiles.sha256.diff
            /tmp/legacy.symlinks.broken
            /tmp/legacy.symlinks.list
            /tmp/legacy.perms.snapshot
            /tmp/legacy.owners.snapshot
            /tmp/legacy.bin.links
            /tmp/legacy.embedded.paths
            /tmp/legacy.symlinks.diff
            /tmp/legacy.perms.diff
            /tmp/legacy.owners.diff
            /tmp/legacy.owners.names.diff
            /tmp/legacy.binlinks.diff
            /tmp/legacy.needed.norm.diff
            /tmp/legacy.embedded.diff
            /tmp/install-cmake-legacy.log
            /tmp/cmake.configure.log
            /tmp/cmake.trace.json
            /tmp/cmake.trace.log
