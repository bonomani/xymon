name: Pipeline - Sync Artifacts to Branches

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Optional selector run references (comma/newline-separated database ids, run URLs, or "... #N") to download legacy reference artifacts from
        required: false
        default: ""
      source_branch:
        description: Branch to pull legacy reference artifacts from
        required: false
        default: cmake/bootstrap
      target_branch:
        description: Merge-friendly branch to commit updated references into
        required: false
        default: ci/references-update
      archive_branch:
        description: Refs-only archival branch
        required: false
        default: ci/references-update-archive

permissions:
  contents: write

jobs:
  sync-legacy-references:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download legacy reference artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          artifacts_dir="/tmp/legacy-reference-artifacts"
          run_id_file="/tmp/pipeline-sync-source-run-ids.txt"
          rm -rf "${artifacts_dir}"
          mkdir -p "${artifacts_dir}"
          rm -f "${run_id_file}"
          workflow="pipeline-select-run-lanes.yml"
          python3 - <<'PY' > "${run_id_file}"
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          sys.path.insert(0, os.path.join(os.getcwd(), "ci", "run", "ref"))
          from github_actions_runs import load_run_from_selector

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          workflow = "pipeline-select-run-lanes.yml"
          branch = "${{ inputs.source_branch }}"
          requested_run_selector = os.environ.get("INPUT_SOURCE_RUN_ID", "").strip()

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": f"{repo}/pipeline-sync-artifacts",
          }

          def api_get(repo_name: str, _token: str, path: str, params: dict | None = None) -> dict:
              url = f"https://api.github.com{path}"
              if params:
                  query = "&".join(
                      f"{key}={value}" for key, value in params.items() if value not in (None, "")
                  )
                  if query:
                      url = f"{url}?{query}"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          def has_ref_artifacts(run_id: str) -> bool:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100",
                  headers=headers,
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              artifacts = payload.get("artifacts", [])
              return any(str(artifact.get("name", "")).startswith("ref_") for artifact in artifacts)

          def resolve_selector(selector: str) -> str:
              selector = " ".join((selector or "").strip().split())
              if not selector:
                  return ""
              try:
                  run, _resolved_via = load_run_from_selector(
                      api_get,
                      repo,
                      token,
                      workflow,
                      selector,
                  )
              except urllib.error.HTTPError as exc:
                  if exc.code != 404 or not selector.isdigit():
                      raise
                  run, _resolved_via = load_run_from_selector(
                      api_get,
                      repo,
                      token,
                      workflow,
                      f"#{selector}",
                  )
              run_id = str(run.get("id", "")).strip()
              if run_id and has_ref_artifacts(run_id):
                  return run_id
              return ""

          if requested_run_selector:
              seen = set()
              resolved = []
              for raw_selector in requested_run_selector.replace(",", "\n").splitlines():
                  run_id = resolve_selector(raw_selector)
                  if not run_id:
                      sys.exit(1)
                  if run_id not in seen:
                      seen.add(run_id)
                      resolved.append(run_id)
              if resolved:
                  print("\n".join(resolved))
                  sys.exit(0)
              sys.exit(1)

          runs_raw = subprocess.check_output(
              [
                  "gh",
                  "run",
                  "list",
                  "--repo",
                  repo,
                  "--workflow",
                  workflow,
                  "--branch",
                  branch,
                  "--status",
                  "success",
                  "--limit",
                  "20",
                  "--json",
                  "databaseId",
              ],
              text=True,
          )
          runs = json.loads(runs_raw)
          for run in runs:
              run_id = str(run.get("databaseId", "")).strip()
              if not run_id:
                  continue
              if has_ref_artifacts(run_id):
                  print(run_id)
                  sys.exit(0)

          sys.exit(1)
          PY
          mapfile -t run_ids < <(sed -e '/^[[:space:]]*$/d' "${run_id_file}")

          if [ "${#run_ids[@]}" -eq 0 ]; then
            if [ -n "${INPUT_SOURCE_RUN_ID}" ]; then
              echo "Requested run selector(s) ${INPUT_SOURCE_RUN_ID} have no downloadable ref_* artifacts" >&2
            else
              echo "No successful run found for ${workflow} on branch ${{ inputs.source_branch }} with downloadable ref_* artifacts" >&2
            fi
            exit 1
          fi

          # Download into a single root. gh creates one subdir per artifact name.
          # This avoids an extra workflow-name directory layer.
          for run_id in "${run_ids[@]}"; do
            gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --dir "${artifacts_dir}"
          done

          stager_script="/tmp/stage-legacy-reference-artifacts.sh"
          install -m 0755 ci/run/ref/stage-legacy-reference-artifacts.sh "${stager_script}"
          printf 'REF_STAGE_SCRIPT=%s\n' "${stager_script}" >> "${GITHUB_ENV}"

      - name: Sync archive branch
        shell: bash
        run: |
          set -euo pipefail
          ref_dir="docs/cmake-legacy-migration/refs"
          artifacts_dir="/tmp/legacy-reference-artifacts"
          archive_branch="${{ inputs.archive_branch }}"

          if git fetch origin "${archive_branch}"; then
            git checkout -B "${archive_branch}" "origin/${archive_branch}"
          else
            git checkout --orphan "${archive_branch}"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          git clean -fd
          mkdir -p "${ref_dir}"
          find "${ref_dir}" -type f -delete

          bash "${REF_STAGE_SCRIPT}" \
            --artifacts-dir "${artifacts_dir}" \
            --ref-dir "${ref_dir}"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No legacy reference changes to commit on archive branch."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "${ref_dir}"
            git commit -m "Update legacy reference artifacts"
            git push -u origin "${archive_branch}"
          fi

      - name: Sync merge-friendly branch
        shell: bash
        run: |
          set -euo pipefail
          ref_dir="docs/cmake-legacy-migration/refs"
          artifacts_dir="/tmp/legacy-reference-artifacts"
          source_branch="${{ inputs.source_branch }}"
          target_branch="${{ inputs.target_branch }}"

          git clean -fd "${ref_dir}"
          git checkout -- "${ref_dir}" || true

          git fetch origin "${source_branch}"
          if git fetch origin "${target_branch}"; then
            if ! git merge-base --is-ancestor "origin/${source_branch}" "origin/${target_branch}"; then
              echo "Target branch is not based on ${source_branch}; recreating ${target_branch}."
              git push origin --delete "${target_branch}" || true
              git checkout -B "${target_branch}" "origin/${source_branch}"
            else
              git checkout -B "${target_branch}" "origin/${target_branch}"
            fi
          else
            git checkout -B "${target_branch}" "origin/${source_branch}"
          fi

          git clean -fd "${ref_dir}"
          git checkout -- "${ref_dir}" >/dev/null 2>&1 || true
          mkdir -p "${ref_dir}"
          find "${ref_dir}" -type f -delete

          bash "${REF_STAGE_SCRIPT}" \
            --artifacts-dir "${artifacts_dir}" \
            --ref-dir "${ref_dir}"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No legacy reference changes to commit on merge-friendly branch."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${ref_dir}"
          git commit -m "Update legacy reference artifacts"
          git push -u origin "${target_branch}"
