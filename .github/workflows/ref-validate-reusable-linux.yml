name: Reference Validation - Reusable Linux Lane

on:
  workflow_call:
    inputs:
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-container:
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runs_on || 'ubuntu-22.04' }}
    continue-on-error: ${{ fromJSON(inputs.lane_json).allow_failure == true }}
    container:
      image: ${{ fromJSON(inputs.lane_json).container }}
      options: ${{ fromJSON(inputs.lane_json).container_options || '--platform linux/amd64' }}
    env:
      BUILD_TOOL: ${{ fromJSON(inputs.lane_json).build_tool || 'cmake' }}
      VARIANT: ${{ fromJSON(inputs.lane_json).variant }}
      ENABLE_LDAP: ${{ fromJSON(inputs.lane_json).variant == 'server' && 'ON' || 'OFF' }}
      ENABLE_SNMP: ${{ fromJSON(inputs.lane_json).variant == 'server' && 'ON' || 'OFF' }}
      LEGACY_APPLY_OWNERSHIP: ON
      CMAKE_BIN: ${{ fromJSON(inputs.lane_json).cmake_bin || '' }}
      BASELINE_ROOT: ${{ fromJSON(inputs.lane_json).baseline_root || 'make_linux' }}
      REF_OS: ${{ fromJSON(inputs.lane_json).ref_os || 'linux' }}
      ARTIFACT_FAMILY: ${{ fromJSON(inputs.lane_json).artifact_family || 'linux' }}
      PLATFORM_ID: ${{ fromJSON(inputs.lane_json).platform_id || 'linux' }}
      PREPARE_PROFILE: ${{ fromJSON(inputs.lane_json).prepare_profile || 'default' }}
      CHECKOUT_MODE: ${{ fromJSON(inputs.lane_json).checkout_mode || 'action' }}
      UPLOAD_ARTIFACTS: ${{ fromJSON(inputs.lane_json).upload_artifacts == true && '1' || '0' }}
    steps:
      - name: Prepare checkout tools in container
        shell: sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          bootstrap_script="ci/run/ref/prepare-checkout-tools-bootstrap.sh"
          if [ ! -f "${bootstrap_script}" ]; then
            url="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ci/run/ref/prepare-checkout-tools-bootstrap.sh?ref=${GITHUB_SHA}"
            bootstrap_script="/tmp/prepare-checkout-tools-bootstrap.sh"

            run_as_root() {
              if command -v sudo >/dev/null 2>&1; then
                sudo "$@"
              else
                "$@"
              fi
            }

            if ! command -v curl >/dev/null 2>&1 && ! command -v wget >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                run_as_root apt-get update
                run_as_root env DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC \
                  apt-get install -y --no-install-recommends ca-certificates curl wget
              elif command -v zypper >/dev/null 2>&1; then
                run_as_root zypper --non-interactive refresh
                run_as_root zypper --non-interactive install ca-certificates curl wget
              elif command -v apk >/dev/null 2>&1; then
                run_as_root apk add --no-cache ca-certificates curl wget
              elif command -v dnf >/dev/null 2>&1; then
                run_as_root dnf -y install ca-certificates curl wget
              elif command -v yum >/dev/null 2>&1; then
                run_as_root yum -y install ca-certificates curl wget
              elif command -v pacman >/dev/null 2>&1; then
                run_as_root pacman -Sy --noconfirm archlinux-keyring || true
                run_as_root pacman -S --noconfirm ca-certificates curl wget
              else
                echo "Need curl or wget to bootstrap prepare-checkout-tools-bootstrap.sh" >&2
                exit 1
              fi
            fi

            if command -v curl >/dev/null 2>&1; then
              if [ -n "${GITHUB_TOKEN:-}" ]; then
                curl -fsSL \
                  -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github.raw" \
                  "${url}" \
                  -o "${bootstrap_script}"
              else
                curl -fsSL \
                  -H "Accept: application/vnd.github.raw" \
                  "${url}" \
                  -o "${bootstrap_script}"
              fi
            else
              if [ -n "${GITHUB_TOKEN:-}" ]; then
                wget -qO "${bootstrap_script}" \
                  --header="Authorization: Bearer ${GITHUB_TOKEN}" \
                  --header="Accept: application/vnd.github.raw" \
                  "${url}"
              else
                wget -qO "${bootstrap_script}" \
                  --header="Accept: application/vnd.github.raw" \
                  "${url}"
              fi
            fi
            chmod +x "${bootstrap_script}"
          fi

          sh "${bootstrap_script}" --prepare-profile "${PREPARE_PROFILE}"

      - name: Checkout
        if: ${{ env.CHECKOUT_MODE == 'action' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout (git, no Node action)
        if: ${{ env.CHECKOUT_MODE == 'git' }}
        shell: sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          workdir="${GITHUB_WORKSPACE:-}"
          if [ -z "${workdir}" ]; then
            echo "GITHUB_WORKSPACE is not set" >&2
            exit 1
          fi

          mkdir -p "${workdir}"
          cd "${workdir}"
          git config --global --add safe.directory "${workdir}"
          git config --global --add safe.directory "$(pwd)"
          rm -rf .git
          git init .
          git remote add origin "${repo_url}"
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\r\n')"
            git config http."${GITHUB_SERVER_URL}/".extraheader "AUTHORIZATION: basic ${auth_header}"
          fi
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Load legacy hostname (runs for each matrix variant)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/load-legacy-hostname.sh \
            --config "docs/cmake-legacy-migration/refs/${BASELINE_ROOT}/server/var/lib/xymon/server/etc/xymonserver.cfg"

      - name: Seed baseline UID/GID identities (container)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/seed-legacy-identities.sh \
            --passwd "docs/cmake-legacy-migration/refs/${BASELINE_ROOT}/${VARIANT}/owners.passwd" \
            --group "docs/cmake-legacy-migration/refs/${BASELINE_ROOT}/${VARIANT}/owners.group"

      - name: Bootstrap install + refs snapshot
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/bootstrap-build-refs.sh \
            --build "${BUILD_TOOL}" \
            --os linux \
            --variant "${VARIANT}" \
            --ref-prefix "docs/cmake-legacy-migration/refs/${BASELINE_ROOT}/${VARIANT}" \
            --refs-root ".ci-artifacts/ref-valid-${ARTIFACT_FAMILY}/refs" \
            --artifact-root ".ci-artifacts/ref-valid-${ARTIFACT_FAMILY}/${BUILD_TOOL}-${PLATFORM_ID}-${VARIANT}"

      - name: Load staged tree metadata
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/load-staged-metadata.sh

      - name: Compare refs snapshot (blocking policy checks)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/compare-refs.sh \
            --baseline-prefix "docs/cmake-legacy-migration/refs/${BASELINE_ROOT}/${VARIANT}" \
            --candidate-dir ".ci-artifacts/ref-valid-${ARTIFACT_FAMILY}/refs/${BUILD_TOOL}.linux.${VARIANT}" \
            --candidate-root "${LEGACY_ROOT}"

      - name: Upload artifacts
        if: ${{ always() && env.UPLOAD_ARTIFACTS == '1' }}
        uses: ./.github/actions/upload-ref-valid-artifacts
        with:
          lane_name: ${{ inputs.lane_name }}
          extra_paths: |
            .ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/${{ env.BUILD_TOOL }}-${{ env.PLATFORM_ID }}-${{ env.VARIANT }}/**
            .ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/refs/${{ env.BUILD_TOOL }}.${{ env.REF_OS }}.${{ env.VARIANT }}/**

      - name: Skip artifacts when Node-based actions are unsupported
        if: ${{ always() && env.UPLOAD_ARTIFACTS != '1' }}
        shell: bash
        run: |
          echo "Skipping actions/upload-artifact for this lane (Node-based actions unsupported in this environment)."
