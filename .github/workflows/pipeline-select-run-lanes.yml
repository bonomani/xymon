name: Pipeline - Select and Run Lanes (Advanced)

on:
  workflow_dispatch:
    inputs:
      family:
        description: Select which reference-generation family to run
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - alpine
          - archlinux
          - centos7
          - debian
          - freebsd
          - macos
          - netbsd
          - openbsd
          - opensuse
          - redhat
          - fedora
          - oraclelinux
          - ubuntu
      build_tool:
        description: Build tool selection (auto derives from ref_mode)
        required: true
        type: choice
        default: auto
        options:
          - auto
          - make
          - cmake
      compiler:
        description: Compiler selection (auto|gcc|clang)
        required: true
        type: choice
        default: auto
        options:
          - auto
          - gcc
          - clang
      profile:
        description: Layout/profile selection (auto|default|debian|packaging|gnuinstall; debian requires make, gnuinstall requires cmake)
        required: true
        type: choice
        default: auto
        options:
          - auto
          - default
          - debian
          - packaging
          - gnuinstall
      verify_depth:
        description: Verification depth (configure|build|install, ref_mode!=off forces install)
        required: true
        type: choice
        default: install
        options:
          - configure
          - build
          - install
      ref_mode:
        description: Reference handling mode
        required: true
        type: choice
        default: 'off'
        options:
          - 'off'
          - generate
          - compare
      publish:
        description: Publish channel
        required: true
        type: choice
        default: none
        options:
          - none
          - artifact
      allow_failure_mode:
        description: Handling of lanes marked allow_failure
        required: true
        type: choice
        default: allow
        options:
          - 'off'
          - allow
          - expect_fail
      source_ref:
        description: Optional branch or tag to run this selector on
        required: false
        type: string
  workflow_call:
    inputs:
      family:
        description: Reference-generation family key (or all)
        required: true
        type: string
      build_tool:
        description: Build tool selection (auto|make|cmake)
        required: true
        type: string
      compiler:
        description: Compiler selection (auto|gcc|clang)
        required: true
        type: string
      profile:
        description: Layout/profile selection (auto|default|debian|packaging|gnuinstall; debian requires make, gnuinstall requires cmake)
        required: true
        type: string
      verify_depth:
        description: Verification depth (configure|build|install, ref_mode!=off forces install)
        required: true
        type: string
      ref_mode:
        description: Reference handling mode (off|generate|compare)
        required: true
        type: string
      publish:
        description: Publish channel (none|artifact)
        required: true
        type: string
      allow_failure_mode:
        description: Handling of lanes marked allow_failure (off|allow|expect_fail)
        required: true
        type: string

permissions:
  contents: read

jobs:
  redispatch-selected-ref:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref != '' && inputs.source_ref != github.ref_name && inputs.source_ref != github.ref }}
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch this workflow on selected ref
        uses: actions/github-script@v7
        with:
          retries: 5
          # Keep caller/config errors non-retriable while retrying transient 5xx/network faults.
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pipeline-select-run-lanes.yml',
              ref: '${{ inputs.source_ref }}',
              inputs: {
                family: '${{ inputs.family }}',
                build_tool: '${{ inputs.build_tool }}',
                compiler: '${{ inputs.compiler }}',
                profile: '${{ inputs.profile }}',
                verify_depth: '${{ inputs.verify_depth }}',
                ref_mode: '${{ inputs.ref_mode }}',
                publish: '${{ inputs.publish }}',
                allow_failure_mode: '${{ inputs.allow_failure_mode }}',
                source_ref: '${{ inputs.source_ref }}'
              }
            });
            core.info('Dispatched pipeline-select-run-lanes.yml (family=${{ inputs.family }}, build_tool=${{ inputs.build_tool }}, compiler=${{ inputs.compiler }}, profile=${{ inputs.profile }}, verify_depth=${{ inputs.verify_depth }}, ref_mode=${{ inputs.ref_mode }}, publish=${{ inputs.publish }}, allow_failure_mode=${{ inputs.allow_failure_mode }}) on ref ${{ inputs.source_ref }}');

  build-matrix:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_ref == '' || inputs.source_ref == github.ref_name || inputs.source_ref == github.ref }}
    runs-on: ubuntu-22.04
    outputs:
      matrix_all: ${{ steps.generate.outputs.matrix_all }}
      build_tool: ${{ steps.resolve_execution.outputs.build_tool }}
      compiler: ${{ steps.resolve_execution.outputs.compiler }}
      profile: ${{ steps.resolve_execution.outputs.profile }}
      verify_depth: ${{ steps.resolve_execution.outputs.verify_depth }}
      goal: ${{ steps.resolve_execution.outputs.goal }}
      ref_mode: ${{ steps.resolve_execution.outputs.ref_mode }}
      publish: ${{ steps.resolve_execution.outputs.publish }}
      allow_failure_mode: ${{ steps.resolve_execution.outputs.allow_failure_mode }}
      lane_count_total: ${{ steps.generate.outputs.lane_count_total }}
      lane_counts_json: ${{ steps.generate.outputs.lane_counts_json }}
      selected_families: ${{ steps.generate.outputs.selected_families }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve execution model
        id: resolve_execution
        shell: bash
        env:
          INPUT_BUILD_TOOL: ${{ inputs.build_tool }}
          INPUT_COMPILER: ${{ inputs.compiler }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_VERIFY_DEPTH: ${{ inputs.verify_depth }}
          INPUT_REF_MODE: ${{ inputs.ref_mode }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_ALLOW_FAILURE_MODE: ${{ inputs.allow_failure_mode }}
        run: |
          set -euo pipefail

          python3 ci/run/ref/resolve-execution-model.py \
            --requested-build-tool "${INPUT_BUILD_TOOL}" \
            --requested-compiler "${INPUT_COMPILER}" \
            --requested-profile "${INPUT_PROFILE}" \
            --requested-verify-depth "${INPUT_VERIFY_DEPTH}" \
            --ref-mode "${INPUT_REF_MODE}" \
            --publish "${INPUT_PUBLISH}" \
            --allow-failure-mode "${INPUT_ALLOW_FAILURE_MODE}" \
            --github-output "${GITHUB_OUTPUT}" > /dev/null

      - name: Validate ref models
        shell: bash
        run: |
          set -euo pipefail

          python3 ci/run/ref/check-ref-models.py \
            --manifest "ci/run/ref/ref-families.yml" \
            --runtime-model "ci/run/ref/runtime-model.json" \
            --selector-workflow ".github/workflows/pipeline-select-run-lanes.yml"

      - name: Build selected lanes matrix
        id: generate
        shell: bash
        env:
          SELECTED_FAMILY: ${{ inputs.family }}
          SELECTED_REF_MODE: ${{ steps.resolve_execution.outputs.ref_mode }}
          SELECTED_BUILD_TOOL: ${{ steps.resolve_execution.outputs.build_tool }}
          SELECTED_COMPILER: ${{ steps.resolve_execution.outputs.compiler }}
          SELECTED_PROFILE: ${{ steps.resolve_execution.outputs.profile }}
        run: |
          set -euo pipefail

          args=(
            python3 "ci/run/ref/build-ref-make-matrix.py"
            --selected-family "${SELECTED_FAMILY}"
            --ref-mode "${SELECTED_REF_MODE}"
            --build-tool "${SELECTED_BUILD_TOOL}"
            --compiler "${SELECTED_COMPILER}"
            --profile "${SELECTED_PROFILE}"
            --manifest "ci/run/ref/ref-families.yml"
            --github-output "${GITHUB_OUTPUT}"
          )

          "${args[@]}"

      - name: Matrix summary
        shell: bash
        run: |
          echo "Selected families: ${{ steps.generate.outputs.selected_families }}"
          echo "Build tool: ${{ steps.resolve_execution.outputs.build_tool }}"
          echo "Compiler: ${{ steps.resolve_execution.outputs.compiler }}"
          echo "Profile: ${{ steps.resolve_execution.outputs.profile }}"
          echo "Verify depth: ${{ steps.resolve_execution.outputs.verify_depth }}"
          echo "Reference mode: ${{ steps.resolve_execution.outputs.ref_mode }}"
          echo "Publish: ${{ steps.resolve_execution.outputs.publish }}"
          echo "Allow-failure mode: ${{ steps.resolve_execution.outputs.allow_failure_mode }}"
          echo "Lane count (total): ${{ steps.generate.outputs.lane_count_total }}"
          echo "Lane counts (by runtime): ${{ steps.generate.outputs.lane_counts_json }}"

  ref-lanes:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.lane_count_total != '0' }}
    name: ${{ matrix.lane.name }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix_all) }}
    uses: ./.github/workflows/pipeline-run-lane-reusable.yml
    secrets: inherit
    with:
      lane_name: ${{ matrix.lane.name }}
      lane_json: ${{ toJSON(matrix.lane) }}
      verify_depth: ${{ needs.build-matrix.outputs.verify_depth }}
      goal: ${{ needs.build-matrix.outputs.goal }}
      ref_mode: ${{ needs.build-matrix.outputs.ref_mode }}
      publish: ${{ needs.build-matrix.outputs.publish }}
      allow_failure_mode: ${{ needs.build-matrix.outputs.allow_failure_mode }}
