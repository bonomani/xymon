name: Export container catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-ubuntu-container-catalog:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export container catalog
        run: python .github/scripts/export-container-catalog.py

      - name: Commit and push container catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ci/deps/platform-intent.yaml .github/data/container-catalog.yml
          if git diff --staged --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Update container catalog'
          git push
