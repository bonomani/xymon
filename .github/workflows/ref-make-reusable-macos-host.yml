name: Reference Lane - Reusable macOS Host

on:
  workflow_call:
    inputs:
      lane_name:
        description: Display name for the lane
        required: true
        type: string
      lane_json:
        description: JSON-encoded lane object
        required: true
        type: string
      goal:
        description: Execution goal (verify|ref|package|image)
        required: false
        default: ref
        type: string
      ref_mode:
        description: Reference mode when goal=ref (generate|compare)
        required: false
        default: generate
        type: string
      publish:
        description: Publish channel (none|artifact|registry)
        required: false
        default: none
        type: string
      allow_failure_mode:
        description: Handling of lanes marked allow_failure (off|allow|expect_fail)
        required: false
        default: allow
        type: string
      upload_artifacts:
        description: Override artifact upload behavior (1 or 0)
        required: false
        default: ''
        type: string
      run_compare:
        description: Run compare policy checks (1 or 0)
        required: false
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  macos-host:
    name: ${{ inputs.lane_name }}
    runs-on: ${{ fromJSON(inputs.lane_json).runner || fromJSON(inputs.lane_json).runs_on }}
    env:
      GOAL: ${{ inputs.goal }}
      REF_MODE: ${{ inputs.ref_mode }}
      PUBLISH: ${{ inputs.publish }}
      DEP_MODE: ${{ inputs.goal == 'ref' && inputs.ref_mode == 'compare' && 'compare' || 'generate' }}
      BUILD_TOOL: ${{ fromJSON(inputs.lane_json).build_tool }}
      VARIANT: ${{ fromJSON(inputs.lane_json).variant }}
      ENABLE_LDAP: ${{ fromJSON(inputs.lane_json).variant == 'server' && 'ON' || 'OFF' }}
      ENABLE_SNMP: ${{ fromJSON(inputs.lane_json).variant == 'server' && 'ON' || 'OFF' }}
      LEGACY_APPLY_OWNERSHIP: ON
      XYMONUSER: _www
      XYMONGROUP: _www
      REF_OS: ${{ fromJSON(inputs.lane_json).ref_os }}
      PLATFORM_OS: ${{ fromJSON(inputs.lane_json).platform_os }}
      PLATFORM_ID: ${{ fromJSON(inputs.lane_json).platform_id }}
      OS_VERSION: ${{ fromJSON(inputs.lane_json).os_version }}
      ARTIFACT_ARCH: ${{ fromJSON(inputs.lane_json).artifact_arch }}
      BASELINE_ROOT: ${{ fromJSON(inputs.lane_json).baseline_root }}
      ARTIFACT_FAMILY: ${{ fromJSON(inputs.lane_json).artifact_family }}
      REF_STAGE_ROOT: ${{ github.workspace }}/tmp/xymon-refs
      UPLOAD_ARTIFACTS: ${{ inputs.upload_artifacts != '' && inputs.upload_artifacts || (inputs.publish == 'artifact' && '1' || '0') }}
      RUN_COMPARE: ${{ inputs.run_compare }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run lane orchestration on macOS host
        id: lane_run
        continue-on-error: ${{ inputs.allow_failure_mode != 'off' && fromJSON(inputs.lane_json).allow_failure == true }}
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/run-ref-lane.sh \
            --build "${BUILD_TOOL}" \
            --goal "${GOAL}" \
            --ref-mode "${REF_MODE}" \
            --publish "${PUBLISH}" \
            --ref-os "${REF_OS}" \
            --platform-os "${PLATFORM_OS}" \
            --version "${OS_VERSION}" \
            --variant "${VARIANT}" \
            --baseline-root "${BASELINE_ROOT}" \
              --artifact-family "${ARTIFACT_FAMILY}" \
              --platform-id "${PLATFORM_ID}" \
              --run-compare "${RUN_COMPARE}"

      - name: Enforce expected failure reset
        if: ${{ always() && inputs.allow_failure_mode == 'expect_fail' && fromJSON(inputs.lane_json).allow_failure == true }}
        shell: bash
        run: |
          case "${{ steps.lane_run.outcome }}" in
            failure)
              echo "allow_failure lane failed as expected."
              ;;
            success)
              echo "allow_failure lane succeeded unexpectedly. Remove allow_failure for this lane." >&2
              exit 1
              ;;
            *)
              echo "allow_failure lane ended with outcome='${{ steps.lane_run.outcome }}'." >&2
              exit 1
              ;;
          esac

      - name: Upload dependency report
        if: ${{ always() && env.UPLOAD_ARTIFACTS == '1' && (env.DEP_MODE == 'compare' || (env.DEP_MODE == 'generate' && !failure() && !cancelled())) }}
        uses: ./.github/actions/upload-deps-report
        with:
          dep_mode: ${{ env.DEP_MODE }}
          build_tool: ${{ env.BUILD_TOOL }}
          platform_id: ${{ env.PLATFORM_ID }}
          variant: ${{ env.VARIANT }}
          artifact_arch: ${{ env.ARTIFACT_ARCH }}
          lane_name: ${{ inputs.lane_name }}
          artifact_family: ${{ env.ARTIFACT_FAMILY }}
          ref_stage_root: ${{ env.REF_STAGE_ROOT }}
          ref_os: ${{ env.REF_OS }}
          if_no_files_found: warn

      - name: Upload legacy references
        if: ${{ env.GOAL == 'ref' && env.REF_MODE == 'generate' && env.UPLOAD_ARTIFACTS == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: ref_${{ env.BUILD_TOOL }}_${{ env.REF_OS }}-${{ env.VARIANT }}__${{ env.PLATFORM_ID }}__${{ env.ARTIFACT_ARCH }}
          path: |
            ${{ env.REF_STAGE_ROOT }}/${{ env.BUILD_TOOL }}.${{ env.REF_OS }}.${{ env.VARIANT }}/**
          if-no-files-found: error

      - name: Upload artifacts
        if: ${{ always() && env.GOAL == 'ref' && env.REF_MODE == 'compare' && env.UPLOAD_ARTIFACTS == '1' }}
        uses: ./.github/actions/upload-ref-valid-artifacts
        with:
          lane_name: ${{ inputs.lane_name }}
          if_no_files_found: warn
          extra_paths: |
            .ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/${{ env.BUILD_TOOL }}-${{ env.PLATFORM_ID }}-${{ env.VARIANT }}/**
            .ci-artifacts/ref-valid-${{ env.ARTIFACT_FAMILY }}/refs/${{ env.BUILD_TOOL }}.${{ env.REF_OS }}.${{ env.VARIANT }}/**

      - name: Skip artifacts when upload is disabled
        if: ${{ always() && env.UPLOAD_ARTIFACTS != '1' }}
        shell: bash
        run: |
          echo "Skipping actions/upload-artifact for this lane."
