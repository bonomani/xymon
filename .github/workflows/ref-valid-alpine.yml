name: Reference Validation - Alpine

on:
  workflow_dispatch:

jobs:
  ref-valid-alpine:
    runs-on: ${{ matrix.runs_on }}
    container:
      image: ${{ matrix.container }}
      options: ${{ matrix.container_options || '--platform linux/amd64' }}
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Alpine 3.23 amd64 - Server
            runs_on: ubuntu-22.04
            container: alpine:3.23
            container_options: --platform linux/amd64
            alpine_version: "3.23"
            variant: server
            allow_failure: false
          - name: Alpine 3.23 amd64 - Client (ct-client)
            runs_on: ubuntu-22.04
            container: alpine:3.23
            container_options: --platform linux/amd64
            alpine_version: "3.23"
            variant: localclient
            allow_failure: false
          - name: Alpine 3.23 amd64 - Client (ct-server)
            runs_on: ubuntu-22.04
            container: alpine:3.23
            container_options: --platform linux/amd64
            alpine_version: "3.23"
            variant: client
            allow_failure: false
          - name: Alpine 3.23 arm64 - Server
            runs_on: ubuntu-24.04-arm
            container: alpine:3.23
            container_options: --platform linux/arm64/v8
            alpine_version: "3.23"
            variant: server
            allow_failure: false
          - name: Alpine 3.23 arm64 - Client (ct-client)
            runs_on: ubuntu-24.04-arm
            container: alpine:3.23
            container_options: --platform linux/arm64/v8
            alpine_version: "3.23"
            variant: localclient
            allow_failure: false
          - name: Alpine 3.23 arm64 - Client (ct-server)
            runs_on: ubuntu-24.04-arm
            container: alpine:3.23
            container_options: --platform linux/arm64/v8
            alpine_version: "3.23"
            variant: client
            allow_failure: false
          - name: Alpine 3.22 amd64 - Server
            runs_on: ubuntu-22.04
            container: alpine:3.22
            container_options: --platform linux/amd64
            alpine_version: "3.22"
            variant: server
            allow_failure: false
          - name: Alpine 3.22 amd64 - Client (ct-client)
            runs_on: ubuntu-22.04
            container: alpine:3.22
            container_options: --platform linux/amd64
            alpine_version: "3.22"
            variant: localclient
            allow_failure: false
          - name: Alpine 3.22 amd64 - Client (ct-server)
            runs_on: ubuntu-22.04
            container: alpine:3.22
            container_options: --platform linux/amd64
            alpine_version: "3.22"
            variant: client
            allow_failure: false
          - name: Alpine 3.22 arm64 - Server
            runs_on: ubuntu-24.04-arm
            container: alpine:3.22
            container_options: --platform linux/arm64/v8
            alpine_version: "3.22"
            variant: server
            allow_failure: false
          - name: Alpine 3.22 arm64 - Client (ct-client)
            runs_on: ubuntu-24.04-arm
            container: alpine:3.22
            container_options: --platform linux/arm64/v8
            alpine_version: "3.22"
            variant: localclient
            allow_failure: false
          - name: Alpine 3.22 arm64 - Client (ct-server)
            runs_on: ubuntu-24.04-arm
            container: alpine:3.22
            container_options: --platform linux/arm64/v8
            alpine_version: "3.22"
            variant: client
            allow_failure: false
          - name: Alpine 3.21 amd64 - Server
            runs_on: ubuntu-22.04
            container: alpine:3.21
            container_options: --platform linux/amd64
            alpine_version: "3.21"
            variant: server
            allow_failure: true
          - name: Alpine 3.21 amd64 - Client (ct-client)
            runs_on: ubuntu-22.04
            container: alpine:3.21
            container_options: --platform linux/amd64
            alpine_version: "3.21"
            variant: localclient
            allow_failure: true
          - name: Alpine 3.21 amd64 - Client (ct-server)
            runs_on: ubuntu-22.04
            container: alpine:3.21
            container_options: --platform linux/amd64
            alpine_version: "3.21"
            variant: client
            allow_failure: true
          - name: Alpine 3.21 arm64 - Server
            runs_on: ubuntu-24.04-arm
            container: alpine:3.21
            container_options: --platform linux/arm64/v8
            alpine_version: "3.21"
            variant: server
            allow_failure: true
          - name: Alpine 3.21 arm64 - Client (ct-client)
            runs_on: ubuntu-24.04-arm
            container: alpine:3.21
            container_options: --platform linux/arm64/v8
            alpine_version: "3.21"
            variant: localclient
            allow_failure: true
          - name: Alpine 3.21 arm64 - Client (ct-server)
            runs_on: ubuntu-24.04-arm
            container: alpine:3.21
            container_options: --platform linux/arm64/v8
            alpine_version: "3.21"
            variant: client
            allow_failure: true
          - name: Alpine 3.20 amd64 - Server
            runs_on: ubuntu-22.04
            container: alpine:3.20
            container_options: --platform linux/amd64
            alpine_version: "3.20"
            variant: server
            allow_failure: true
          - name: Alpine 3.20 amd64 - Client (ct-client)
            runs_on: ubuntu-22.04
            container: alpine:3.20
            container_options: --platform linux/amd64
            alpine_version: "3.20"
            variant: localclient
            allow_failure: true
          - name: Alpine 3.20 amd64 - Client (ct-server)
            runs_on: ubuntu-22.04
            container: alpine:3.20
            container_options: --platform linux/amd64
            alpine_version: "3.20"
            variant: client
            allow_failure: true
          - name: Alpine 3.19 amd64 - Server
            runs_on: ubuntu-22.04
            container: alpine:3.19
            container_options: --platform linux/amd64
            alpine_version: "3.19"
            variant: server
            allow_failure: true
          - name: Alpine 3.19 amd64 - Client (ct-client)
            runs_on: ubuntu-22.04
            container: alpine:3.19
            container_options: --platform linux/amd64
            alpine_version: "3.19"
            variant: localclient
            allow_failure: true
          - name: Alpine 3.19 amd64 - Client (ct-server)
            runs_on: ubuntu-22.04
            container: alpine:3.19
            container_options: --platform linux/amd64
            alpine_version: "3.19"
            variant: client
            allow_failure: true
          - name: Alpine edge amd64 - Server
            runs_on: ubuntu-22.04
            container: alpine:edge
            container_options: --platform linux/amd64
            alpine_version: "edge"
            variant: server
            allow_failure: true
          - name: Alpine edge amd64 - Client (ct-client)
            runs_on: ubuntu-22.04
            container: alpine:edge
            container_options: --platform linux/amd64
            alpine_version: "edge"
            variant: localclient
            allow_failure: true
          - name: Alpine edge amd64 - Client (ct-server)
            runs_on: ubuntu-22.04
            container: alpine:edge
            container_options: --platform linux/amd64
            alpine_version: "edge"
            variant: client
            allow_failure: true
          - name: Alpine edge arm64 - Server
            runs_on: ubuntu-24.04-arm
            container: alpine:edge
            container_options: --platform linux/arm64/v8
            alpine_version: "edge"
            variant: server
            allow_failure: true
          - name: Alpine edge arm64 - Client (ct-client)
            runs_on: ubuntu-24.04-arm
            container: alpine:edge
            container_options: --platform linux/arm64/v8
            alpine_version: "edge"
            variant: localclient
            allow_failure: true
          - name: Alpine edge arm64 - Client (ct-server)
            runs_on: ubuntu-24.04-arm
            container: alpine:edge
            container_options: --platform linux/arm64/v8
            alpine_version: "edge"
            variant: client
            allow_failure: true

    name: ${{ matrix.name }}
    env:
      VARIANT: ${{ matrix.variant }}
      ENABLE_LDAP: ${{ matrix.variant == 'server' && 'ON' || 'OFF' }}
      ENABLE_SNMP: ${{ matrix.variant == 'server' && 'ON' || 'OFF' }}
      LEGACY_APPLY_OWNERSHIP: ON

    steps:
      - name: Prepare checkout tools in container
        shell: sh
        run: |
          set -eu
          need_install=0
          command -v tar >/dev/null 2>&1 || need_install=1
          command -v git >/dev/null 2>&1 || need_install=1
          command -v awk >/dev/null 2>&1 || need_install=1
          command -v update-ca-certificates >/dev/null 2>&1 || need_install=1
          [ "${need_install}" -eq 1 ] || exit 0

          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends tar git gawk ca-certificates
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive refresh
            zypper --non-interactive install tar git gawk ca-certificates
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache tar git gawk ca-certificates bash
          elif command -v dnf >/dev/null 2>&1; then
            dnf -y install tar git gawk ca-certificates
          elif command -v yum >/dev/null 2>&1; then
            yum -y install tar git gawk ca-certificates
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm archlinux-keyring || true
            pacman -S --noconfirm tar git gawk ca-certificates
          else
            echo "Unsupported package manager for installing checkout tools" >&2
            exit 2
          fi

      - name: Checkout (amd64 lanes)
        if: ${{ !contains(matrix.name, ' arm64 -') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout (arm64 lanes, shell fallback)
        if: ${{ contains(matrix.name, ' arm64 -') }}
        shell: sh
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git config --global --add safe.directory "${GITHUB_WORKSPACE:-$(pwd)}"
          git config --global --add safe.directory "$(pwd)"
          git init .
          git remote add origin "https://github.com/${REPO}.git"
          git fetch --depth 1 origin "${SHA}"
          git checkout --detach "${SHA}"

      - name: Load legacy hostname (runs for each matrix variant)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/load-legacy-hostname.sh \
            --config "docs/cmake-legacy-migration/refs/make_linux/server/var/lib/xymon/server/etc/xymonserver.cfg"
      - name: Seed baseline UID/GID identities (container)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/seed-legacy-identities.sh \
            --passwd "docs/cmake-legacy-migration/refs/make_linux/${{ matrix.variant }}/owners.passwd" \
            --group "docs/cmake-legacy-migration/refs/make_linux/${{ matrix.variant }}/owners.group"
      - name: Bootstrap install + metadata (CMake)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/bootstrap-cmake.sh \
            --os linux \
            --variant "${{ matrix.variant }}"
      - name: Load staged tree metadata
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/load-staged-metadata.sh
      - name: Validate config.h parity
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run/ref/validate-config-parity.sh \
            --legacy-config "docs/cmake-legacy-migration/refs/make_linux/${{ matrix.variant }}/meta/config.h"
      - name: Generate CMake refs snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xymon-refs
          bash ci/generate-refs.sh \
            --os linux \
            --variant "${{ matrix.variant }}" \
            --build cmake \
            --root "${LEGACY_ROOT}" \
            --topdir "${LEGACY_TOPDIR}" \
            --config-h "${XYMON_CONFIG_H:-}" \
            --refs-root /tmp/xymon-refs

      - name: Compare refs snapshot (blocking policy checks)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/compare-refs.sh \
            --baseline-prefix "docs/cmake-legacy-migration/refs/make_linux/${{ matrix.variant }}" \
            --candidate-dir "/tmp/xymon-refs/cmake.linux.${{ matrix.variant }}" \
            --candidate-root "${LEGACY_ROOT}"

      - name: Upload artifacts
        if: ${{ always() && !contains(matrix.name, ' arm64 -') }}
        uses: actions/upload-artifact@v4
        with:
          name: ref-valid-${{ matrix.name }}
          path: |
            /tmp/legacy.config.extract
            /tmp/cmake.config.extract
            /tmp/config.diff
            /tmp/legacy.list
            /tmp/cmake.list
            /tmp/cmake.filtered.list
            /tmp/allowed-extras.list
            /tmp/legacy-cmake.diff
            /tmp/legacy.keyfiles.missing
            /tmp/legacy.keyfiles.sha256
            /tmp/legacy.keyfiles.perms
            /tmp/legacy.keyfiles.sha256.diff
            /tmp/legacy.symlinks.broken
            /tmp/legacy.symlinks.list
            /tmp/legacy.perms.snapshot
            /tmp/legacy.owners.snapshot
            /tmp/legacy.bin.links
            /tmp/legacy.embedded.paths
            /tmp/legacy.symlinks.diff
            /tmp/legacy.perms.diff
            /tmp/legacy.owners.diff
            /tmp/legacy.owners.names.diff
            /tmp/legacy.binlinks.diff
            /tmp/legacy.needed.norm.diff
            /tmp/legacy.embedded.diff
            /tmp/install-cmake-legacy.log
            /tmp/cmake.configure.log
            /tmp/cmake.trace.json
            /tmp/cmake.trace.log
