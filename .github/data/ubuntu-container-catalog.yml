      amd64:
        runner: "ubuntu-22.04"
        runtime_preference:
          - "linux_host"
          - "linux_container"
      arm64:
        runner: "ubuntu-22.04-arm"
        runtime_preference:
          - "linux_host"
          - "linux_container"
