source:
  intent_file: "ci/deps/platform-intent.yaml"
  host_runner_catalog: ".github/data/github-host-runners.yml"
  registry_base: "https://registry-1.docker.io"
  token_service: "https://auth.docker.io/token"
  repository: "library/ubuntu"
  repository_url: "https://hub.docker.com/_/ubuntu"
platforms:
  - platform_id: "ubuntu-20"
    image: "ubuntu:20.04"
    platform_os: "ubuntu"
    platform_version: "20.04"
    deps:
      family: "ubuntu"
      os: "ubuntu"
      version: "20"
    intended_arches:
      - "amd64"
      - "arm64"
    discovered:
      manifest_url: "https://registry-1.docker.io/v2/library/ubuntu/manifests/20.04"
      content_type: "application/vnd.oci.image.index.v1+json"
      digest: "sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214"
      arches:
        - "amd64"
        - "arm32v7"
        - "arm64"
        - "ppc64le"
        - "riscv64"
        - "s390x"
    host_support:
      amd64:
        runner: null
        runtime_preference:
          - "linux_container"
      arm64:
        runner: null
        runtime_preference:
          - "linux_container"
  - platform_id: "ubuntu-22"
