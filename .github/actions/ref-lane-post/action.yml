name: Reference Lane Post
description: Shared post-processing for ref lanes (expected-failure policy and artifact uploads).

inputs:
  lane_post_json:
    description: Canonical post-processing payload as JSON mapping.
    required: true
  lane_outcome:
    description: Outcome of the lane execution step (success|failure|cancelled|...).
    required: true
  dep_if_no_files_found:
    description: if-no-files-found behavior for dependency report upload.
    required: false
    default: warn
  ref_valid_if_no_files_found:
    description: if-no-files-found behavior for ref-valid upload.
    required: false
    default: warn
  extra_paths:
    description: Optional extra paths for compare-mode artifact upload.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Enforce expected failure reset
      if: ${{ fromJSON(inputs.lane_post_json).allow_failure_mode == 'expect_fail' && fromJSON(inputs.lane_post_json).lane_allow_failure == '1' }}
      shell: bash
      run: |
        case "${{ inputs.lane_outcome }}" in
          failure)
            echo "allow_failure lane failed as expected."
            ;;
          success)
            echo "allow_failure lane succeeded unexpectedly. Remove allow_failure for this lane." >&2
            exit 1
            ;;
          *)
            echo "allow_failure lane ended with outcome='${{ inputs.lane_outcome }}'." >&2
            exit 1
            ;;
        esac

    - name: Upload dependency report
      if: ${{ fromJSON(inputs.lane_post_json).upload_artifacts == '1' && (fromJSON(inputs.lane_post_json).dep_mode == 'compare' || inputs.lane_outcome == 'success') }}
      uses: ./.github/actions/upload-deps-report
      with:
        dep_mode: ${{ fromJSON(inputs.lane_post_json).dep_mode }}
        report_path: ${{ fromJSON(inputs.lane_post_json).ci_deps_report_json }}
        build_tool: ${{ fromJSON(inputs.lane_post_json).build_tool }}
        platform_id: ${{ fromJSON(inputs.lane_post_json).platform_id }}
        variant: ${{ fromJSON(inputs.lane_post_json).variant }}
        artifact_arch: ${{ fromJSON(inputs.lane_post_json).artifact_arch }}
        lane_name: ${{ fromJSON(inputs.lane_post_json).lane_name }}
        if_no_files_found: ${{ inputs.dep_if_no_files_found }}

    - name: Upload legacy references
      if: ${{ fromJSON(inputs.lane_post_json).goal == 'ref' && fromJSON(inputs.lane_post_json).dep_mode == 'generate' && fromJSON(inputs.lane_post_json).upload_artifacts == '1' && inputs.lane_outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ fromJSON(inputs.lane_post_json).ref_generate_artifact_name }}
        path: ${{ fromJSON(inputs.lane_post_json).ref_generate_artifact_path }}
        if-no-files-found: error

    - name: Upload artifacts
      if: ${{ fromJSON(inputs.lane_post_json).goal == 'ref' && fromJSON(inputs.lane_post_json).dep_mode == 'compare' && fromJSON(inputs.lane_post_json).upload_artifacts == '1' }}
      uses: ./.github/actions/upload-ref-valid-artifacts
      with:
        lane_name: ${{ fromJSON(inputs.lane_post_json).lane_name }}
        if_no_files_found: ${{ inputs.ref_valid_if_no_files_found }}
        extra_paths: |
          ${{ inputs.extra_paths }}
          ${{ fromJSON(inputs.lane_post_json).ref_compare_artifact_path }}
          ${{ fromJSON(inputs.lane_post_json).ref_compare_refs_path }}

    - name: Skip artifacts when upload is disabled
      if: ${{ fromJSON(inputs.lane_post_json).upload_artifacts != '1' }}
      shell: bash
      run: |
        echo "Skipping actions/upload-artifact for this lane."
