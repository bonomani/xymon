name: Reference Lane Post
description: Shared post-processing for ref lanes (expected-failure policy and artifact uploads).

inputs:
  lane_env_json:
    description: Canonical lane environment payload as JSON mapping.
    required: true
  lane_outcome:
    description: Outcome of the lane execution step (success|failure|cancelled|...).
    required: true
  dep_if_no_files_found:
    description: if-no-files-found behavior for dependency report upload.
    required: false
    default: warn
  ref_valid_if_no_files_found:
    description: if-no-files-found behavior for ref-valid upload.
    required: false
    default: warn
  extra_paths:
    description: Optional extra paths for compare-mode artifact upload.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Decode lane env
      id: lane_env
      shell: bash
      env:
        INPUT_LANE_ENV_JSON: ${{ inputs.lane_env_json }}
      run: |
        set -euo pipefail

        python3 - <<'PY'
        import json
        import os
        import sys


        def fail(msg: str) -> None:
            print(msg, file=sys.stderr)
            raise SystemExit(2)


        def get_required(env: dict[str, str], key: str) -> str:
            val = str(env.get(key, "")).strip()
            if not val:
                fail(f"lane_env_json missing required key: {key}")
            return val


        try:
            payload = json.loads(os.environ["INPUT_LANE_ENV_JSON"])
        except Exception as exc:
            fail(f"lane_env_json is invalid JSON: {exc}")

        if not isinstance(payload, dict):
            fail("lane_env_json must decode to an object")

        required = [
            "ALLOW_FAILURE_MODE",
            "LANE_ALLOW_FAILURE",
            "GOAL",
            "DEP_MODE",
            "REF_MODE",
            "CI_DEPS_REPORT_JSON",
            "UPLOAD_ARTIFACTS",
            "BUILD_TOOL",
            "PLATFORM_ID",
            "VARIANT",
            "ARTIFACT_ARCH",
            "LANE_NAME",
            "ARTIFACT_FAMILY",
            "REF_STAGE_ROOT",
            "REF_OS",
        ]

        out_lines = []
        for key in required:
            out_lines.append(f"{key.lower()}={get_required(payload, key)}")

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            for line in out_lines:
                fh.write(f"{line}\n")
        PY

    - name: Enforce expected failure reset
      if: ${{ steps.lane_env.outputs.allow_failure_mode == 'expect_fail' && steps.lane_env.outputs.lane_allow_failure == '1' }}
      shell: bash
      run: |
        case "${{ inputs.lane_outcome }}" in
          failure)
            echo "allow_failure lane failed as expected."
            ;;
          success)
            echo "allow_failure lane succeeded unexpectedly. Remove allow_failure for this lane." >&2
            exit 1
            ;;
          *)
            echo "allow_failure lane ended with outcome='${{ inputs.lane_outcome }}'." >&2
            exit 1
            ;;
        esac

    - name: Upload dependency report
      if: ${{ steps.lane_env.outputs.upload_artifacts == '1' && (steps.lane_env.outputs.dep_mode == 'compare' || inputs.lane_outcome == 'success') }}
      uses: ./.github/actions/upload-deps-report
      with:
        dep_mode: ${{ steps.lane_env.outputs.dep_mode }}
        report_path: ${{ steps.lane_env.outputs.ci_deps_report_json }}
        build_tool: ${{ steps.lane_env.outputs.build_tool }}
        platform_id: ${{ steps.lane_env.outputs.platform_id }}
        variant: ${{ steps.lane_env.outputs.variant }}
        artifact_arch: ${{ steps.lane_env.outputs.artifact_arch }}
        lane_name: ${{ steps.lane_env.outputs.lane_name }}
        if_no_files_found: ${{ inputs.dep_if_no_files_found }}

    - name: Upload legacy references
      if: ${{ steps.lane_env.outputs.goal == 'ref' && steps.lane_env.outputs.dep_mode == 'generate' && steps.lane_env.outputs.upload_artifacts == '1' && inputs.lane_outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ format('ref_{0}_{1}-{2}__{3}__{4}', steps.lane_env.outputs.build_tool, steps.lane_env.outputs.ref_os, steps.lane_env.outputs.variant, steps.lane_env.outputs.platform_id, steps.lane_env.outputs.artifact_arch) }}
        path: |
          ${{ steps.lane_env.outputs.ref_stage_root }}/${{ steps.lane_env.outputs.build_tool }}.${{ steps.lane_env.outputs.ref_os }}.${{ steps.lane_env.outputs.variant }}/**
        if-no-files-found: error

    - name: Upload artifacts
      if: ${{ steps.lane_env.outputs.goal == 'ref' && steps.lane_env.outputs.dep_mode == 'compare' && steps.lane_env.outputs.upload_artifacts == '1' }}
      uses: ./.github/actions/upload-ref-valid-artifacts
      with:
        lane_name: ${{ steps.lane_env.outputs.lane_name }}
        if_no_files_found: ${{ inputs.ref_valid_if_no_files_found }}
        extra_paths: |
          ${{ inputs.extra_paths }}
          .ci-artifacts/ref-valid-${{ steps.lane_env.outputs.artifact_family }}/${{ steps.lane_env.outputs.build_tool }}-${{ steps.lane_env.outputs.platform_id }}-${{ steps.lane_env.outputs.variant }}/**
          .ci-artifacts/ref-valid-${{ steps.lane_env.outputs.artifact_family }}/refs/${{ steps.lane_env.outputs.build_tool }}.${{ steps.lane_env.outputs.ref_os }}.${{ steps.lane_env.outputs.variant }}/**

    - name: Skip artifacts when upload is disabled
      if: ${{ steps.lane_env.outputs.upload_artifacts != '1' }}
      shell: bash
      run: |
        echo "Skipping actions/upload-artifact for this lane."
