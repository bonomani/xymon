name: Upload Dependency Report
description: Upload a normalized dependency report artifact for a ref lane.

inputs:
  goal:
    description: Execution goal (verify|ref).
    required: true
  ref_mode:
    description: Reference mode (generate|compare).
    required: true
  report_path:
    description: Canonical dependency report path to upload.
    required: true
  build_tool:
    description: Build tool used by the lane.
    required: true
  platform_id:
    description: Stable platform identifier for the lane.
    required: true
  variant:
    description: Variant name (server, client, localclient).
    required: true
  artifact_arch:
    description: Normalized artifact architecture label.
    required: true
  lane_name:
    description: Display lane name.
    required: true
  if_no_files_found:
    description: upload-artifact behavior when the report path is missing.
    required: false
    default: warn

runs:
  using: composite
  steps:
    - name: Derive dependency mode
      id: derive_mode
      shell: bash
      run: |
        set -euo pipefail
        dep_mode="generate"
        if [[ "${{ inputs.goal }}" == "ref" && "${{ inputs.ref_mode }}" == "compare" ]]; then
          dep_mode="compare"
        fi
        echo "dep_mode=${dep_mode}" >> "${GITHUB_OUTPUT}"

    - name: Upload dependency report artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ format('deps_{0}_{1}_{2}__{3}__{4}__{5}', inputs.build_tool, inputs.platform_id, inputs.variant, inputs.artifact_arch, steps.derive_mode.outputs.dep_mode, inputs.lane_name) }}
        path: ${{ inputs.report_path }}
        if-no-files-found: ${{ inputs.if_no_files_found }}
