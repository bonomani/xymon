name: Upload Dependency Report
description: Upload a normalized dependency report artifact for a ref lane.

inputs:
  dep_mode:
    description: Dependency report mode (generate or compare).
    required: true
  build_tool:
    description: Build tool used by the lane.
    required: true
  platform_id:
    description: Stable platform identifier for the lane.
    required: true
  variant:
    description: Variant name (server, client, localclient).
    required: true
  artifact_arch:
    description: Normalized artifact architecture label.
    required: true
  lane_name:
    description: Display lane name.
    required: true
  artifact_family:
    description: Artifact family used for compare-mode reports.
    required: true
  ref_stage_root:
    description: Root containing generated refs for generate mode.
    required: true
  ref_os:
    description: Logical ref OS used in generate-mode path names.
    required: true
  if_no_files_found:
    description: upload-artifact behavior when the report path is missing.
    required: false
    default: warn

runs:
  using: composite
  steps:
    - name: Resolve dependency report path
      id: resolve_path
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${{ inputs.dep_mode }}" == "compare" ]]; then
          report_path=".ci-artifacts/ref-valid-${{ inputs.artifact_family }}/${{ inputs.build_tool }}-${{ inputs.platform_id }}-${{ inputs.variant }}/deps-report.json"
        else
          report_path="${{ inputs.ref_stage_root }}/${{ inputs.build_tool }}.${{ inputs.ref_os }}.${{ inputs.variant }}/meta/deps-report.json"
        fi
        echo "report_path=${report_path}" >> "${GITHUB_OUTPUT}"

    - name: Upload dependency report artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ format('deps_{0}_{1}_{2}__{3}__{4}__{5}', inputs.build_tool, inputs.platform_id, inputs.variant, inputs.artifact_arch, inputs.dep_mode, inputs.lane_name) }}
        path: ${{ steps.resolve_path.outputs.report_path }}
        if-no-files-found: ${{ inputs.if_no_files_found }}
