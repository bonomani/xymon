name: Upload Dependency Report
description: Upload a normalized dependency report artifact for a ref lane.

inputs:
  dep_mode:
    description: Dependency report mode (generate|compare).
    required: true
  report_path:
    description: Canonical dependency report path to upload.
    required: true
  build_tool:
    description: Build tool used by the lane.
    required: true
  platform_id:
    description: Stable platform identifier for the lane.
    required: true
  variant:
    description: Variant name (server, client, localclient).
    required: true
  artifact_arch:
    description: Normalized artifact architecture label.
    required: true
  lane_name:
    description: Display lane name.
    required: true
  if_no_files_found:
    description: upload-artifact behavior when the report path is missing.
    required: false
    default: warn

runs:
  using: composite
  steps:
    - name: Upload dependency report artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ format('deps__{0}__{1}__{2}__{3}__{4}__{5}', inputs.build_tool, inputs.platform_id, inputs.variant, inputs.artifact_arch, inputs.dep_mode, inputs.lane_name) }}
        path: ${{ inputs.report_path }}
        if-no-files-found: ${{ inputs.if_no_files_found }}
